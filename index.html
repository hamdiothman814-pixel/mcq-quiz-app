<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>اختبار الحموض الأمينية والبروتينات</title>
<style>
  * { box-sizing: border-box; }
  body { font-family: system-ui, 'Segoe UI', Tahoma, sans-serif; background: #F8F6F1; color: #1a1a1a; margin: 0; padding: 16px; }
  .wrap { max-width: 680px; margin: 0 auto; }
  h1 { text-align: center; color: #0C6B57; font-size: 22px; margin: 8px 0 4px; }
  .sub { text-align: center; color: #666; font-size: 14px; margin-bottom: 16px; }
  .card { background: #fff; border-radius: 14px; padding: 20px; box-shadow: 0 2px 10px rgba(0,0,0,.08); }
  .progress { height: 10px; background: #e8e4dc; border-radius: 6px; overflow: hidden; margin-bottom: 6px; }
  .bar { height: 100%; background: #0C6B57; width: 0%; transition: width .3s; }
  .meta { display: flex; justify-content: space-between; color: #666; font-size: 13px; margin-bottom: 14px; }
  .qtext { font-size: 18px; font-weight: 700; line-height: 1.7; margin-bottom: 16px; }
  .opt { display: block; width: 100%; text-align: right; font-size: 16px; line-height: 1.6; padding: 12px 14px; margin-bottom: 10px; border: 2px solid #ddd; border-radius: 10px; background: #fff; cursor: pointer; }
  .opt:hover:not(:disabled) { border-color: #0C6B57; }
  .opt:disabled { cursor: default; opacity: .95; }
  .opt.correct { border-color: #2e7d32; background: #e8f5e9; }
  .opt.wrong { border-color: #c62828; background: #fdecea; }
  .explain { display: none; background: #f1f6f4; border-right: 4px solid #0C6B57; padding: 12px 14px; border-radius: 8px; font-size: 15px; line-height: 1.7; margin-top: 6px; }
  .btn { display: block; width: 100%; padding: 14px; font-size: 17px; font-weight: 700; color: #fff; background: #0C6B57; border: none; border-radius: 10px; cursor: pointer; margin-top: 14px; }
  .btn:disabled { background: #aaa; }
  .btn2 { background: #D97706; }
  .score { text-align: center; font-size: 26px; font-weight: 800; color: #0C6B57; margin: 10px 0; }
  .rev { margin-bottom: 16px; padding-bottom: 14px; border-bottom: 1px solid #eee; }
  .rev .qt { font-weight: 700; line-height: 1.7; }
  .rev .ua { color: #c62828; }
  .rev .ca { color: #2e7d32; }
  .rev .ex { color: #555; font-size: 14px; line-height: 1.7; }
  .hidden { display: none; }
</style>
</head>
<body>
<div class="wrap">
  <h1>🧪 اختبار الحموض الأمينية والبروتينات</h1>
  <p class="sub">30 سؤال أتمتة من مرجع الكيمياء السريرية — أجب ثم اعرف النتيجة فوراً</p>

  <div id="quiz" class="card">
    <div class="progress"><div id="bar" class="bar"></div></div>
    <div class="meta"><span id="count"></span><span id="scoreLive"></span></div>
    <div id="qtext" class="qtext"></div>
    <div id="opts"></div>
    <div id="explain" class="explain"></div>
    <button id="next" class="btn" disabled>السؤال التالي</button>
  </div>

  <div id="result" class="card hidden">
    <div class="score" id="finalScore"></div>
    <p id="msg" style="text-align:center; font-size:16px; line-height:1.7;"></p>
    <div id="review"></div>
    <button id="restart" class="btn btn2">إعادة الاختبار</button>
  </div>
</div>

<script>
const L = ['أ','ب','ج','د'];
const QS = [
{q:'أيّ مما يلي من الحموض الأمينية الأساسية (القاعدية)؟',o:['الغلوتامات','الليزين','التيروزين','الأسبارتات'],a:1,e:'الليزين من المجموعات الأساسية (القاعدية) مع الأرجينين والهيستيدين.'},
{q:'المجموعة الحمضية من الحموض الأمينية تشمل:',o:['الليزين والأرجينين والهيستيدين','الغلوتامات والأسبارتات والسيستين','الليزين والغلوتامات والتيروزين','الأرجينين والأسبارتات والسيستين'],a:1,e:'المجموعات الحمضية: الغلوتامات والأسبارتات والسيستين والتيروزين.'},
{q:'التفاعل الأساسي الذي يزيل نتروجين الحموض الأمينية من الجسم يُعرف باسم:',o:['نزع الكربوكسيل','نقل الأمين (Transamination)','الفسفرة','التمسخ'],a:1,e:'نقل الأمين هو التفاعل الأساسي لإزالة نتروجين الحموض الأمينية.'},
{q:'في تفاعل نقل الأمين، تنتقل مجموعة الأمين من حمض أميني إلى:',o:['حمض دهني','حمض كيتوني لينتج حمضاً كيتونياً آخر وحمضاً أمينياً جديداً','جزيء غلوكوز','البولة مباشرة'],a:1,e:'تنتقل مجموعة الأمين إلى حمض كيتوني فينتج حمض كيتوني آخر وحمض أميني جديد.'},
{q:'الأمونيا الناتجة عن استقلاب الحموض الأمينية تتحول إلى بولة عن طريق:',o:['دورة البولة في الخلايا الكبدية','الكلية مباشرة','دورة كريبس','التخمر اللبني'],a:0,e:'تتحول الأمونيا إلى بولة عبر دورة البولة في الخلايا الكبدية ثم تُطرح في البول.'},
{q:'دوران البروتين اليومي الطبيعي (بناء وهدم) يبلغ حوالي:',o:['20–50 غ','125–220 غ','300–400 غ','500–600 غ'],a:1,e:'دوران البروتين الطبيعي حوالي 125–220 غ يومياً.'},
{q:'المحتوى النتروجيني لبروتينات المصل وسطياً حوالي:',o:['6%','10%','16%','25%'],a:2,e:'المحتوى النتروجيني لبروتينات المصل وسطياً حوالي 16%.'},
{q:'البنية الأولية للبروتين تمثل:',o:['الشكل العام ثلاثي الأبعاد للبروتين','عدد وأنواع الحموض الأمينية في تسلسلها','تفاعل أكثر من وحدة بروتينية مع بعضها','الروابط الهيدروجينية بين السلاسل'],a:1,e:'البنية الأولية هي عدد وأنواع الحموض الأمينية في التسلسل.'},
{q:'البنى الثانوية الشائعة للبروتين هي:',o:['الحلزون α والصفائح β','الحلزون المزدوج فقط','البنية الرابعية والثالثية','اللولب الثلاثي فقط'],a:0,e:'البنى الثانوية الشائعة: الحلزون α والصفائح β.'},
{q:'تستقر البنية الثانوية للبروتين بواسطة:',o:['الروابط التساهمية فقط','الروابط الهيدروجينية بين الحموض الأمينية','الروابط الأيونية فقط','قوى فان دير فالس فقط'],a:1,e:'تستقر البنية الثانوية بالروابط الهيدروجينية بين الحموض الأمينية.'},
{q:'البنية الثالثية للبروتين قد تتأثر بكل مما يلي عدا:',o:['الروابط الهيدروجينية','روابط الكبريت (ثنائي الكبريتيد)','التفاعلات الكارهة للماء','الروابط الببتيدية في التسلسل الأولي'],a:3,e:'البنية الثالثية تتأثر بالروابط الهيدروجينية وروابط الكبريت والتفاعلات الكارهة للماء، لا بالروابط الببتيدية في التسلسل الأولي.'},
{q:'البنية الرابعية للبروتين تنتج من:',o:['تفاعل أكثر من جزء من جزيء واحد أو وحدات بروتينية، مرتبطة بروابط غير تشاركية','تسلسل الحموض الأمينية فقط','ارتباط البروتين بالدهون فقط','الحلزون α وحده'],a:0,e:'البنية الرابعية تنتج من تفاعل أكثر من وحدة بروتينية بروابط غير تشاركية.'},
{q:'فقدان البروتين وظيفته وخصائصه الكيميائية عند اضطراب بنيته الثانوية أو الثالثية أو الرابعية يُدعى:',o:['التمسخ (Denaturation)','التخثر','التحلل المائي','الترسيب المناعي'],a:0,e:'فقدان الوظيفة عند اضطراب البنية يُدعى التمسخ.'},
{q:'من أسباب تمسخ البروتين:',o:['الحرارة وتغير الـ pH واليوريا والأشعة فوق البنفسجية','البرودة فقط','زيادة تركيز الألبومين فقط','نقص الفيتامينات فقط'],a:0,e:'التمسخ يحدث بالحرارة وتغير الـ pH واليوريا والأشعة فوق البنفسجية وتأثير الأنزيمات.'},
{q:'نقطة التعادل الكهربائي (PI) هي درجة الـ pH التي يكون عندها البروتين:',o:['ذا شحنة موجبة قصوى','ذا شحنة صافية مساوية للصفر','ذا شحنة سالبة قصوى','غير منحل أبداً'],a:1,e:'عند PI تكون الشحنة الصافية صفراً.'},
{q:'عندما تكون pH > PI فإن البروتين يحمل شحنة صافية:',o:['موجبة','سالبة','صفراً دائماً','متعادلة لا تتأثر'],a:1,e:'عندما تكون pH > PI يحمل البروتين شحنة سالبة صافية.'},
{q:'معظم البروتينات تقع قيم الـ PI الخاصة بها ضمن مجال:',o:['pH 1.0–3.0','pH 5.0–8.0','pH 9.0–12.0','pH 7.35–7.45 حصراً'],a:1,e:'معظم البروتينات ضمن مجال pH 5.0–8.0.'},
{q:'مثال على البروتينات الليفية التي تكوّن هيكل العضلات والأوتار والعظام:',o:['الألبومين','الكولاجين والإيلاستين والكيراتين','الفيريتين','الترانسفيرين'],a:1,e:'الكولاجين والإيلاستين والكيراتين بروتينات ليفية هيكلية.'},
{q:'البروتينات المقرتنة تتكون من مجموعات بروتينية وأخرى غير بروتينية، ومثال على البروتينات النووية منها:',o:['الميوسين','الكروماتين (مزيج DNA وبروتينات)','الكولاجين','الأنسولين'],a:1,e:'الكروماتين مثال على البروتينات النووية (DNA + بروتينات).'},
{q:'بروتينات البلازما ومعظم البروتينات الداخل خلوية عمرها النصفي يُقاس بـ:',o:['سنوات دائماً','ساعات أو أيام','دقائق فقط','أشهر فقط'],a:1,e:'عمرها النصفي يُقاس بالساعات أو الأيام، بينما الكولاجين ثابت نسبياً وقد يصل لسنوات.'},
{q:'سابق الألبومين (Prealbumin – Transthyretin) هو بروتين ناقل لـ:',o:['الحديد فقط','التيروكسين وثلاثي يودوتيرونين، ويرتبط بالبروتين الرابط للريتينول','النحاس فقط','الأكسجين'],a:1,e:'سابق الألبومين ناقل للتيروكسين وثلاثي يودوتيرونين ويرتبط بالبروتين الرابط للريتينول.'},
{q:'ينخفض مستوى سابق الألبومين في:',o:['الأمراض الكبدية والاستجابة للطور الحاد','الحمل فقط','فرط نشاط الدرق فقط','نقص الحديد فقط'],a:0,e:'ينخفض في الأمراض الكبدية والاستجابة للطور الحاد.'},
{q:'الألبومين في المصل ينقل:',o:['هرمونات الدرق وهرمونات أخرى والأدوية، ويرتبط بالحموض الدهنية','الأكسجين فقط','الحديد فقط','الغلوكوز فقط'],a:0,e:'الألبومين ينقل هرمونات الدرق وهرمونات أخرى والأدوية ويرتبط بالحموض الدهنية.'},
{q:'المجال المرجعي للألبومين في المصل حوالي:',o:['10–20 غ/ل','35–55 غ/ل','60–80 غ/ل','100–120 غ/ل'],a:1,e:'المجال المرجعي للألبومين حوالي 35–55 غ/ل.'},
{q:'الفيبرينوجين من بروتينات الطور الحاد، وهو يرتفع أيضاً في:',o:['الحمل ومع استعمال مانعات الحمل الفموية','نقص التغذية فقط','فقر الدم فقط','قصور الكلية فقط'],a:0,e:'الفيبرينوجين يرتفع في الحمل ومع مانعات الحمل الفموية.'},
{q:'البروتين المتفاعل C (CRP) يُصنع في الكبد، وهو:',o:['آخر بروتينات الطور الحاد ارتفاعاً','أول بروتينات الطور الحاد ارتفاعاً كاستجابة للأمراض الالتهابية','بروتين لا يتغير في الالتهاب','بروتين ناقل للحديد'],a:1,e:'CRP أول بروتينات الطور الحاد ارتفاعاً في الالتهاب.'},
{q:'سُمّي CRP بهذا الاسم لأنه يترسب مع:',o:['عديد السكريد C عند العقديات الرئوية','الكوليسترول','الفيبرينوجين','الهيموغلوبين'],a:0,e:'سُمّي بذلك لأنه يترسب مع عديد السكريد C عند العقديات الرئوية.'},
{q:'عوز أنزيم تيروزين أمينو ترانسفيراز يسبب النمط II من:',o:['فرط تيروزين الدم','بيلة الفينيل كيتون','داء البول القيقبي','البيلة السيستينية'],a:0,e:'عوز تيروزين أمينو ترانسفيراز يسبب النمط II من فرط تيروزين الدم.'},
{q:'في داء البول القيقبي (MSUD) تتراكم في الدم والبول والـ CSF:',o:['الحموض الأمينية ذات السلاسل المتفرعة وحموضها الكيتونية','الغلوكوز فقط','البيليروبين فقط','الأجسام الكيتونية فقط'],a:0,e:'تتراكم الحموض الأمينية ذات السلاسل المتفرعة وحموضها الكيتونية في الدم والبول والـ CSF.'},
{q:'لتحليل الحموض الأمينية في الدم، ينبغي سحب العينات بعد فترة صيام لا تقل عن:',o:['ساعة واحدة','6–8 ساعات','24 ساعة','48 ساعة'],a:1,e:'يجب الصيام 6–8 ساعات قبل سحب عينات تحليل الحموض الأمينية.'}
];
let idx = 0, score = 0, userAns = [];
const $ = id => document.getElementById(id);
function render() {
  const q = QS[idx];
  $('bar').style.width = (idx / QS.length * 100) + '%';
  $('count').textContent = 'السؤال ' + (idx + 1) + ' من ' + QS.length;
  $('scoreLive').textContent = 'النقاط: ' + score;
  $('qtext').textContent = (idx + 1) + '. ' + q.q;
  $('opts').innerHTML = '';
  $('explain').style.display = 'none';
  $('next').disabled = true;
  $('next').textContent = idx === QS.length - 1 ? 'عرض النتيجة' : 'السؤال التالي';
  q.o.forEach((t, i) => {
    const b = document.createElement('button');
    b.className = 'opt';
    b.textContent = L[i] + '. ' + t;
    b.onclick = () => answer(i, b);
    $('opts').appendChild(b);
  });
}
function answer(i, btn) {
  const q = QS[idx];
  userAns[idx] = i;
  document.querySelectorAll('.opt').forEach((b, j) => {
    b.disabled = true;
    if (j === q.a) b.classList.add('correct');
    if (j === i && i !== q.a) b.classList.add('wrong');
  });
  if (i === q.a) score++;
  $('scoreLive').textContent = 'النقاط: ' + score;
  $('explain').textContent = (i === q.a ? '✔ إجابة صحيحة. ' : '✘ الإجابة الصحيحة: ' + L[q.a] + '. ') + q.e;
  $('explain').style.display = 'block';
  $('next').disabled = false;
}
$('next').onclick = () => {
  idx++;
  if (idx >= QS.length) showResult(); else render();
};
function showResult() {
  $('quiz').classList.add('hidden');
  $('result').classList.remove('hidden');
  const pct = Math.round(score / QS.length * 100);
  $('finalScore').textContent = score + ' / ' + QS.length + ' (' + pct + '%)';
  $('msg').textContent = pct >= 90 ? 'ممتاز! إتقان كامل للموضوع.' : pct >= 70 ? 'جيد جداً، راجع الأسئلة الخاطئة بالأسفل.' : pct >= 50 ? 'مقبول، يحتاج مراجعة إضافية للفصل.' : 'يحتاج مراجعة شاملة للفصل قبل الامتحان.';
  $('review').innerHTML = QS.map((q, i) => {
    const u = userAns[i];
    return '<div class="rev"><div class="qt">' + (i + 1) + '. ' + q.q + '</div>' +
      (u === q.a ? '<div class="ca">✔ إجابتك صحيحة: ' + L[u] + '</div>'
                  : '<div class="ua">✘ إجابتك: ' + L[u] + ' — الصحيحة: ' + L[q.a] + '</div>') +
      '<div class="ex">' + q.e + '</div></div>';
  }).join('');
  window.scrollTo(0, 0);
}
$('restart').onclick = () => {
  idx = 0; score = 0; userAns = [];
  $('result').classList.add('hidden');
  $('quiz').classList.remove('hidden');
  render();
  window.scrollTo(0, 0);
};
render();
</script>
</body>
</html>
