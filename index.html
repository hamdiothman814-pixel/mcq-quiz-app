  .rev .ca { color: #2e7d32; }

  .hidden { display: none; }
</style>
</head>

    <button id="restart" class="btn btn2">إعادة الاختبار</button>
    <button id="backToChapters" class="btn">اختيار فصل آخر</button>
  </div>
</div>

الأمونيا الحرة سامة وتحول في الكبد إلى بولة.", "o": ["على شكل بولة (Urea)", "على شكل غلوتامات", "على شكل شوارد الأمونيوم NH4+", "على شكل غاز NH3 حر فقط"], "q": "على أي شكل توجد معظم الأمونيا في الدم الطبيعي؟"}, {"a": 1, "c": "المركبات النيتروجينية غير البروتينية والأنزيمات", "e": "يزداد التركيز البلازمي الكلي للأمونيا بسرعة بعد الجمع بسبب نزع الجذر الأميني خارج الجسم، لذلك يجب وضع العينة في الثلج مباشرة وتحليلها بأسرع ما يمكن، وتجنب العينات المنحلة.", "o": ["تركها في درجة حرارة الغرفة ساعات", "وضعها في الثلج مباشرة وتحليلها بأسرع ما يمكن", "إضافة فلوريد الصوديوم", "تسخينها إلى 37 درجة"], "q": "ما الإجراء الواجب مباشرة بعد جمع عينة دم لقياس الأمونيا؟"}, {"a": 3, "c": "المركبات النيتروجينية غير البروتينية والأنزيمات", "e": "تعرف الوحدة الدولية IU بأنها كمية الأنزيم التي ستحفز تفاعل 1 ميكرومول من الركيزة في الدقيقة تحت شروط خاصة، و1 وحدة دولية تساوي 17 nkat.", "o": ["كتلة الأنزيم بالملغ في اللتر", "كمية الأنزيم التي تحفز تفاعل 1 مول من الركيزة في الثانية", "كمية الأنزيم التي تحفز تفاعل 1 ميكرومول من الركيزة في الساعة", "كمية الأنزيم التي تحفز تفاعل 1 ميكرومول من الركيزة في الدقيقة"], "q": "ما تعريف الوحدة الدولية (IU) لفعالية الأنزيم؟"}, {"a": 0, "c": "المركبات النيتروجينية غير البروتينية والأنزيمات", "e": "صميم الأنزيم مع تتميم الأنزيم يشكلان معا نظاما فعالا وكاملا يدعى الأنزيم الكامل (Holoenzyme).", "o": ["الأنزيم الكامل (Holoenzyme)", "الركيزة (Substrate)", "المثبط (Inhibitor)", "المولد الأنزيمي (Zymogen)"], "q": "ماذا يتشكل من ارتباط صميم الأنزيم (Apoenzyme) مع تتميم الأنزيم (Coenzyme)؟"}, {"a": 3, "c": "المركبات النيتروجينية غير البروتينية والأنزيمات", "e": "يضع تصنيف IUB أنزيمات الأكسدة-إرجاع في الفئة الأولى، ومثالها LDH وG6PD وGLD، بينما CK من الترانسفيراز وALP من الهيدرولاز.", "o": ["الهيدرولاز (Hydrolases)", "الليغاز (Ligases)", "الترانسفيراز (Transferases)", "أنزيمات الأكسدة-إرجاع (Oxidoreductases)"], "q": "حسب تصنيف IUB المكون من ست فئات، إلى أي فئة ينتمي اللاكتات ديهيدروجيناز (LDH)؟"}, {"a": 3, "c": "المركبات النيتروجينية غير البروتينية والأنزيمات", "e": "يتألف CK من ثنائي تحت وحدات يعطي ثلاثة نظائر: CK-BB النوع الدماغي، وCK-MB النوع الهجين، وCK-MM النوع العضلي.", "o": ["CK-MM دماغي، CK-MB عضلي، CK-BB هجين", "CK-1 عضلي، CK-2 دماغي، CK-3 هجين", "CK-BB عضلي، CK-MB دماغي، CK-MM هجين", "CK-BB دماغي، CK-MB هجين، CK-MM عضلي"], "q": "ما نظائر أنزيم الكرياتين كيناز (CK) الثلاثة ومعناها؟"}, {"a": 1, "c": "المركبات النيتروجينية غير البروتينية والأنزيمات", "e": "تبدأ مستويات CK-MB القلبية بالارتفاع خلال 4-8 ساعات بعد الاحتشاء، وتبلغ ذروتها خلال 12-24 ساعة، وتعود إلى مستوياتها الطبيعية خلال 48-72 ساعة.", "o": ["تبدأ خلال 12-24 ساعة، ذروتها 48-72 ساعة، تعود خلال 10 أيام", "تبدأ خلال 4-8 ساعات، ذروتها 12-24 ساعة، تعود خلال 48-72 ساعة", "تبدأ خلال 6-8 ساعات، ذروتها 24 ساعة، تعود خلال 5 أيام", "تبدأ فورا، ذروتها 6 ساعات، تعود خلال 24 ساعة"], "q": "في احتشاء العضلة القلبية، متى تبدأ مستويات CK-MB بالارتفاع ومتى تبلغ ذروتها ومتى تعود إلى طبيعتها؟"}, {"a": 0, "c": "المركبات النيتروجينية غير البروتينية والأنزيمات", "e": "يتألف المصل الطبيعي تقريبا من 94-100% CK-MM، ويمتد النظير MB من غير القابل للكشف إلى آثار أقل من 6% من CK الكلي، وظهور CK-MB يساوي أو أعلى من 6% مؤشر جيد على الضرر القلبي.", "o": ["94-100% CK-MM وCK-MB أقل من 6% من CK الكلي", "94-100% CK-BB وCK-MB أقل من 6%", "20% CK-MM و80% CK-MB", "50% CK-MM و50% CK-MB"], "q": "ما التوزع الطبيعي لنظائر CK في المصل؟"}, {"a": 3, "c": "المركبات النيتروجينية غير البروتينية والأنزيمات", "e": "في AMI وانحلال الدم داخل الأوعية يرتفع LDH-1 إلى مستويات أعلى من LDH-2، مما يؤدي إلى نموذج انقلاب LDH (LDH-1 أكبر من LDH-2)، وهذا الانقلاب يقترح تشخيص AMI.", "o": ["LDH-5 أعلى من LDH-4", "LDH-2 أعلى من LDH-1", "LDH-3 أعلى من LDH-1", "LDH-1 أعلى من LDH-2 (انقلاب LDH)"], "q": "في مصول الأصحاء يكون النظير الأعظم للـ LDH هو LDH-2. ما النمط الذي يقترح تشخيص احتشاء العضلة القلبية الحاد (AMI)؟"}, {"a": 2, "c": "المركبات النيتروجينية غير البروتينية والأنزيمات", "e": "توجد النظائر LDH-4 وLDH-5 في الكبد والعضلات الهيكلية، ويكون LDH-5 هو النظير المسيطر في هذه النسج، لذلك لمستوياته أهمية في الكشف عن الأمراض الكبدي , "e": "ينقل ABCA1 الكوليسترول خارج الخلايا إلى Apo A-I الفقير بالدسم المرتبط بالخلايا فيتشكل HDL قرصي الشكل، ثم يؤستر LCAT الكوليسترول في HDL فيتحول إلى الشكل الكروي."}, {"c": "الشحوم والشوارد", "q": "ما نسبة الكوليسترول البلاسمي الكلي التي يحملها LDL تقريبا حسب الملف؟", "o": ["حوالي 25%", "حوالي 50%", "حوالي 70%", "حوالي 90%"], "a": 2, "e": "يحمل LDL حوالي 70% من الكوليسترول البلاسمي الكلي مع كمية قليلة جدا من الغليسيريدات الثلاثية، بينما يحوي HDL حوالي 25% من الكوليسترول البلاسمي."}, {"c": "الشحوم والشوارد", "q": "عند فصل البروتينات الشحمية بالرحلان الكهربائي عند pH = 8.6، مع أي غلوبولينات يرحل LDL؟", "o": ["مع طليعة الغلوبولينات β (Pre-β)", "يبقى في نقطة التطبيق", "مع الغلوبولينات α", "مع الغلوبولينات β"], "a": 3, "e": "عند pH = 8.6 يرحل HDL مع الغلوبولينات α، ويرحل LDL مع الغلوبولينات β، ويرحل VLDL مع طليعة الغلوبولينات β، بينما تبقى الدقائق الكيلوسية في نقطة التطبيق."}, {"c": "الشحوم والشوارد", "q": "ما الذي يميز البروتين الشحمي (a) أو Lp(a)؟", "o": ["يحمل جزيئين من Apo B-100 في الجسيم الواحد", "يحوي apo (a) المرتبط مع Apo B-100 برابطة ثنائية الكبريت ويبدي تشابها كبيرا مع البلاسمينوجين (Plasminogen)", "هو البروتين الأساسي في HDL", "ينتج عن تحرير mRNA الخاص بـ Apo B-100 في الكبد"], "a": 1, "e": "Lp(a) صنف مميز يرتبط بجسيم LDL لأن كلا منهما يحمل جزيئا واحدا من Apo B-100، ويحوي apo (a) المرتبط مع Apo B-100 برابطة تشاركية ثنائية الكبريت ويشبه البلاسمينوجين كثيرا."}, {"c": "الشحوم والشوارد", "q": "ما وظيفة الصميم Apo C-II؟", "o": ["يثبط تنشيط Apo C-II لأنزيم LPL", "يسهل التقاط بقايا الدقائق الكيلوسية وIDL", "مرافق أنزيم LCAT", "مرافق أنزيم LPL (Lipoprotein lipase)"], "a": 3, "e": "Apo C-II مرافق أنزيم LPL وينشطه، فيحل الغليسيريدات الثلاثية في الدقائق الكيلوسية وVLDL، بينما Apo C-III يثبط تنشيط Apo C-II لأنزيم LPL."}, {"c": "الشحوم والشوارد", "q": "كيف ينتج Apo B-48، وما دوره؟", "o": ["ينتج عن تحرير mRNA الخاص بـ Apo B-100 في الدقائق الكيلوسية، ودوره إفراز الغليسيريدات الثلاثية من الأمعاء", "ينتج في الكبد ودوره إفراز الغليسيريدات الثلاثية من الكبد", "هو البروتين الأ -6 أضعافه، ومعدل حدوثه 1/500 في الولايات المتحدة."}, {"c": "الشحوم والشوارد", "q": "ما العلامة السريرية الأكثر تميزا لداء تانغر (Tangier disease)؟", "o": ["أورام كوليسترولية على راحة اليد في الثنيات الراحية", "لوزات مفرطة النسج برتقالية اللون مع ضخامة طحال واعتلال عصبي محيطي", "بقع شحمية على الشبكية فقط", "أورام كوليسترولية طفحية عند TG فوق 2000 ملغ/دل"], "a": 1, "e": "داء تانغر اضطراب جسمي قاهر نادر يترافق مع نقص ملحوظ في HDL بسبب ظفرات في الناقل ABCA1، وأهم علاماته لوزات مفرطة النسج برتقالية اللون وضخامة طحال واعتلال عصبي محيطي."}, {"c": "الشحوم والشوارد", "q": "ما المظهر السريري الأكثر نوعية لخلل البروتينات الشحمية β (النمط III)؟", "o": ["لوزات برتقالية اللون", "الأورام الكوليسترولية على راحة اليد في الثنيات الراحية", "تعب في قرنية العين", "ألم بطني شديد متكرر في الطفولة"], "a": 1, "e": "النمط III يحدث بسبب خلل في تصريف بقايا البروتينات الشحمية من الدقائق الكيلوسية وVLDL المرتبط بظفرات في مورثة Apo E، ومظهره الأكثر نوعية هو الأورام الكوليسترولية على راحة اليد، ويكون LDL وHDL كوليسترول أقل من الطبيعي."}, {"c": "الشحوم والشوارد", "q": "حسب تصنيف ATP III، كيف يصنف LDL كوليسترول بقيمة 175 ملغ/دل؟", "o": ["مرتفع (High)", "مرتفع جدا (Very high)", "مثالي (Optimum)", "قريب من المثالي أو فوقه"], "a": 0, "e": "حسب ATP III: LDL أقل من 100 مثالي، و100-129 قريب من المثالي أو فوقه، و130-159 حدي مرتفع، و160-189 مرتفع، و190 فأكثر مرتفع جدا؛ فقيمة 175 تقع في فئة المرتفع."}, {"c": "الشحوم والشوارد", "q": "أي مما يلي يعد عامل خطورة رئيسيا لمرض القلب الإكليلي حسب المربع 23-1؟", "o": ["إصابة قريب من الدرجة الأولى ذكر بعمر أقل من 55 سنة بمرض قلبي إكليلي باكر", "HDL كوليسترول 65 ملغ/دل", "ضغط دم 120/80 مم زئبق دون علاج", "عمر الرجل 40 سنة"], "a": 0, "e": "عوامل الخطورة الرئيسية عدا LDL تشمل التدخين، وارتفاع التوتر الشرياني (140/90 فأكثر أو تناول خافضات ضغط)، وانخفاض HDL أقل من 40 ملغ/دل، وقصة عائلية لمرض إكليلي باكر (ذكر من الدرجة الأولى أقل من 55 سنة أو أنثى أقل من 65 سنة)، والعمر (رجال 45 فأكثر ونساء 55 فأكثر)؛ أما HDL 60 فأكثر فيعد عامل خطورة سلبيا."}, {"c": "الشحوم والشوارد", "q": ."}, {"c": "الشحوم والشوارد", "q": "متى لا يجوز استخدام معادلة فريدي وولد (Friedewald) لحساب LDL كوليسترول؟", "o": ["عندما يكون TG أقل من 100 ملغ/دل", "عندما تكون تراكيز TG فوق 400 ملغ/دل أو توجد كميات كبيرة من الدقائق الكيلوسية أو عند مرضى خلل البروتين الشحمي β", "عندما يكون الكوليسترول الكلي أقل من 200 ملغ/دل", "عندما يكون HDL كوليسترول 60 ملغ/دل فأكثر"], "a": 1, "e": "معادلة فريدي وولد: LDL = الكوليسترول الكلي - HDL كوليسترول - TG/5 (ملغ/دل)، ولا يجوز استخدامها عند TG فوق 400 ملغ/دل أو في العينات الحاوية على كميات كبيرة من الدقائق الكيلوسية (غير الصيامية) أو عند مرضى خلل البروتين الشحمي β، لأن TG/5 لا يقدر VLDL كوليسترول بدقة حينها."}, {"c": "الشحوم والشوارد", "q": "في معايرة الكوليسترول الأنزيمية، أي أنزيم يحفز أكسدة الكوليسترول إلى cholest-4-en-3-one مع إنتاج H2O2؟", "o": ["هيدرولاز إستر الكوليسترول", "الكوليسترول أوكسيداز (Cholesterol oxidase)", "البيروكسيداز (Peroxidase)", "الليباز (Lipase)"], "a": 1, "e": "يشطر هيدرولاز إستر الكوليسترول إستر الكوليسترول، ثم يؤكسد الكوليسترول أوكسيداز زمرة OH الثالثة إلى كيتون منتجا H2O2، ثم يقيس البيروكسيداز H2O2 بتكوين صباغ quinoneimine، وتتداخل البيليروبين وفيتامين C والخصاب (urate) مع هذه الطرق."}, {"c": "الشحوم والشوارد", "q": "ما الخطوة الأولى في معايرة الغليسيريدات الثلاثية (TG) بالطرق الأنزيمية؟", "o": ["أكسدة الغليسيروفوسفات بواسطة الغليسيروفوسفات أوكسيداز", "قياس NADH عند 340 نانومتر", "فسفرة الغليسيرول بواسطة الغليسيرول كيناز", "حلمهة TG إلى غليسيرول وحموض دسمة بواسطة الليباز"], "a": 3, "e": "الخطوة الأولى في كل طرق TG الأنزيمية هي حلمهة TG إلى غليسيرول وحموض دسمة بواسطة الليباز، ثم فسفرة الغليسيرول بواسطة الغليسيرول كيناز باستخدام ATP، وتبقى التراكيز خطية حتى 500 ملغ/دل."}, {"c": "الشحوم والشوارد", "q": "كيف تقاس HDL كوليسترول بالمعايرات الترسيبية؟", "o": ["بترسيب HDL وقياس الكوليسترول في الراسب", "بترسيب كل البروتينات الشحمية عدا HDL (VLDL وIDL وLp(a) وLDL والدقائق الكيلوسية) بمواد عديدة الهوابط مثل سلفات الديكستران والهيبارين والفوسفوتنغستات مع المغنزيوم، ثم معايرة HDL أنزيميا في السائل الطافي", "بحسابها مباشرة من معادلة فريدي وولد", "بقياسها بالرحلان الكهربائي فقط"], "a": 1, "e": "تعتمد المعايرات الترسيبية على ترسيب البروتينات الشحمية عدا HDL بمواد عديدة الهوابط وتنشيط التفاعل بالمغنزيوم، ثم معايرة HDL أنزيميا في السائل الطافي بعد التنبيذ، وهي غير دقيقة في العينات ذات TG فوق 400 ملغ/دل، ومانع التخثر المفضل لمعايرة البروتينات الشحمية هو EDTA."}, {"c": "الشحوم والشوارد", "q": "كيف تصنف قيمة hsCRP أكثر من 3 ملغ/دل من حيث الخطورة القلبية الوعائية؟", "o": ["منخفضة الخطورة", "معتدلة الخطورة", "شديدة الخطورة", "طبيعية تماما"], "a": 2, "e": "القيم المرجعية لـ hsCRP: أقل من 1 و1-3 وأكثر من 3 ملغ/دل توافق تصنيف الأشخاص إلى منخفضي ومعتدلي وشديدي الخطورة القلبية الوعائية على الترتيب، وCRP يتألف من خمس وحدات تحت ببتيد ويصنعه الكبد ويسيطر على إنتاجه الإنترلوكين-6."}, {"c": "الشحوم والشوارد", "q": "ما سبب ارتفاع الهوموسيستين (Hcy) المتعلق بالفيتامينات؟", "o": ["عوز حمض الفوليك أو فيتامين B6 وB12", "زيادة فيتامين C", "عوز فيتامين D فقط", "زيادة الحديد"], "a": 0, "e": "يعاد تدوير Hcy إلى الميثيونين عبر حلقة يتدخل فيها التيتراهيدروفولات أو يحول إلى السيستين بأنزيمات تستخدم فيتامينات B كتميمات، لذا فإن عوز حمض الفوليك أو فيتامين B6 وB12 يؤدي إلى ارتفاع مستويات Hcy."}, {"c": "الشحوم والشوارد", "q": "ما المجال المرجعي لتركيز الهوموسيستين الصيامي في البلازما؟", "o": ["20-30 ميكرومول/ل", "1-3 ميكرومول/ل", "13-18 ميكرومول/ل", "5-10 ميكرومول/ل"], "a": 3, "e": "القيم المرجعية لتركيز Hcy الصيامي هي 13-18 ميكرومول/ل في المصل و5-10 ميكرومول/ل في البلازما، ويوجد Hcy فيزيولوجيا بالأشكال الحر والمؤكسد والمرتبط بالبروتين."}, {"c": "الشحوم والشوارد", "q": "ما المجال المرجعي لأسمولية المصل؟", "o": ["200-220 mOsm/kg", "275-295 mOsm/kg", "300-900 mOsm/kg", "50-1200 mOsm/kg"], "a": 1, "e": "للحفاظ على أسمولية المصورة ضمن الطبيعي (275-295 mOsm/kg) تستجيب مستقبلات الأسمولية في الوطاء بسرعة، فزيادة الأسمولية 1-2% تسبب زيادة أربعة أضعاف في AVP، بينما نقصها 1-2% ينهي إنتاج AVP، وعمر النصف لـ AVP في الدوران 15-20 دقيقة."}, {"c": "الشحوم والشوارد", "q": "كيف يعرف نقص صوديوم الدم (Hyponatremia)؟", "o": ["مستوى مصلي/بلازمي أقل من 135 ممول/ل", "مستوى مصلي/بلازمي أكثر من 145 ممول/ل", "مستوى مصلي/بلازمي أقل من 120 ممول/ل فقط", "أسمولية مصل فوق 295 mOsm/kg فقط"], "a": 0, "e": "يعرف نقص صوديوم الدم عندما يكون المستوى المصلي/البلازمي أقل من 135 ممول/ل، والمستويات الأقل من 130 ممول/ل هامة سريريا، وتكون الأعراض بين 125-130 ممول/ل معدية معوية أساسا، بينما الأعراض النفسية العصبية الأكثر خطورة تظهر بتراكيز أقل من 125 ممول/ل."}, {"c": "الشحوم والشوارد", "q": "ما المعدل الأعظمي لتصحيح فرط صوديوم الدم؟", "o": ["5 ممول/ل في الساعة", "2 ممول/ل في الساعة", "0.5 ممول/ل في الساعة", "0.1 ممول/ل في الساعة"], "a": 2, "e": "يجب تصحيح فرط صوديوم الدم تدريجيا، لأن التصحيح السريع جدا لفرط صوديوم الدم الشديد (160 ممول/ل فأكثر) قد يسبب وذمة دماغية ووفاة، والمعدل الأعظمي للتصحيح هو 0.5 ممول/ل في الساعة."}, {"c": "الشحوم والشوارد", "q": "عند أي تراكيز بوتاسيوم بلازما قد تظهر تغيرات في تخطيط القلب الكهربائي (ECG) في فرط بوتاسيوم الدم؟", "o": ["3-4 ممول/ل", "4-5 ممول/ل", "6-7 ممول/ل", "8 ممول/ل فقط يظهر الضعف العضلي"], "a": 2, "e": "قد تسبب تراكيز بوتاسيوم البلازما بين 6-7 ممول/ل تغيرا في ECG، وقد تسبب التراكيز أكثر من 10 ممول/ل توقف قلب قاتلا، ولا يتطور الضعف العضلي حتى يصل البوتاسيوم إلى 8 ممول/ل، ويجب أن تكون المعالجة فورية عند بوتاسيوم مصل 6-6.5 ممول/ل فأكثر أو عند وجود تغيرات ECG، ويعطى الكالسيوم وريديا لوقاية فورية قصيرة الأمد للعضلة القلبية."}, {"c": "الشحوم والشوارد", "q": "أين يوجد معظم مغنزيوم الجسم، وما مجاله المرجعي في المصل؟", "o": ["معظمه في المصل، والمجال 1.5-2.5 ممول/ل", "حوالي 53% في العظام و46% في العضلات والأنسجة الرخوة وأقل من 1% في المصل وكريات الدم الحمراء، والمجال المصلي 0.63-1.0 ممول/ل", "معظمه في الكبد، والمجال 0.1-0.3 ممول/ل", "حوالي 90% في العظام والمجال 2-3 ممول/ل"], "a": 1, "e": "يحتوي شخص وزنه 70 كغ على 1 مول (24 غ) من المغنزيوم، حوالي 53% في العظام و46% في العضلات والأنسجة الأخرى وأقل من 1% في المصل وكريات الدم الحمراء، والمجال المرجعي المصلي بالقياس اللوني 0.63-1.0 ممول/ل، وهو عامل رئيسي لأكثر من 300 أنزيم."}, {"a": 1, "c": "الكالسيوم والفوسفات والعناصر الزهيدة والبورفيريا", "e": "الكالسيتونين يوجد في الخلايا المجاورة للغدة الدرقية ويُفرز استجابة لزيادة كالسيوم الدم، ويخفضه عبر تثبيط عمل PTH وفيتامين D.", "o": ["الهرمون جار الدرقي (PTH)", "الكالسيتونين", "هرمون النمو", "فيتامين D"], "q": "أي هرمون يُفرز استجابة لزيادة مستوى الكالسيوم في الدم ويخفضه عبر تثبيط عمل الهرمون جار الدرقي (PTH) وفيتامين D؟"}, {"a": 1, "c": "الكالسيوم والفوسفات والعناصر الزهيدة والبورفيريا", "e": "يُحفز إفراز PTH عند نقص الكالسيوم الشاردي، فيحرّض انحلال العظم، ويزيد عودة امتصاص الكالسيوم الأنبوبية في الكلية، ويحرّض إنتاج فيتامين D الفعال من الكلية.", "o": ["تثبيط انحلال العظم وإنقاص عودة امتصاص الكالسيوم الأنبوبية", "زيادة انحلال العظم عبر كاسرات العظم، وزيادة عودة امتصاص الكالسيوم الأنبوبية، وتحريض إنتاج فيتامين D الفعال من الكلية", "زيادة إفراز الكالسيوم في البول وتثبيط إنتاج فيتامين D الفعال", "تثبيط امتصاص الكالسيوم من الأمعاء وزيادة طرحه الكلوي"], "q": "أي من التأثيرات التالية يبديه الهرمون جار الدرقي (PTH)؟"}, {"a": 2, "c": "الكالسيوم والفوسفات والعناصر الزهيدة والبورفيريا", "e": "يتكون 25-OH-D3 في الكبد وهو شكل غير فعال، ثم تتم هدرلته في الكلية إلى 1,25-[OH]2-D3 وهو الشكل الفعال حيويا، ويزيد امتصاص الكالسيوم من الأمعاء.", "o": ["في الجلد", "في الكبد", "في الكلية", "في العظم"], "q": "أين يتحول 25-هيدروكسي كولي كالسيفيرول (25-OH-D3) إلى الشكل الفعال حيويا 1،25-ثنائي هيدروكسي كولي كالسيفيرول (1,25-[OH]2-D3)؟"}, {"a": 3, "c": "الكالسيوم والفوسفات والعناصر الزهيدة والبورفيريا", "e": "يتوزع كالسيوم الدم إلى حوالي 45% بشكل حر (شاردي)، وحوالي 40% مرتبطا مع البروتينات وخاصة الألبومين، وحوالي 15% مرتبطا مع الأيونات مثل البيكربونات والسترات والفوسفات واللاكتات.", "o": ["15%", "25%", "40%", "45%"], "q": "ما النسبة التقريبية من كالسيوم الدم الموجودة بشكل حر (كالسيوم شاردي)؟"}, {"a": 2, "c": "الكالسيوم والفوسفات والعناصر الزهيدة والبورفيريا", "e": "الكالسيوم المصحح = الكالسيوم الكلي + 0.8 × [4 - الألبومين] = 8.0 + 0.8 × 1 = 8.8 ملغ/دل.", "o": ["7.2 ملغ/دل", "8.0 ملغ/دل", "8.8 ملغ/دل", "9.6 ملغ/دل"], "q": "مريض كالسيومه الكلي 8.0 ملغ/دل وألبومينه 3 غ/دل. ما الكالسيوم المصحح بحسب معادلة تصحيح الكالسيوم بالألبومين؟"}, {"a": 0, "c": "الكالسيوم والفوسفات والعناصر الزهيدة والبورفيريا", "e": "فرط جارات الدرق البدئي هو السبب الأساسي لفرط كالسيوم الدم، وغالبية المصابين هم نساء مسنات، ويرفع الكالسيوم الكلي والشاردي.", "o": ["فرط جارات الدرق البدئي", "عوز فيتامين D", "التهاب البنكرياس الحاد", "نقص مغنيزيوم الدم المزمن"], "q": "ما السبب الأساسي لفرط كالسيوم الدم؟"}, {"a": 1, "c": "الكالسيوم والفوسفات والعناصر الزهيدة والبورفيريا", "e": "العينة المفضلة لتحديد الكالسيوم الكلي هي المصل أو بلازما هيبارين الليثيوم، لأن EDTA أو الأوكزالات ترتبط مع الكالسيوم بشدة.", "o": ["لأنها ترفع pH العينة بشدة", "لأنها ترتبط مع الكالسيوم بشدة", "لأنها تسبب انحلال الدم دائما", "لأنها تمنع قياس الكالسيوم الشاردي فقط دون الكلي"], "q": "لماذا لا تُفضل مضادات التخثر مثل EDTA أو الأوكزالات عند تحديد الكالسيوم الكلي؟"}, {"a": 2, "c": "الكالسيوم والفوسفات والعناصر الزهيدة والبورفيريا", "e": "يُنظم الفوسفات كلويّا بإطراحه أو إعادة امتصاصه، والعامل الأكثر أهمية هو PTH الذي يُنقص إعادة الامتصاص الأنبوبي للفوسفات.", "o": ["الكالسيتونين، لأنه يزيد إعادة الامتصاص الأنبوبي للفوسفات", "هرمون النمو، لأنه يزيد إطراح الفوسفات", "الهرمون جار الدرقي (PTH)، لأنه يُنقص إعادة الامتصاص الأنبوبي للفوسفات", "فيتامين D، لأنه يُنقص امتصاص الفوسفات من الأمعاء"], "q": "ما العامل الأكثر أهمية في التنظيم الكلوي للفوسفات؟"}, {"a": 1, "c": "الكالسيوم والفوسفات والعناصر الزهيدة والبورفيريا", "e": "نقص فوسفات الدم الشديد (أقل من 1 ملغ/دل، أي 0.3 ممول/ل) يتطلب المراقبة والمعالجة التعويضية، ومعدل الوفيات فيه حوالي 30% مقابل أقل من 1% في النقص الخفيف أو الطبيعي.", "o": ["أقل من 2 ملغ/دل، ومعدل وفيات حوالي 10%", "أقل من 1 ملغ/دل (0.3 ممول/ل)، ومعدل وفيات حوالي 30%", "أقل من 1 ملغ/دل، ومعدل وفيات أقل من 1%", "أقل من 3 ملغ/دل، ومعدل وفيات حوالي 50%"], "q": "ما العتبة المذكورة لنقص فوسفات الدم الشديد، وما معدل الوفيات المرافق له؟"}, {"a": 0, "c": "الكالسيوم والفوسفات والعناصر الزهيدة والبورفيريا", "e": "زيادة تحطم الخلايا قد تسبب فرط فوسفات الدم، ولأن الأورام اللمفاوية غير الناضجة تمتلك محتوى فوسفات حوالي 4 أضعاف الخلايا الناضجة، يكون مرضى ALL مهيئين بشكل خاص لذلك.", "o": ["لأن خلاياهم اللمفاوية غير الناضجة تمتلك محتوى من الفوسفات يقدر بحوالي 4 أضعاف محتوى الخلايا اللمفاوية الناضجة", "لأنهم يفرزون PTH بكميات كبيرة", "لأنهم يعانون دائما من قصور كلوي حاد", "لأن فيتامين D لديهم مرتفع دائما"], "q": "لماذا يكون مرضى ابيضاض الدم اللمفاوي الحاد (ALL) مهيئين بشكل خاص لفرط فوسفات الدم؟"}, {"a": 2, "c": "الكالسيوم والفوسفات والعناصر الزهيدة والبورفيريا", "e": "تتضمن طرق تعيين الفوسفات تشكيل معقد فوسفو موليبدات الأمونيوم، ويمكن قياس امتصاصية هذا المعقد عديم اللون عند 340 نانومتر، أو إرجاعه ليشكل أزرق الموليبدينوم الذي تُقاس امتصاصيته ضمن المجال 600-700 نانومتر.", "o": ["340 نانومتر", "400 نانومتر", "600-700 نانومتر", "800-900 نانومتر"], "q": "في طرق تعيين الفوسفات، عند أي مجال من الأطوال الموجية تُقاس امتصاصية أزرق الموليبدينوم؟"}, {"a": 0, "c": "الكالسيوم والفوسفات والعناصر الزهيدة والبورفيريا", "e": "المجال المرجعي للفوسفور غير العضوي في المصل: حديثو الولادة 1.45-2.91 ممول/ل، والأطفال حتى 15 سنة 1.07-1.74 ممول/ل، والبالغون 0.78-1.42 ممول/ل (2.4-4.4 ملغ/دل).", "o": ["0.78-1.42 ممول/ل (2.4-4.4 ملغ/دل)", "1.45-2.91 ممول/ل (4.5-9.0 ملغ/دل)", "1.07-1.74 ممول/ل (3.3-5.4 ملغ/دل)", "2.20-2.70 ممول/ل (8.8-10.8 ملغ/دل)"], "q": "ما المجال المرجعي للفوسفور غير العضوي في مصل البالغين؟"}, {"a": 1, "c": "الكالسيوم والفوسفات والعناصر الزهيدة والبورفيريا", "e": "في نقص الأكسجة يتحول البيروفات إلى لاكتات عبر استقلاب لاهوائي، وبالنتيجة يُنتج فقط 2 مول من ATP لكل مول من الغلوكوز المتحول إلى لاكتات.", "o": ["مول واحد", "مولان", "3 مولات", "4 مولات"], "q": "كم مولا من ATP يُنتج لكل مول من الغلوكوز المتحول إلى لاكتات بالاستقلاب اللاهوائي؟"}, {"a": 1, "c": "الكالسيوم والفوسفات والعناصر الزهيدة والبورفيريا", "e": "الكبد هو العضو الأهم للتخلص من اللاكتات، وذلك عبر تحويله إلى غلوكوز بعملية استحداث السكر.", "o": ["الكلية، عبر إطراحه في البول", "الكبد، عبر تحويله إلى غلوكوز بعملية استحداث السكر", "العضلات، عبر تحويله إلى بيروفات فقط", "الرئة، عبر طرحه مع الزفير"], "q": "ما العضو الأهم للتخلص من اللاكتات، وبأي عملية؟"}, {"a": 2, "c": "الكالسيوم والفوسفات والعناصر الزهيدة والبورفيريا", "e": "النوع A من الحماض اللبني متعلق بحالات نقص الأكسجة مثل الصدمة واحتشاء القلب وقصور القلب الاحتقاني الشديد والوذمة الرئوية أو النزف الدموي الشديد، بينما النوع B ناتج عن منشأ استقلابي مثل الداء السكري والانتانات الشديدة وأمراض الكبد أو الكلية والتسممات.", "o": ["الداء السكري", "التسمم بالإيثانول", "الصدمة", "أمراض الكبد"], "q": "أي من الحالات التالية مثال على الحماض اللبني من النوع A المرتبط بنقص الأكسجة؟"}, {"a": 1, "c": "الكالسيوم والفوسفات والعناصر الزهيدة والبورفيريا", "e": "يجب ألا تُستخدم العاصبة بشكل مثالي لأن الركود الوريدي سوف يزيد من مستوى اللاكتات، وإذا استُخدمت فيجب جمع الدم مباشرة وألا يحرّك المريض يده قبل أو أثناء الجمع.", "o": ["لأنها تسبب انحلال الدم فقط", "لأن الركود الوريدي سوف يزيد من مستوى اللاكتات", "لأنها تنقص مستوى الغلوكوز في العينة", "لأنها تمنع التخثر"], "q": "لماذا يجب، بشكل مثالي، عدم استخدام العاصبة عند جمع عينة اللاكتات؟"}, {"a": 2, "c": "الكالسيوم والفوسفات والعناصر الزهيدة والبورفيريا", "e": "الشكل الأكثر سمية للزرنيخ هو الشكل غير العضوي الموجود ضمن العديد من المنتجات الصناعية، بينما الشكل المثيلي سام بشكل متوسط، والشكل العضوي عادة غير سام ويوجد في الأسماك والمأكولات البحرية.", "o": ["الشكل العضوي مثل Arsenobetaine الموجود في المأكولات البحرية", "الشكل المثيلي مثل MMA وDMA", "الشكل غير العضوي As(III) وAs(V)", "الشكل المرتبط بالبروتينات فقط"], "q": "أي شكل من أشكال الزرنيخ هو الأكثر سمية؟"}, {"a": 2, "c": "الكالسيوم والفوسفات والعناصر الزهيدة والبورفيريا", "e": "بعد التعرض الحاد للزرنيخ تُصبح عينة البول هي الفضلى بسبب قصر العمر النصفي للزرنيخ بالدم، وقد تفيد عينة المصل بعد التعرض بفترة قصيرة أقل من 24 ساعة، أما في التعرض المزمن أو السابق لأكثر من ثلاثة أسابيع فيُفضل الشعر أو الأظافر.", "o": ["الشعر، لأنه يعكس التعرض المزمن فقط", "المصل بعد أسبوع من التعرض", "البول، بسبب قصر العمر النصفي للزرنيخ بالدم", "الأظافر مباشرة بعد التعرض"], "q": "بعد التعرض الحاد للزرنيخ، ما العينة الفضلى للتحليل؟"}, {"a": 0, "c": "الكالسيوم والفوسفات والعناصر الزهيدة والبورفيريا", "e": "التعرض المزمن للكادميوم يسبب قصورا كلويا وبيلة بروتينية، بينما نقص تصبغ الجلد والشعر من علامات نقص النحاس، وحلقات كايزر فلايشر من مرض ويلسون.", "o": ["قصور كلوي وبيلة بروتينية", "فرط كالسيوم الدم فقط", "نقص تصبغ الجلد والشعر", "حلقات كايزر فلايشر في القرنية"], "q": "ما من مظاهر التعرض المزمن للكادميوم؟"}, {"a": 0, "c": "الكالسيوم والفوسفات والعناصر الزهيدة والبورفيريا", "e": "العينة المستخدمة لتحليل الرصاص هي الدم الكامل الوريدي، وهي مفضلة على البلازما والمصل لأن الرصاص الجوال في الدم غالبا ما يرتبط مع كريات الدم الحمراء.", "o": ["لأن الرصاص الجوال في الدم غالبا ما يرتبط مع كريات الدم الحمراء", "لأن الرصاص لا يوجد في البلازما أبدا", "لأن الدم الكامل يمنع تلوث العينة بالكادميوم", "لأن البلازما تسبب انحلال الدم دائما"], "q": "لماذا يُفضل الدم الكامل الوريدي على البلازما والمصل لتحليل الرصاص؟"}, {"a": 1, "c": "الكالسيوم والفوسفات والعناصر الزهيدة والبورفيريا", "e": "تعتبر المبادئ التوجيهية لـ CDC مستويات 10 مكغ/دل أو أعلى قيمًا مرتفعة للأطفال والنساء الحوامل، وعند البالغين غير الحوامل 30 مكغ/دل.", "o": ["5 مكغ/دل أو أعلى", "10 مكغ/دل أو أعلى", "20 مكغ/دل أو أعلى", "30 مكغ/دل أو أعلى"], "q": "بحسب المبادئ التوجيهية لـ CDC، ما مستوى الرصاص في الدم الذي يُعتبر مرتفعا عند الأطفال والنساء الحوامل؟"}, {"a": 1, "c": "الكالسيوم والفوسفات والعناصر الزهيدة والبورفيريا", "e": "مرض ويلسون مرض وراثي بسبب تراكم النحاس في الجسم، يظهر عادة بين 4 و20 سنة، وتشمل أعراضه اضطرابات عصبية وكبدية وحلقات كايزر فلايشر الناجمة عن ترسّب النحاس، ويمكن وقفه أحيانا بأسيتات الزنك أو العلاج بخالبات المعادن.", "o": ["مرض مينكس", "مرض ويلسون", "مرض كيشان (Keshan)", "البورفيريا الجلدية المتأخرة"], "q": "مرض وراثي يتراكم فيه النحاس في الجسم، ويظهر عادة بين 4 و20 سنة، مع اضطرابات عصبية وكبدية وحلقات كايزر فلايشر (لون أخضر بني) في القرنية. ما هو؟"}, {"a": 2, "c": "الكالسيوم والفوسفات والعناصر الزهيدة والبورفيريا", "e": "السعة الإجمالية الرابطة للحديد (TIBC) هي كمية الحديد التي يمكن أن ترتبط مع الترانسفيرين وبروتينات أخرى حتى الإشباع، وتتراوح قيمتها بين 250 و425 مكغ/دل.", "o": ["20-50 مكغ/دل", "100-200 مكغ/دل", "250-425 مكغ/دل", "500-700 مكغ/دل"], "q": "ما المجال المذكور للسعة الإجمالية الرابطة للحديد (TIBC)؟"}, {"a": 0, "c": "الكالسيوم والفوسفات والعناصر الزهيدة والبورفيريا", "e": "يسبب عوز الزنك تأخرا في النمو، وبطء نضج الهيكل العظمي، وضمورا في الخصية، ونقص حاسة الذوق. أما ارتفاع الكوليسترول والصرع فمن عوز المنغنيز، وعدم تحمل السكر فمن نقص الكروم.", "o": ["تأخر النمو، وبطء نضج الهيكل العظمي، وضمور الخصية، ونقص حاسة الذوق", "ارتفاع الكوليسترول والتهاب الجلد والصرع", "حلقات خضراء بنية في القرنية واضطرابات عصبية", "عدم تحمل السكر وبيلة سكرية وارتفاع الكوليسترول"], "q": "أي مجموعة من العلامات تُذكر لعوز الزنك؟"}, {"a": 1, "c": "الكالسيوم والفوسفات والعناصر الزهيدة والبورفيريا", "e": "لكل مركب بورفيريني أربعة نظائر رئيسية، لكن يوجد النوع 1 والنوع 3 فقط في الطبيعة، وتُعدّ متماثرات النوع 3 هي التي تشكّل الهيم فقط، بينما قد يتواجد النوع 1 غير الوظيفي في بعض الأمراض بكميات كبيرة.", "o": ["متماثرات النوع 1 فقط", "متماثرات النوع 3 فقط", "متماثرات النوع 1 والنوع 3 معا", "متماثرات النوع 2 فقط"], "q": "أي متماثرات البورفيرين هي التي تشكّل الهيم فقط؟"}, {"a": 0, "c": "الكالسيوم والفوسفات والعناصر الزهيدة والبورفيريا", "e": "يُفرز URO بشكل رئيسي في البول، بينما يُفرز PROTO في البراز، ويُفرز COPRO في أحدهما اعتمادا على معدل تشكّل البول ودرجة حموضته.", "o": ["اليوروبورفيرين (URO) في البول، والبروتوبورفيرين (PROTO) في البراز", "البروتوبورفيرين (PROTO) في البول، واليوروبورفيرين (URO) في البراز", "الكوبروبورفيرين (COPRO) في البول فقط، والبروتوبورفيرين في البول فقط", "اليوروبورفيرين في البراز فقط، والكوبروبورفيرين في البول فقط"], "q": "أي بورفيرين يُفرز بشكل رئيسي في البول، وأي بورفيرين يُفرز في البراز؟"}, {"a": 1, "c": "الكالسيوم والفوسفات والعناصر الزهيدة والبورفيريا", "e": "يتم التحكم بمعدل اصطناع الهيم في الكبد عبر أنزيم ALA synthase، حيث يتم تثبيط إنتاج ALA synthetase عندما تزداد كمية الهيم في الكبد بالية التلقيم الراجع السلبي، وعلى العكس يزداد اصطناعه عند تناقص الهيم.", "o": ["يزداد إنتاجه عند زيادة الهيم في الكبد", "يُثبط إنتاج ALA synthetase عندما تزداد كمية الهيم في الكبد بالية التلقيم الراجع السلبي، ويزداد اصطناعه عند تناقص الهيم", "لا يتأثر بكمية الهيم أبدا", "يُثبط دائما بالأدوية فقط"], "q": "كيف يُضبط معدل اصطناع الهيم في الكبد عبر أنزيم ALA synthase؟"}, {"a": 1, "c": "الكالسيوم والفوسفات والعناصر الزهيدة والبورفيريا", "e": "يحوّل أنزيم PBG deaminase الـ PBG إلى هيدروكسي مثيل بيلان، ويؤدي عوزه إلى البورفيريا المتقطعة الحادة (AIP).", "o": ["ALA dehydratase", "PBG deaminase", "Uroporphyrinogen decarboxylase", "Ferrochelatase"], "q": "عوز أي أنزيم يسبب البورفيريا المتقطعة الحادة (Acute intermittent porphyria, AIP)؟"}, {"a": 3, "c": "الكالسيوم والفوسفات والعناصر الزهيدة والبورفيريا", "e": "يُدخل أنزيم ferrochelatase الحديد إلى البروتوبورفيرين ليشكّل الهيم، ويؤدي عوزه إلى البورفيريا المكوّنة للحمر (EP).", "o": ["ALA synthase", "PBG deaminase", "Coproporphyrinogen oxidase", "Ferrochelatase"], "q": "عوز أي أنزيم يسبب البورفيريا المكوّنة للحمر (Erythropoietic porphyria, EP)؟"}, {"a": 0, "c": "الكالسيوم والفوسفات والعناصر الزهيدة والبورفيريا", "e": "الموجودات المخبرية المميزة لـ AIP هي ارتفاع ملحوظ في ALA وPBG في البول، مع أن نتائج هذه الاختبارات قد تكون طبيعية بين الهجمات، وقد يكون لون البول أحمر إلى بني غامق.", "o": ["ارتفاع ملحوظ في ALA وPBG في البول", "ارتفاع ALA في البول مع بقاء PBG طبيعيا", "انخفاض ALA وPBG في البول", "ارتفاع PROTO في الكريات الحمر فقط مع بول طبيعي"], "q": "ما الموجودات المخبرية المميزة للبورفيريا المتقطعة الحادة (AIP) أثناء الهجمة؟"}, {"a": 0, "c": "الخضاب والهرمونات والنخامة والكظر", "e": "يتألف الخضاب من هيم يشكل 3% وغلوبين يشكل 97%، والجزيء الكامل فيه أربع مجموعات هيم مرتبطة بأربع سلاسل غلوبين، فيحمل أربع جزيئات أوكسجين.", "o": ["هيم 3% وغلوبين 97%، ويحمل 4 جزيئات أوكسجين", "هيم 50% وغلوبين 50%، ويحمل جزيئين من الأوكسجين", "هيم 97% وغلوبين 3%، ويحمل 8 جزيئات أوكسجين", "هيم 25% وغلوبين 75%، ويحمل جزيء أوكسجين واحدا"], "q": "ما تركيب جزيء الخضاب (Hemoglobin) من حيث الهيم (Heme) والغلوبين (Globin)، وكم جزيء أوكسجين يحمل الجزيء الكامل؟"}, {"a": 3, "c": "الخضاب والهرمونات والنخامة والكظر", "e": "الخضاب A هو ألفا2 بيتا2، والخضاب A2 هو ألفا2 دلتا2 ويشكل أقل من 3% عند البالغين، والخضاب F هو ألفا2 غاما2.", "o": ["A يتكون من ألفا وغاما، وA2 من ألفا وبيتا، وF من ألفا ودلتا", "A يتكون من أربع سلاسل بيتا، وA2 من أربع سلاسل ألفا، وF من أربع سلاسل غاما", "A يتكون من ألفا ودلتا، وA2 من ألفا وغاما، وF من ألفا وبيتا", "A يتكون من سلسلتين ألفا وسلسلتين بيتا، وA2 من ألفا ودلتا، وF من ألفا وغاما"], "q": "ما تركيب سلاسل الخضاب A وخضاب A2 وخضاب F عند البالغين؟"}, {"a": 2, "c": "الخضاب والهرمونات والنخامة والكظر", "e": "الخضاب F له ألفة أعلى للأوكسجين من A فيكون أكثر فاعلية للجنين، وهو أكثر مقاومة للقلوية، وهذا أساس التفريق المخبري بينهما، ويشكل أقل من 1% عند عمر حوالي 9 أشهر.", "o": ["ألفته للأوكسجين مساوية لألفة A، لكنه لا يقاوم القلوية، ويشكل 25% عند عمر 9 أشهر", "ألفته للأوكسجين أعلى لكنه أسرع تحطما بالقلوية، ويختفي تماما عند الولادة", "ألفته للأوكسجين أعلى ومقاومته للقلوية أكبر، ويشكل أقل من 1% عند عمر 9 أشهر", "ألفته للأوكسجين أقل ومقاومته للقلوية أقل، ويشكل أكثر من 50% عند عمر 9 أشهر"], "q": "ما الذي يميز الخضاب الجنيني F عن الخضاب A، وكم يبلغ تقريبا عند عمر 9 أشهر؟"}, {"a": 1, "c": "الخضاب والهرمونات والنخامة والكظر", "e": "اصطناع الخضاب في الكريات الحمر غير الناضجة في نقي العظم بنسبة 65% في الخلايا المنواة و35% في الشبكيات، والطريق الطبيعي لتحطمه خارج وعائي في الطحال والكبد ونقي العظم بنسبة 80-90%.", "o": ["يُصنع في الكريات الناضجة في الدم المحيطي، ويتحطم كله في الكلية", "يُصنع في الكريات الحمر غير الناضجة في نقي العظم بنسبة 65% في الخلايا المنواة و35% في الشبكيات، ويتحطم 80-90% منه خارج الأوعية", "يُصنع في الكبد فقط، ويتحطم كله داخل الأوعية", "يُصنع في الطحال بنسبة 90%، ويتحطم 80-90% منه داخل الأوعية"], "q": "أين يتم اصطناع الخضاب، وما الطريق الرئيسي لتحطمه؟"}, {"a": 0, "c": "الخضاب والهرمونات والنخامة والكظر", "e": "في الخضاب S يُستبدل حمض الغلوتاميك بالفالين في الموقع السادس من السلسلة بيتا، مما يعطيه شحنة سلبية أقل من الخضاب A.", "o": ["استبدال حمض الغلوتاميك بالفالين في الموقع السادس من السلسلة بيتا، فيصبح أقل شحنة سلبية من الخضاب A", "استبدال الفالين بالغلوتاميك في الموقع السادس والعشرين من السلسلة ألفا", "حذف السلسلة بيتا كلها، فيفقد الخضاب قدرته على حمل الأوكسجين", "اندماج سلسلتي دلتا وبيتا، فيتكون خضاب هجين"], "q": "ما الخلل الجزيئي في الخضاب S؟"}, {"a": 3, "c": "الخضاب والهرمونات والنخامة والكظر", "e": "عند الأطفال ذوي الخلّة المنجلية يظهر تعداد طفيليات أقل وفترة إصابة أقصر وانخفاض وفيات عند الإصابة بالمتصورة المنجلية، لأن الكريات المصابة تتمنجل وتتحطم مبكرا.", "o": ["لأن الخضاب S يقتل الطفيليات مباشرة في الدم دون تحطم الكريات", "لأن خلّة المنجلية تمنع دخول الطفيليات إلى الجسم نهائيا", "لأن الخضاب S يرفع مناعة الجسم ضد كل أنواع الملاريا مدى الحياة", "لأن الكريات الحمر المصابة تميل للتمنجل فتتحطم قبل أن تبلغ الطفيليات مستويات عالية، فيقل تعداد الطفيليات وتقصر الإصابة وينخفض معدل الوفيات"], "q": "لماذا تمنح خلّة الخلايا المنجلية (HbAS) حماية نسبية ضد الملاريا المنجلية؟"}, {"a": 2, "c": "الخضاب والهرمونات والنخامة والكظر", "e": "في الخضاب C يُستبدل الغلوتاميك بالليزين في الموقع السادس من السلسلة بيتا، وأهم ظواهره المخبرية الخلايا الهدفية وميل لتكوين بلورات سداسية كبيرة غير منتظمة داخل الكريات الحمر.", "o": ["استبدال الليزين بالغلوتاميك في الموقع 121، مع غياب تام للخلايا الهدفية", "حذف ثلاث نكليوتيدات من السلسلة ألفا، مع خلايا هدفية واختبار انحلالية إيجابي دائما", "استبدال الغلوتاميك بالليزين في الموقع السادس من السلسلة بيتا، مع خلايا هدفية وبلورات سداسية كبيرة غير منتظمة داخل الكريات الحمر", "استبدال الغلوتاميك بالفالين في الموقع السادس، مع خلايا منجلية فقط دون خلايا هدفية"], "q": "ما الخلل الجزيئي والموجودات المخبرية المميزة في الخضاب C؟"}, {"a": 1, "c": "الخضاب والهرمونات والنخامة والكظر", "e": "الخضاب E ناتج عن خلل في الموقع السادس والعشرين من السلسلة بيتا، ويوجد في آسيا، وعند مختلقي اللواقح تتراوح نسبته بين 30-45%، ويتحرك مع C وA2 على خلايا السليلوز.", "o": ["خلل في السلسلة ألفا، يوجد في البحر المتوسط، ويشكل 85-100% عند مختلقي اللواقح", "خلل في الموقع السادس والعشرين من السلسلة بيتا، يوجد في آسيا، ويوجد عند مختلقي اللواقح بنسبة 30-45%، ويهاجر مع C وA2 على السليلوز", "خلل في الموقع السادس من السلسلة بيتا، يوجد في غرب أفريقيا فقط، ويهاجر مع S على السليلوز", "خلل في الموقع 121 من السلسلة بيتا، يوجد شمال غرب الهند، ويعطي اختبار انحلالية إيجابيا"], "q": "ما الذي يميز الخضاب E مخبريا وجغرافيا؟"}, {"a": 0, "c": "الخضاب والهرمونات والنخامة والكظر", "e": "الخزب الجنيني هو أخطر أنواع التلاسيميا ألفا لغياب اصطناع السلسلة ألفا كاملا، فيظهر خضاب بارت المكون من أربع سلاسل غاما، ذو ألفة عالية للأوكسجين تمنع وصوله للأنسجة، فيولد الرضع أمواتا أو يموتون بنقص الأكسجة بعد الولادة.", "o": ["غياب كامل لاصطناع السلسلة ألفا، فيتكون خضاب بارت من أربع سلاسل غاما، وله ألفة عالية للأوكسجين فيمنع وصوله للأنسجة", "نقص جزئي في السلسلة بيتا، فيتكون خضاب H، ويسبب فقر دم خفيفا فقط", "غياب سلسلة غاما، فيتكون خضاب A فقط، ويسبب فقر دم معاوضا", "زيادة اصطناع السلسلة ألفا، فيتكون خضاب بارت من أربع سلاسل ألفا، ويسبب زيادة لزوجة الدم"], "q": "ما هو الخزب الجنيني (Hydrops fetalis) في التلاسيميا ألفا، ولماذا يكون مميتا؟"}, {"a": 3, "c": "الخضاب والهرمونات والنخامة والكظر", "e": "في مرض خضاب H يكون اصطناع ألفا نحو ثلث بيتا، فتتجمع سلاسل بيتا مشكلة جزيئات رباعية تدعى خضاب H بنسبة 5-30%، وتترسب فتقصر عمر الخلية ويحدث فقر دم انحلالي معتدل.", "o": ["جزيئات رباعية من سلاسل ألفا، وتوجد بنسبة 85-100% وتسبب فقر دم شديدا مميتا قبل الولادة", "خضاب هجين من اندماج دلتا وبيتا، ويوجد بنسبة 30-45% ولا يسبب أعراضا", "خضاب جنيني من أربع سلاسل غاما، ويوجد بنسبة 100% عند البالغين الأصحاء", "جزيئات رباعية من سلاسل بيتا المتجمعة عندما يكون اصطناع ألفا نحو ثلث اصطناع بيتا، ويوجد بنسبة 5-30% ويسبب فقر دم انحلاليا معتدلا"], "q": "ما هو خضاب H في التلاسيميا ألفا؟"}, {"a": 2, "c": "الخضاب والهرمونات والنخامة والكظر", "e": "تُقسم التلاسيميا بيتا حسب التعبير المورثي إلى β+ حيث تُنتج سلاسل بيتا بكميات قليلة، وβ0 حيث يغيب إنتاج سلاسل بيتا كاملا.", "o": ["في β+ تُنتج سلاسل ألفا بكميات قليلة، وفي β0 غياب كامل لألفا", "في β+ لا يوجد أي خلل، وفي β0 يوجد خلل في السلسلة دلتا فقط", "في β+ تُنتج سلاسل بيتا بكميات قليلة، وفي β0 غياب كامل لإنتاج سلاسل بيتا", "في β+ غياب كامل لإنتاج بيتا، وفي β0 إنتاج طبيعي لبيتا مع زيادة غاما"], "q": "ما الفرق بين التلاسيميا بيتا بلس (β+) وبيتا صفر (β0)؟"}, {"a": 1, "c": "الخضاب والهرمونات والنخامة والكظر", "e": "RDW مقياس كمي لتنوع أحجام الكريات الحمر، يكون طبيعيا في التلاسيميا ويزداد في عوز الحديد، ويُظهر الرحلان في التلاسيميا الصغرى زيادة في A2 تُقدر عادة بين 3.5-7%.", "o": ["RDW مرتفع في الحالتين، ولا قيمة للخضاب A2 في التفريق بينهما", "RDW طبيعي في التلاسيميا ويزداد في عوز الحديد، والخضاب A2 مرتفع في التلاسيميا الصغرى عادة بين 3.5-7%", "RDW مرتفع في التلاسيميا وطبيعي في عوز الحديد، والخضاب A2 منعدم في التلاسيميا الصغرى", "RDW طبيعي في الحالتين، والخضاب A2 مرتفع في عوز الحديد فقط"], "q": "كيف يساعد عرض توزع الكريات الحمر (RDW) والخضاب A2 في التفريق بين التلاسيميا الصغرى وفقر الدم بعوز الحديد؟"}, {"a": 0, "c": "الخضاب والهرمونات والنخامة والكظر", "e": "يُجرى الرحلان على السليلوز أسيتات بوقاء قلوي pH 8.4-8.6، وترتيب الحركة من الأبطأ إلى الأسرع هو C ثم S ثم F ثم A.", "o": ["C ثم S ثم F ثم A، عند pH قلوي 8.4-8.6", "A ثم F ثم S ثم C، عند pH حمضي 6.0-6.2", "S ثم C ثم A ثم F، عند pH متعادل 7.0", "F ثم A ثم S ثم C، عند pH قلوي 8.4-8.6"], "q": "ما ترتيب هجرة الخضابات على الرحلان الكهربائي للسليلوز أسيتات، من الأبطأ إلى الأسرع، وعند أي pH يجرى؟"}, {"a": 3, "c": "الخضاب والهرمونات والنخامة والكظر", "e": "قد تظهر نتيجة سلبية خاطئة نتيجة فقر الدم أو نقل حديث أو عند الأطفال أقل من 6 أشهر بسبب التركيز العالي للخضاب F لديهم.", "o": ["عند كثرة الكريات الحمر، أو فرط غلوبولين الدم، أو فرط شحوم الدم فقط", "عند وجود خضاب C فقط، لأن اختبار الانحلالية لا يتأثر بالخضاب F", "عند ارتفاع تعداد الشبكيات فقط، دون أي علاقة بعمر الطفل أو نقل الدم", "عند فقر الدم، أو نقل دم حديث، أو عند الأطفال أقل من 6 أشهر بسبب التركيز العالي للخضاب F"], "q": "متى قد يعطي اختبار الانحلالية (Solubility test) نتيجة سلبية خاطئة للخضاب المنجلي؟"}, {"a": 2, "c": "الخضاب والهرمونات والنخامة والكظر", "e": "الميوغلوبين بروتين هيمي في العضلات الهيكلية وعضلة القلب، دوره نقل الأوكسجين إلى المتقدرات، وتحرره عضلة القلب المتناذية في الساعات الأولى ويبلغ الذروة خلال 2-3 ساعات، فهو أول واسم قلبي يرتفع قبل CK-MB أو التروبونين.", "o": ["إنزيم يصنع الخضاب في الكريات الحمر، ويرتفع متأخرا بعد التروبونين", "هرمون يفرز من النخامة، ويحفز نمو العضلات بعد التمرين", "بروتين هيمي في العضلات الهيكلية والقلب، ينقل الأوكسجين من غشاء الخلية العضلية إلى المتقدرات، ويتحرر في الساعات الأولى من الاحتشاء ويبلغ الذروة خلال 2-3 ساعات قبل CK-MB والتروبونين", "بروتين هيمي في الكبد فقط، ينقل الحديد إلى نقي العظم، ويرتفع بعد أيام من الاحتشاء"], "q": "ما دور الميوغلوبين (Myoglobin) ولماذا يعد واسما قلبيا باكرا؟"}, {"a": 1, "c": "الخضاب والهرمونات والنخامة والكظر", "e": "التراكيز العالية للميوغلوبين تؤدي إلى فشل كلوي، واقترانها بانخفاض التصفية الكلوية مؤشر عالي الخطورة للفشل الكلوي الحاد، ويتداخل الميوغلوبين البولي مع اختبار الخضاب بالشريط فيعطي تفاعلا إيجابيا، ويُفرق بينهما بمعايرات أدق مثل المناعية.", "o": ["ارتفاع الميوغلوبين يسبب فرط كالسيوم الدم، ويُفرق عنه باختبار الرحلان الكهربائي فقط", "اقتران التركيز العالية مع معدل تصفية كلوية منخفض مؤشر عالي الخطورة للفشل الكلوي الحاد، والميوغلوبين البولي يعطي تفاعلا إيجابيا كاذبا في اختبار الخضاب بالشريط الكاشف", "ارتفاع الميوغلوبين يسبب فقر دم فقط، ولا يتداخل مع أي اختبار بولي", "ارتفاع الميوغلوبين يرفع ضغط الدم فقط، ويتداخل مع اختبار السكر البولي"], "q": "ما خطر ارتفاع الميوغلوبين الشديد، وما تداخله المخبري الشائع؟"}, {"a": 0, "c": "الخضاب والهرمونات والنخامة والكظر", "e": "يتحرر التيروكسين فيثبط إنتاج TSH وTRH؛ فالتثبيط الراجع على مستوى النخامة يُدعى حلقة قصيرة، وعلى مستوى الوطاء حلقة طويلة، وبين النخامة والوطاء حلقة فوق قصيرة.", "o": ["التثبيط على مستوى النخامة حلقة قصيرة، وعلى مستوى الوطاء حلقة طويلة، وبين النخامة والوطاء حلقة فوق قصيرة", "التثبيط على مستوى النخامة حلقة طويلة، وعلى مستوى الوطاء حلقة قصيرة، وبينهما حلقة متوسطة", "التثبيط على مستوى النخامة والوطاء معا حلقة قصيرة فقط، ولا توجد حلقة طويلة", "التثبيط على مستوى الوطاء حلقة فوق قصيرة، وعلى مستوى النخامة حلقة طويلة"], "q": "ما تسمية حلقات التثبيط الراجع للتيروكسين على الوطاء والنخامة؟"}, {"a": 3, "c": "الخضاب والهرمونات والنخامة والكظر", "e": "يحفز GnRH إنتاج كل من LH وFSH، بينما يحفز TRH إفراز TSH والبرولاكتين، ويحفز CRH إفراز ACTH، ويثبط السوماتوستاتين تحرير GH وTSH.", "o": ["الهرمون المحرر للدرقية (TRH)", "الهرمون المحرر لمنشط الكظر (CRH)", "السوماتوستاتين (Somatostatin)", "الهرمون المحرر للموجهات القندية (GnRH)"], "q": "أي هرمون وطائي يحفز إفراز كل من LH وFSH؟"}, {"a": 2, "c": "الخضاب والهرمونات والنخامة والكظر", "e": "هرمونات النخامة إما مدارية على غدد صم أخرى مثل TSH وLH وACTH، أو ذات تأثير مباشر مثل GH والبرولاكتين؛ فـ GH له تأثيرات مباشرة على استقلاب الركائز ويحفز الكبد لإنتاج عوامل النمو.", "o": ["الهرمون المنشط لقشر الكظر (ACTH)، الذي ينظم صنع الستيرويدات الكظرية", "الهرمون الملوتن (LH)، الذي يحفز إنتاج التستوستيرون والإباضة", "هرمون النمو (GH)، الذي يحفز الكبد لإنتاج عوامل النمو ويؤثر مباشرة على استقلاب الركائز", "الهرمون المنبه للدرق (TSH)، الذي يوجه إنتاج هرمون الدرق"], "q": "أي هرمون من هرمونات النخامة الأمامية له تأثير مباشر على الأنسجة المحيطية وليس مداريا على غدة صم أخرى؟"}, {"a": 1, "c": "الخضاب والهرمونات والنخامة والكظر", "e": "إفراز GH نبضي، والفاصل بين النبضات 2-3 ساعات، وتكون قمة الإفراز عند بداية النوم، وينخفض مستوى GH بين النبضات إلى مستويات غير قابلة للكشف.", "o": ["إفراز مرة واحدة أسبوعيا، وقمة الإفراز عند اليقظة فقط", "إفراز نبضي بفاصل 2-3 ساعات بين النبضات، وقمة الإفراز عند بداية النوم، وينخفض بين النبضات إلى مستويات غير قابلة للكشف", "إفراز مستمر ثابت طوال اليوم، وقمة الإفراز عند الظهر", "إفراز نبضي بفاصل 55 دقيقة، وقمة الإفراز بعد الظهر"], "q": "كيف يُفرز هرمون النمو (GH) ومتى تكون قمة إفرازه؟"}, {"a": 0, "c": "الخضاب والهرمونات والنخامة والكظر", "e": "فرط GH قبل انتهاء نمو العظام الطويلة يُدعى عملقة نخامية، وعند البالغين يُدعى ضخامة النهايات، والأصحاء يثبطون GH إلى أقل من 1 نغ/مل بعد ابتلاع السكر الفموي، بينما مرضى ضخامة النهايات لا يُثبط لديهم GH أو قد يرتفع.", "o": ["العملقة عند فرط GH قبل انتهاء نمو العظام الطويلة، وضخامة النهايات عند البالغين، وعند الأصحاء يُثبط GH إلى أقل من 1 نغ/مل بعد السكر الفموي", "العملقة عند البالغين، وضخامة النهايات قبل انتهاء نمو العظام، وعند الأصحاء يرتفع GH بعد السكر الفموي", "الحالتان متطابقتان ولا علاقة لهما بعمر المريض، وعند الأصحاء يبقى GH ثابتا بعد السكر", "العملقة سببها عوز GH، وضخامة النهايات سببها عوز IGF-I، وعند الأصحاء يُثبط GH إلى أقل من 10 نغ/مل"], "q": "ما الفرق بين العملقة النخامية وضخامة النهايات (Acromegaly)، وما نتيجة اختبار تحميل الغلوكوز الفموي عند الأصحاء؟"}, {"a": 3, "c": "الخضاب والهرمونات والنخامة والكظر", "e": "المثبط الرئيسي للبرولاكتين هو الدوبامين، وأي تمزق لساق النخامة مثل ورم أو رض أو وذمة يسبب ارتفاع البرولاكتين نتيجة عدم تدفق الدوبامين من الوطاء إلى الخلايا المفرزة للبرولاكتين.", "o": ["TRH، وتمزق الساق يزيد TRH فيثبط البرولاكتين", "GnRH، وتمزق الساق يحرر GnRH فيرفع البرولاكتين", "الأستروجين، وتمزق الساق يمنع الأستروجين فيرتفع البرولاكتين", "الدوبامين، وتمزق الساق يمنع تدفق الدوبامين من الوطاء إلى الخلايا المفرزة للبرولاكتين فيرتفع"], "q": "ما المثبط الرئيسي للبرولاكتين، ولماذا يرتفع البرولاكتين عند تمزق ساق النخامة؟"}, {"a": 2, "c": "الخضاب والهرمونات والنخامة والكظر", "e": "ارتفاع البرولاكتين 1500 نغ/مل يدل على الورم البرولاكتيني، وارتفاعه 250-1000 نغ/مل يُشاهد مع انقطاع ساق النخامة أو استعمال أدوية معاكسة للدوبامين أو حالات طبية أخرى مثل قصور درق بدئي أو قصور كلوي.", "o": ["أي ارتفاع فوق الطبيعي يدل على الورم البرولاكتيني، ولا توجد مستويات مميزة للأسباب الأخرى", "ارتفاع البرولاكتين إلى 1500 نغ/مل يدل على ثر حليب مجهول السبب، وهو حالة بمستويات طبيعية", "ارتفاع البرولاكتين إلى 1500 نغ/مل يدل على الورم البرولاكتيني، بينما 250-1000 نغ/مل يُشاهد مع انقطاع ساق النخامة أو أدوية معاكسة للدوبامين أو قصور درق بدئي أو قصور كلوي", "ارتفاع البرولاكتين إلى 250 نغ/مل يدل حتما على الورم البرولاكتيني، و1500 نغ/مل يدل على قصور الدرق فقط"], "q": "ما مستويات البرولاكتين التي تدل على الورم البرولاكتيني مقابل الأسباب الأخرى؟"}, {"a": 1, "c": "الخضاب والهرمونات والنخامة والكظر", "e": "في قصور الدرق البدئي تكون مستويات التيروكسين منخفضة ومستويات TSH تتجاوز 200 ميكرو وحدة/مل (الطبيعي 4-5)، أما في قصور الدرق الثانوي الناتج عن قصور النخامة فتكون مستويات TSH منخفضة وعادة أقل من 1 ميكرو وحدة/مل.", "o": ["في البدئي التيروكسين مرتفع وTSH مرتفع، وفي الثانوي كلاهما منخفض", "في البدئي التيروكسين منخفض وTSH يتجاوز 200 ميكرو وحدة/مل، وفي الثانوي TSH منخفض عادة أقل من 1 ميكرو وحدة/مل", "في البدئي TSH أقل من 1، وفي الثانوي TSH يتجاوز 200", "في الحالتين TSH طبيعي بين 4-5، والفرق فقط في التيروكسين"], "q": "كيف يُفرق مخبريا بين قصور الدرق البدئي والثانوي الناتج عن قصور النخامة؟"}, {"a": 0, "c": "الخضاب والهرمونات والنخامة والكظر", "e": "النخامة الخلفية امتداد لمقدمة الدماغ وتمثل منطقة تخزين الفازوبريسين والأوكسيتوسين، وكلاهما يُصنع في الوطاء ثم يُنقل إلى النخامة العصبية بواسطة عصبونات جهاز النخامة العصبية الوطائية.", "o": ["يُصنعان في الوطاء، ثم يُنقلان إلى النخامة العصبية بواسطة عصبونات جهاز النخامة العصبية الوطائية، والنخامة الخلفية منطقة تخزينهما", "يُصنعان في النخامة الأمامية، ويُخزنان في الوطاء", "يُصنعان في قشر الكظر، ويُخزنان في لب الكظر", "يُصنعان في الغدة الدرقية، ويُخزنان في النخامة الخلفية"], "q": "أين يُصنع الفازوبريسين والأوكسيتوسين وأين يُخزنان؟"}, {"a": 3, "c": "الخضاب والهرمونات والنخامة والكظر", "e": "مستقبلات الأوسمولية حساسة لتغيرات صغيرة في أسمولية البلازما، ومتوسط عتبة تحرير الفازوبريسين 284 مل أسمول/كل ويزداد إفرازه بزيادة الأسمولية، وتتميز البيلة التفهة بإنتاج بولي غزير وعطش شديد نتيجة عوز الفازوبريسين.", "o": ["متوسط العتبة 200 مل أسمول/كل، وينقص الإفراز بزيادة الأسمولية، وتتميز DI بقلة البول والعطش", "متوسط العتبة 350 مل أسمول/كل، ولا يتأثر الإفراز بالأسمولية، وتتميز DI بارتفاع ضغط فقط", "لا توجد عتبة أسمولية، وتتميز DI بإنتاج بولي غزير نتيجة فرط الفازوبريسين", "متوسط العتبة 284 مل أسمول/كل، ويزداد الإفراز بزيادة أسمولية البلازما، وتتميز DI بإنتاج بولي غزير وعطش شديد نتيجة عوز الفازوبريسين"], "q": "ما عتبة الأسمولية لتحرير الفازوبريسين، وما سمة البيلة التفهة (DI)؟"}, {"a": 2, "c": "الخضاب والهرمونات والنخامة والكظر", "e": "المنطقة الحبيبية إلى الخارج وتشكل 10% وتصنع القشرانيات المعدنية (الألدوستيرون)، والحزمية في المنتصف وتشكل 75% وتصنع القشرانيات السكرية مثل الكورتيزول، والشبكية تشكل 10% وتسلفق DHEA إلى DHEAS وهو الأندروجين الكظري الرئيسي.", "o": ["الحبيبية 10% تصنع الكورتيزول، والحزمية 10% تصنع الألدوستيرون، والشبكية 75% تصنع التستوستيرون", "الحبيبية 50% تصنع DHEAS، والحزمية 25% تصنع الألدوستيرون، والشبكية 25% تصنع الكورتيزول", "الحبيبية 10% تصنع الألدوستيرون، والحزمية 75% تصنع الكورتيزول، والشبكية 10% تسلفق DHEA إلى DHEAS", "الحبيبية 75% تصنع الكورتيزول، والحزمية 10% تصنع الألدوستيرون، والشبكية 75% تصنع DHEAS"], "q": "ما طبقات قشر الكظر ونسبة كل منها وهرمونها الرئيسي؟"}, {"a": 1, "c": "الخضاب والهرمونات والنخامة والكظر", "e": "95% من حالات CAH تنتج عن عوز 21-hydroxylase الذي يؤدي إلى ارتفاع 17-OH progesterone والأندروجين بينما ينخفض الكورتيزول.", "o": ["عوز 3β-HSD في 95% من الحالات، ويؤدي إلى ارتفاع الكورتيزول فقط", "عوز 21-hydroxylase في 95% من الحالات، ويؤدي إلى ارتفاع 17-OH progesterone والأندروجين وانخفاض الكورتيزول", "عوز 17α-hydroxylase في 95% من الحالات، ويؤدي إلى ارتفاع الألدوستيرون وانخفاض الأندروجين", "عوز 11β-hydroxylase في 95% من الحالات، ويؤدي إلى ارتفاع الكورتيزول وانخفاض الأندروجين"], "q": "ما أشيع سبب لفرط تنسج الكظر الوراثي (CAH) وما نمطه المخبري؟"}, {"a": 0, "c": "الخضاب والهرمونات والنخامة والكظر", "e": "الرينين يحول الأنجيوتنسينوجين إلى أنجيوتنسين I ثم يحوله ACE إلى Ang II، وهو مقبض وعائي قوي يرفع ضغط الدم ويحرض تحرر الألدوستيرون، والألدوستيرون يزيد إعادة امتصاص الصوديوم والاحتفاظ بالماء ويحرض إطراح الهيدروجين والبوتاسيوم مسببا قلاء استقلابيا مع ارتفاع ضغط وانخفاض بوتاسيوم.", "o": ["الأنجيوتنسين II مقبض وعائي قوي يرفع الضغط ويحرض تحرر الألدوستيرون، والألدوستيرون يزيد إعادة امتصاص الصوديوم والاحتفاظ بالماء ويحرض إطراح الهيدروجين والبوتاسيوم مسببا قلاء استقلابيا", "الأنجيوتنسين II موسع وعائي يخفض الضغط ويثبط الألدوستيرون، والألدوستيرون يطرح الصوديوم ويحتفظ بالبوتاسيوم", "الأنجيوتنسين II يرفع الضغط دون تأثير على الألدوستيرون، والألدوستيرون يزيد إطراح الصوديوم والماء", "الأنجيوتنسين II يخفض الضغط ويحرض الألدوستيرون، والألدوستيرون يسبب حماضا استقلابيا وارتفاع بوتاسيوم"], "q": "كيف ينظم الأنجيوتنسين II والألدوستيرون ضغط الدم والصوديوم والبوتاسيوم؟"}, {"a": 3, "c": "الخضاب والهرمونات والنخامة والكظر", "e": "معظم الأسباب الشائعة لمتلازمة كوشينغ هو غدوم نخامي مفرز لـ ACTH بنسبة 68%، وإنتاج ال
