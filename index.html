ص البول: الأساسيات والمسح الكيميائي", "q": "ما الحد الأقصى الطبيعي لطرح البروتين في البول يوميا، وما البروتينان اللذان يشكل كل منهما حوالي ثلث بروتين البول؟", "o": ["150 ملغ/يوم؛ الألبومين وبروتين تام هورسفول (المخاط البولي)", "500 ملغ/يوم؛ الغلوبيولينات والليزوزوم", "1 غ/يوم؛ الألبومين وبيتا2-ميكروغلوبيولين", "4 غ/يوم؛ الألبومين والغلوبيولينات"], "a": 0, "e": "يتم طرح 150 ملغ/يوم من البروتين كحد أقصى بشكل طبيعي، ويشكل الألبومين حوالي ثلث بروتين البول، كما يشكل بروتين تام هورسفول حوالي ثلثه."}, {"c": "فحص البول: الأساسيات والمسح الكيميائي", "q": "ما الفرق بين طريقة السريدة وطريقة الترسيب بالحمض في كشف بروتين البول؟", "o": ["السريدة تكشف كل البروتينات والترسيب يكشف الألبومين فقط", "السريدة حساسة للألبومين فقط، بينما طريقة الترسيب بالحمض تكشف كل البروتينات بما فيها الغلوبيولينات", "كلاهما يكشف الألبومين فقط", "الترسيب بالحمض لا يكشف الغلوبيولينات"], "a": 1, "e": "طريقة السريدة حساسة للألبومين فقط، بينما تكشف طريقة الترسيب بالحمض كل البروتينات، وبالتالي سوف تكشف الغلوبيولينات بالإضافة للألبومين."}, {"c": "فحص البول: الأساسيات والمسح الكيميائي", "q": "ما سقف البيلة البروتينية الوظيفية عادة، وما بعض أسبابها؟", "o": ["أقل من 0.5 غ/يوم؛ التجفاف والتمارين العنيفة والحمى والتعرض للبرد وقصور القلب الاحتقاني", "أقل من 4 غ/يوم؛ الداء السكري فقط", "1-4 غ/يوم؛ الورم النقوي", "أكثر من 4 غ/يوم؛ المتلازمة النفروزية"], "a": 0, "e": "تكون البيلة البروتينية الوظيفية عادة أقل من 0.5 غ/يوم، وتُشاهد في التجفاف والتمارين العنيفة وقصور القلب الاحتقاني والتعرض للبرد والحمى."}, {"c": "فحص البول: الأساسيات والمسح الكيميائي", "q": "ما صفات البيلة البروتينية الانتصابية (postural proteinuria)؟", "o": ["تحدث عند 3-5% من البالغين الشباب الأصحاء، تظهر خلال اليوم وتزول ليلا عند الاستلقاء، ونادرا ما تتجاوز 1 غ/يوم", "تحدث عند كل المسنين وتتجاوز 4 غ/يوم دائما", "تظهر ليلا فقط وتستمر نهارا", "تدل دائما على مرض كلوي متقدم"], "a": 0, "e": "تحدث البيلة الانتصابية عند 3-5% من البالغين الشباب الأصحاء، حيث تحدث خلال اليوم وتزول ليلا عند الاستلقاء، ونادرا ما تتجاوز كمية البروتين 1 غ/يوم، وفي معظم الحالات لا يتطور أي مرض كلوي."}, {"c": "فحص البول: الأساسيات والمسح الكيميائي", "q": "ما تعريف البيلة البروتينية الثقيلة، وأين توجد بشكل أساسي؟", "o": [">4 غ/يوم، وتوجد بشكل أساسي في المتلازمة النفروزية", "1-4 غ/يوم، في التهاب الحويضة والكلية المزمن", "<1 غ/يوم، في الأمراض الأنبوبية", "20-200 ملغ/ل، في الداء السكري فقط"], "a": 0, "e": "البيلة البروتينية الثقيلة هي أكثر من 4 غ/يوم، وتوجد بشكل أساسي في المتلازمة النفروزية، التي تتظاهر تقليديا بانخفاض الألبومين المصلي ووذمة معممة وارتفاع شحوم الدم."}, {"c": "فحص البول: الأساسيات والمسح الكيميائي", "q": "ما مجال البيلة البروتينية المتوسطة؟", "o": ["<1 غ/يوم", "1-4 غ/يوم", ">4 غ/يوم", "30-300 ملغ/24 ساعة"], "a": 1, "e": "البيلة البروتينية المتوسطة هي 1-4 غ/يوم، وقد تُشاهد في أغلبية الأمراض الكلوية بالإضافة إلى الورم النقوي المتعدد وأمراض السبيل البولي السفلي."}, {"c": "فحص البول: الأساسيات والمسح الكيميائي", "q": "ما مجال البيلة الألبومينية الدقيقة (microalbuminuria)، وما دلالتها عند مرضى السكري؟", "o": ["20-200 ملغ/ل أو 30-300 ملغ/24 ساعة، وتزيد احتمال الوفاة بأمراض القلب الإكليلية بمقدار 2-4 أضعاف", "أكثر من 4 غ/يوم، وتدل على النفروز", "أقل من 150 ملغ/يوم، وهي طبيعية", "1-4 غ/يوم، وتدل على التهاب الحويضة"], "a": 0, "e": "وجود الألبومين بمستويات 20-200 ملغ/ل (أو معدل إطراح 30-300 ملغ/24 ساعة) يُعتبر مؤشرا لحدوث أذية كبيبية عكسية، ووجودها عند مرضى السكري يزيد احتمال الوفاة بأمراض القلب الإكليلية بمقدار 2-4 أضعاف."}, {"c": "فحص البول: الأساسيات والمسح الكيميائي", "q": "في النموذج الكبي الانتقائي للبيلة البروتينية، ما البروتينات الكبيرة التي لا تُشاهد في البول إذا بقيت الكبيبات انتقائية؟", "o": ["الألبومين وبيتا2-ميكروغلوبيولين", "ألفا2-ماكروغلوبيولين وبيتا-ليبوبروتين", "الغلوبيولينات الصغيرة فقط", "بروتين تام هورسفول"], "a": 1, "e": "إذا بقيت وظيفة الأنبوب طبيعية وبقيت الكبيبات انتقائية، فإن البروتينات الكبيرة لا تُشاهد في البول، وهي ألفا2-ماكروغلوبيولين وبيتا-ليبوبروتين؛ وظهورها يعني بيلة أقل انتقائية وأذية كبيبية كبيرة."}, {"c": "فحص البول: الأساسيات والمسح الكيميائي", "q": "ما سمة النموذج الأنبوبي للبيلة البروتينية، ولماذا قد تفوته طريقة السريدة؟", "o": ["بروتينات عالية الوزن الجزيئي بكمية أكثر من 4 غ/يوم، وتكشفه السريدة دائما", "فقدان كمية قليلة (حوالي 2 غ/يوم) من البروتينات منخفضة الوزن الجزيئي مثل بيتا2-ميكروغلوبيولين، وقد لا يُشخص بالسريدة بسبب انخفاض الألبومين جدا، لكن يمكن كشفه بالترسيب بالحمض", "بيلة ألبومينية دقيقة فقط", "بروتين بنس جونس فقط"], "a": 1, "e": "في النموذج الأنبوبي تُفقد كمية قليلة من البروتينات منخفضة الوزن الجزيئي التي يُعاد امتصاصها عادة، وتُقاس بيتا2-ميكروغلوبيولين، وكمية البروتين حوالي 2 غ/يوم، وقد لا تُشخص بالسريدة بسبب انخفاض الألبومين جدا، لكن يمكن كشفها بالترسيب بالحمض."}, {"c": "فحص البول: الأساسيات والمسح الكيميائي", "q": "في أي أمراض تحدث بيلة بروتين بنس جونس، وبأي نسبة في الورم النقوي المتعدد، وما أفضل طرق كشفها النوعي؟", "o": ["في الورم النقوي المتعدد وفرط ماكروغلوبيولين الدم واللمفومات الخبيثة؛ في 50-80% من حالات الورم النقوي؛ وأفضل الطرق الرحلان الكهربائي والرحلان الكهربائي بالتثبيت المناعي", "في الداء السكري فقط؛ في 10%؛ بالسريدة وحدها", "في التهاب الحويضة فقط؛ في 100%؛ بقياس الكثافة النوعية", "في النفروز فقط؛ في 20%؛ باختبار الرائحة"], "a": 0, "e": "تحدث بيلة بنس جونس في الورم النقوي المتعدد وفرط ماكروغلوبيولين الدم واللمفومات الخبيثة، وفي 50-80% من حالات الورم النقوي، وقد لا تُشخص بالسرائد وحدها، وأفضل الطرق النوعية هي الرحلان الكهربائي والرحلان الكهربائي بالتثبيت المناعي."}, {"a": 0, "c": "الراسب البولي والبلورات والأسطوانات", "e": "يبدأ انحلال الخلايا والأسطوانات خلال ساعتين من جمع البول، لذلك يفضل الفحص على عينة طازجة.", "o": ["لأن الخلايا والأسطوانات تبدأ بالانحلال خلال ساعتين من جمع البول", "لأن البلورات لا تتكون إلا في البول الطازج", "لأن الكثافة النوعية ترتفع بعد ساعتين", "لأن البول الطازج يمنع تكون الأسطوانات الهيالينية"], "q": "لماذا يفضل فحص الراسب البولي على عينة بول طازجة؟"}, {"a": 2, "c": "الراسب البولي والبلورات والأسطوانات", "e": "يظهر الطور المتباين حدود العناصر الأكثر شفافية، فيسهل كشف الأسطوانات ويقل زمن المسح وتزداد الرؤية وضوحا.", "o": ["يصبغ الخلايا باللون البنفسجي", "يميز البلورات عن الألياف فقط", "يكشف العناصر الأكثر شفافية، خاصة الأسطوانات التي قد لا تكشف بالمجهر ذي الحقل الساطع", "يقيس الكثافة النوعية للبول"], "q": "ما فائدة المجهر ذي الطور المتباين (Phase-contrast) في فحص الراسب البولي؟"}, {"a": 1, "c": "الراسب البولي والبلورات والأسطوانات", "e": "تتراوح الحدود العليا للكريات الحمراء بين 3-20/مكل، وبالنسبة للأسطوانات أقل من 1/مكل.", "o": ["الكريات الحمراء 30-50/مكل والأسطوانات 5-10/مكل", "الكريات الحمراء 3-20/مكل والأسطوانات أقل من 1/مكل", "الكريات الحمراء 1-2/مكل والأسطوانات 10/مكل", "الكريات الحمراء 100/مكل والأسطوانات أقل من 5/مكل"], "q": "في التعداد الكمي للراسب البولي، ما الحد الأعلى للكريات الحمراء وما حد الأسطوانات؟"}, {"a": 3, "c": "الراسب البولي والبلورات والأسطوانات", "e": "في البول الممدد تنتبج الكريات الحمراء وتنحل بسرعة محررة الخضاب، وتبقى أغشية فارغة تدعى الخلايا الشبح.", "o": ["تتحول إلى بلورات أوكسالات الكالسيوم", "تزداد قتامة لونها وتصبح مسننة فقط", "تتحول إلى خلايا ظهارية أنبوبية", "تنتبج وتنحل بسرعة ويبقى فقط أغشية الخلايا الفارغة التي تدعى الخلايا الشبح (ghost cells)"], "q": "ماذا يحدث للكريات الحمراء في البول الممدد؟"}, {"a": 1, "c": "الراسب البولي والبلورات والأسطوانات", "e": "توجد الكريات الحمراء بأعداد قليلة (0-2 خلية/ساحة) في البول الطبيعي، وأكثر من 3/ساحة يدل على بول غير طبيعي.", "o": ["عندما يزيد عن 10 خلايا/ساحة فقط", "عندما يزيد عن 3 خلايا/ساحة، بينما 0-2 خلية/ساحة في البول الطبيعي", "عندما يوجد أي كرية حمراء واحدة", "عندما يزيد عن 30 خلية/ساحة فقط"], "q": "متى يعد عدد الكريات الحمراء في البول غير طبيعي؟"}, {"a": 0, "c": "الراسب البولي والبلورات والأسطوانات", "e": "الكريات المشوهة ذات النتوءات أو التجزؤات تدل بشدة على نزيف كبيبي، وخلايا G1 الكمكية الشكل مع فقاعة غشائية واحدة أو أكثر أكثر نوعية لذلك.", "o": ["تدل بشدة على نزيف كلوي كبيبي، وخلايا G1 بشكل كمكة مدورة مع فقاعة غشائية قد تكون أكثر نوعية للبيلة الدموية الكبيبية", "تدل على التهاب مثانة فقط", "تدل على تلوث مهبلي", "تدل على حصيات في الإحليل فقط"], "q": "ما دلالة وجود كريات حمراء مشوهة الشكل (Dysmorphic) وخلايا G1 في البول؟"}, {"a": 3, "c": "الراسب البولي والبلورات والأسطوانات", "e": "يشاهد في البول الطبيعي أقل من 5 كريات بيضاء/ساحة، وزيادة الكريات البيضاء (بشكل رئيسي المعتدلات) تدعى بيلة قيحية وتدل على التهاب أو إنتان.", "o": ["وجود كريات حمراء فقط في البول", "وجود أسطوانات هيالينية فقط", "وجود بلورات في البول القلوي", "زيادة عدد الكريات البيضاء في البول، بشكل رئيسي المعتدلات، وتدل على التهاب أو إنتان في الطريق البولي، بينما الطبيعي أقل من 5 كريات بيضاء/ساحة"], "q": "ما تعريف البيلة القيحية (Pyuria)؟"}, {"a": 2, "c": "الراسب البولي والبلورات والأسطوانات", "e": "تنتبج المعتدلات في البول الممدد أو منخفض التوتر، وحبيباتها المتحركة الكاسرة للضوء تجعلها تدعى الخلايا المتلألئة.", "o": ["كريات حمراء مسننة في البول عالي التوتر", "خلايا ظهارية مسطحة كبيرة", "معتدلات في البول الممدد أو منخفض التوتر، تنتبج وتبدي حبيباتها الهيولية حركة براونية كاسرة للضوء", "بلورات كولسترول تحت الضوء المستقطب"], "q": "ما الخلايا المتلألئة (Glitter cells)؟"}, {"a": 2, "c": "الراسب البولي والبلورات والأسطوانات", "e": "لا تشاهد الحمضات طبيعيا في البول، ووجودها بأكثر من 1% من الكريات البيضاء له دلالة هامة، وتشاهد في فرط التحسس الدوائي الأنبوبي الخلالي.", "o": ["عندما توجد أي حمضة واحدة فقط", "عندما تكون الحمضات أقل من 1% دائما", "عندما تزيد الحمضات عن 1% من مجموع الكريات البيضاء، وتشاهد في الأمراض الأنبوبية الخلالية المرافقة لفرط التحسس للأدوية مثل البنسيلين", "عندما ترافق الأسطوانات الهيالينية فقط"], "q": "متى تكون بيلة الحمضات (Eosinophiluria) ذات دلالة هامة؟"}, {"a": 1, "c": "الراسب البولي والبلورات والأسطوانات", "e": "الخلايا الأنبوبية الكلوية من أكثر الخلايا الظهارية أهمية، فزيادتها تدل على أذية أنبوبية، وتكثر في النخر الأنبوبي الحاد والتسمم بالمعادن الثقيلة.", "o": ["يدل على تلوث مهبلي فقط", "يدل على حدوث أذية أنبوبية، وتشاهد بأعداد كبيرة في النخر الأنبوبي الحاد والتسمم بالمعادن الثقيلة وبعض الأدوية", "لا أهمية له إطلاقا", "يدل على التهاب مثانة فقط"], "q": "ما دلالة وجود عدد زائد من الخلايا الظهارية الأنبوبية الكلوية في البول؟"}, {"a": 0, "c": "الراسب البولي والبلورات والأسطوانات", "e": "الأجسام الشحمية البيضوية شكل من البيلة الشحمية، وتؤكد الشحوم بملونات الشحوم مثل أحمر الزيت O أو السودان III، ووجودها مع بيلة بروتينية ملحوظة وصفي للمتلازمة النفروزية.", "o": ["خلايا أنبوبية امتصت البروتينات الشحمية مع الكولسترول المتسرب من الكبيبات، ووجودها مع بيلة بروتينية ملحوظة وصفي للمتلازمة النفروزية", "خلايا ظهارية مسطحة من الإحليل القاصي", "كريات حمراء منحلة في البول القلوي", "بلورات فوسفات في البول الحامضي"], "q": "ما الأجسام الشحمية البيضوية (Oval fat bodies) وما دلالتها؟"}, {"a": 3, "c": "الراسب البولي والبلورات والأسطوانات", "e": "بروتين تام-هورسفال هو المادة الأساسية لجميع الأسطوانات، والأسطوانات هي العنصر المتشكل الوحيد الذي تكون الكلية الموقع الوحيد لمنشئه.", "o": ["الألبومين فقط", "الهيموغلوبين", "الكولسترول", "بروتين تام-هورسفال (Tamm-Horsfall)، وهو البروتين البولي الأساسي الذي يشكل شبيكة من الألياف تلتقط عناصر الرشاحة الكبيبية"], "q": "ما المادة الأساسية لجميع الأسطوانات البولية؟"}, {"a": 1, "c": "الراسب البولي والبلورات والأسطوانات", "e": "الأسطوانات الهيالينية أكثر الأسطوانات مشاهدة وتتكون تقريبا كليا من بروتين تام-هورسفال، و0-2 في حقل ضعيف القوة طبيعي.", "o": ["أكثر من 10 في الحقل طبيعي دائما", "من صفر إلى أسطوانتي هيالين في حقل ضعيف القوة طبيعي، وتكثر في أمراض الكلية والترفع الحروري والتجفاف وقصور القلب الاحتقاني والعلاج بالمدرات", "تكثل فقط في البيلة الدموية الكبيبية", "لا تشاهد أبدا عند الأصحاء"], "q": "متى يعد عدد الأسطوانات الهيالينية طبيعيا، ومتى تكثر؟"}, {"a": 2, "c": "الراسب البولي والبلورات والأسطوانات", "e": "تترافق الأسطوانات الشمعية مع التهاب الأنابيب وتنكسها، وتشاهد عند مرضى القصور الكلوي المزمن، وتشكلها يتطلب انسدادا كبيبيا وشحا في البول.", "o": ["تشاهد في البول الطبيعي فقط", "تدل على التهاب مثانة حاد فقط", "تشاهد في أمراض الكلية المزمنة، وهي كثيفة المظهر ذات حواف حادة ونهايات مئلمة، والأسطوانات الشمعية العريضة تعرف بأسطوانات القصور الكلوي وتعكس المرحلة النهائية للمرض الكلوي", "تتكون من بلورات السيستين فقط"], "q": "ما دلالة الأسطوانات الشمعية (Waxy casts)؟"}, {"a": 0, "c": "الراسب البولي والبلورات والأسطوانات", "e": "الأذية الكبيبية تؤدي إلى تسرب الكريات الحمراء إلى الأنابيب فتتشكل أسطوانات الكريات الحمراء، ويتطلب تشخيصها حواف كريات حمراء محددة بشكل حاد لقسم من الأسطوانة على الأقل.", "o": ["تشير إلى نزف ضمن الكبيبات، وتشاهد في التهاب الكبب والكلية الحاد واعتلال الكلية بـ (IgA) والتهاب الكلية الذئبي والتهاب الشغاف الجرثومي تحت الحاد والاحتشاء الكلوي", "تشير إلى نزف من الإحليل القاصي فقط", "تشير إلى تلوث مهبلي", "لا دلالة مرضية لها"], "q": "ما دلالة أسطوانات الكريات الحمراء؟"}, {"a": 1, "c": "الراسب البولي والبلورات والأسطوانات", "e": "أسطوانات الكريات البيضاء كاسرة للضوء تحوي حبيبات ويشاهد فيها غالبا نواة متعددة الفصوص، وأكثر مرض شيوع في فئتها هو التهاب الحويضة والكلية.", "o": ["التهاب المثانة النزفي فقط", "التهاب الحويضة والكلية، لأن الكريات البيضاء تدخل لمعة الأنبوب من النسيج الخلالي وتشير عادة إلى مرض خلالي أنبوبي", "داء السكري فقط", "حصيات الإحليل فقط"], "q": "ما المرض الأكثر شيوعا المرافق لأسطوانات الكريات البيضاء؟"}, {"a": 3, "c": "الراسب البولي والبلورات والأسطوانات", "e": "قد يصعب تمييز أسطوانات الخلايا الأنبوبية عن أسطوانات الكريات البيضاء في المحضرات غير الملونة، وتشاهد في النخر الأنبوبي الحاد والفيروس المضخم للخلايا والتسممات المذكورة ورفض الطعم.", "o": ["في البول الطبيعي فقط بأعداد كبيرة", "في التهاب المثانة فقط", "في البيلة الشحمية فقط", "النخر الأنبوبي الحاد، والأمراض بالفيروسات مثل الفيروس المضخم للخلايا، وابتلاع الخلي والتسمم بالمعادن الثقيلة والساليسيلات ورفض الطعوم بعد اليوم الثالث"], "q": "في أي حالات تشاهد أسطوانات الخلايا الظهارية الأنبوبية الكلوية؟"}, {"a": 2, "c": "الراسب البولي والبلورات والأسطوانات", "e": "قد تكون الحبيبات صغيرة أو كبيرة، وتنشأ أيضا من ترسب الأملاح الناعمة والليزوزومات والفيبرينوجين والغلوبولينات، وتظهر في الأمراض الكبيبية والأنبوبية.", "o": ["من بلورات حمض البول فقط", "من الكولسترول فقط", "من تجمعات البروتين البلازمي وبقايا الكريات البيضاء والحمراء وخلايا الأنابيب المتنكسة، والحبيبات الخشنة مع البيلة الدموية تشاهد في تنخر الحليمات الكلوية", "من البكتيريا فقط"], "q": "ما منشأ حبيبات الأسطوانات الحبيبية، وما دلالة الحبيبات الخشنة مع البيلة الدموية؟"}, {"a": 0, "c": "الراسب البولي والبلورات والأسطوانات", "e": "تشاهد الأسطوانات الشحمية عادة مع البيلة البروتينية الثقيلة، وهي من مظاهر المتلازمة النفروزية.", "o": ["عندما تكون هناك بيلة بروتينية ثقيلة، وهي إحدى مظاهر متلازمة النفروز", "في البول الطبيعي دائما", "في التهاب الحويضة فقط", "بعد التمارين الخفيفة فقط"], "q": "متى تشاهد الأسطوانات الشحمية (Fatty casts) عادة؟"}, {"a": 2, "c": "الراسب البولي والبلورات والأسطوانات", "e": "أسطوانات الميوغلوبين ذات لون أحمر-بني، وتظهر بعد أذية عضلية حادة وقد تترافق مع قصور كلوي حاد.", "o": ["لون أصفر فاتح في البول الطبيعي", "لون أبيض في التهاب المثانة", "لون أحمر-بني، وتظهر في البيلة الميوغلوبينية عقب أذية عضلية حادة، وقد تترافق مع القصور الكلوي الحاد", "لون أخضر في اليرقان الانسدادي"], "q": "ما لون أسطوانات الميوغلوبين ومتى تظهر؟"}, {"a": 3, "c": "الراسب البولي والبلورات والأسطوانات", "e": "تعرف الأسطوانات العريضة بقطر 2-6 أضعاف الطبيعي، وتشاهد وصفيا عند المصابين بقصور كلوي مزمن.", "o": ["أسطوانات رقيقة في الأنابيب الرقيقة فقط", "أسطوانات هيالينية طبيعية", "أسطوانات تتكون في المثانة", "قطرها 2-6 أضعاف قطر الأسطوانة الطبيعية، وتشير إلى توسع أنبوبي أو ركودة في الأنبوب الجامع البعيد، وتشاهد وصفيا في القصور الكلوي المزمن وتشير إلى إنذار سيئ"], "q": "ما الأسطوانات العريضة (Broad casts) وما دلالتها؟"}, {"a": 1, "c": "الراسب البولي والبلورات والأسطوانات", "e": "يستعمل مصطلح الراسب التلسكوبي لوصف ترافق عناصر التهاب الكبب والكلية مع عناصر المتلازمة النفروزية في عينة واحدة.", "o": ["وجود بلورات فقط في البول الحامضي", "وجود عناصر التهاب الكبب والكلية مع عناصر المتلازمة النفروزية في نفس العينة: كريات حمراء وأسطوانات حمراء وأسطوانات خلوية وأسطوانات شمعية عريضة وقطرات شحمية وأجسام بيضوية شحمية وأسطوانات شحمية", "وجود بكتيريا فقط دون خلايا", "وجود خلايا ورمية فقط"], "q": "ما الراسب التلسكوبي (Telescoped sediment)؟"}, {"a": 0, "c": "الراسب البولي والبلورات والأسطوانات", "e": "تترسب اليورات عديمة الشكل في البول المركز المتروك ذي pH حامضي قليلا، وتتحول إلى بلورات حمض البول عند تحميض البول بحمض الخل.", "o": ["راسب بلون برتقالي-زهري إلى بني محمر يدعى بغبار الآجر، وحبيبات صغيرة بنية صفراء، وتنحل عند 60 درجة مئوية وفي المحاليل القلوية الممددة", "راسب أبيض ناعم عديم اللون في البول القلوي", "بلورات سداسية عديمة اللون", "بلورات على شكل ظرف رسالة"], "q": "ما مظهر اليورات عديمة الشكل (Amorphous urates) بكميات كبيرة، ومتى تنحل؟"}, {"a": 3, "c": "الراسب البولي والبلورات والأسطوانات", "e": "بلورات حمض البول متنوعة الأشكال مثل المعين والصفائح المسطحة رباعية الأضلاع والموشور والأشكال البيضوية ذات النهايات المدببة، وغالبا ملونة بالأصفر أو البني المحمر.", "o": ["عند pH قلوي فقط، وتدل على التهاب مثانة فقط", "عند pH 7 فقط، ولا دلالة لها", "عند أي pH، وتدل على داء السكري فقط", "عند pH منخفض 5.0-5.5، والأعداد الكبيرة قد تعكس زيادة استقلاب البروتينات النووية أثناء المعالجة الكيميائية لابيضاض الدم واللمفوما، وتشاهد في متلازمة ليش نيهان وقد تنذر باعتلال كلية نقرسي"], "q": "عند أي pH تترسب بلورات حمض البول، وما دلالة أعدادها الكبيرة؟"}, {"a": 2, "c": "الراسب البولي والبلورات والأسطوانات", "e": "قد تشاهد أوكسالات الكالسيوم على شكل أثقال الجمباز أو بيضوية، والأشكال الطويلة في أوكسالات الكالسيوم أحادية الماء، وكمياتها الكبيرة قد تعكس التسمم بالإيثيلين غليكول أو الإصابة الكلوية المزمنة الشديدة.", "o": ["صفائح سداسية عديمة اللون تنحل في حمض الخل", "حزم قمح صفراء-بنية", "مجسم صغير ثماني السطوح عديم اللون يشبه ظرف الرسالة، ولا تنحل في حمض الخل وإنما تذوب في حمض كلور الماء", "كرات ذات أشواك تشبه التفاح المشوك"], "q": "ما الشكل الكلاسيكي لأوكسالات الكالسيوم ثنائية الماء، وما يميز انحلالها؟"}, {"a": 1, "c": "الراسب البولي والبلورات والأسطوانات", "e": "بلورات الفوسفات الثلاثية من أكثر البلورات سهولة في التمييز، وقد تكون أيضا بشكل صفائح أو ألواح عديمة اللون، وتواجدها ليس له أهمية سريرية كبيرة إجمالا.", "o": ["صفائح سداسية كاسرة للضوء في البول الحامضي", "مواشير عديمة اللون ثلاثية إلى ستة وجوه مع نهايات مائلة تشبه غطاء التابوت، وتتواجد غالبا في الأبواب الالتهابية قلوية التفاعل", "إبر حريرية ناعمة في البول الحامضي", "حزم قمح في البول الحامضي"], "q": "ما الشكل المميز لبلورات الفوسفات الثلاثية (أمونيوم مغنزيوم فوسفات)؟"}, {"a": 3, "c": "الراسب البولي والبلورات والأسطوانات", "e": "بلورات السيستين من أكثر بلورات البول أهمية، تحدث عند مرضى البيلة السيستينية وقد تؤدي إلى حصيات السيستين، ويؤكد وجودها اختبار نتروبروسيد الصوديوم، وتنحل عند pH أقل من 2 أو أكثر من 8.", "o": ["بلورات على شكل ظرف رسالة تنحل في حمض الخل", "بلورات غطاء التابوت في البول القلوي", "إبر صفراء في البول الحامضي", "صفائح سداسية عديمة اللون كاسرة للضوء في البول الحامضي، وكلاهما ينحل في الأمونيا، لكن السيستين ينحل في حمض كلور الماء الممدد أما حمض البول فلا ينحل"], "q": "ما بلورات السيستين، وكيف تميز عن بلورات حمض البول السداسية؟"}, {"a": 0, "c": "الراسب البولي والبلورات والأسطوانات", "e": "الاختبار المؤكد لبلورات السلفوناميد هو تفاعل الديازو وطرق القياس اللونية وHPLC.", "o": ["في البول الحامضي، على شكل حزم قمح بلون أصفر-بني، أو مثلثة، أو أزهار، أو رأس السهم، أو إبر، وأحيانا عديمة اللون", "في البول القلوي على شكل غطاء التابوت", "في البول الحامضي على شكل صفائح سداسية", "في البول القلوي على شكل ظرف رسالة"], "q": "ما شكل بلورات السلفوناميد (السلفاديازين) وفي أي بول تشاهد؟"}, {"a": 1, "c": "الراسب البولي والبلورات والأسطوانات", "e": "يرتشح الخضاب الحر عبر الكبيبة ويعاد امتصاصه في الأنبوب القريب حيث يتحول إلى فيرتين وهيموسيدرين، ويظهر الهيموسيدرين كحبيبات بنية-صفراء حرة أو ضمن الخلايا الظهارية وأحيانا ضمن الأسطوانات.", "o": ["فورا مع النوبة وقبل ظهور الخضاب", "بعد 2-3 أيام من النوبة التي تسبب البيلة الخضابية، وفي هذا الوقت يعطي تحليل الشرائط سلبية غالبا", "بعد شهر من النوبة فقط", "لا يظهر أبدا في البول"], "q": "متى يظهر الهيموسيدرين في البول بعد نوبة انحلال دم حادة؟"}, {"a": 2, "c": "الراسب البولي والبلورات والأسطوانات", "e": "في البيلة الميوغلوبينية يعطي اختبار الشرائط للخضاب إيجابية واضحة مع بروتين وكريات حمراء قليلة، ويكون المصل رائقا مع ارتفاع CK والألدولاز، وقد يرتفع الكرياتينين.", "o": ["في البيلة الميوغلوبينية يكون الهابتوغلوبين غائبا دائما", "لا فرق بينهما إطلاقا", "في البيلة الميوغلوبينية يكون المصل رائقا والكرياتين كيناز (CK) مرتفعا بشكل واضح والألدولاز مرتفعا والهابتوغلوبين طبيعيا، بينما في البيلة الخضابية يكون المصل زهريا والهابتوغلوبين منخفضا", "في البيلة الخضابية يكون CK مرتفعا والهابتوغلوبين طبيعيا"], "q": "كيف تفرق مخبريا بين البيلة الميوغلوبينية والبيلة الخضابية؟"}, {"a": 3, "c": "الراسب البولي والبلورات والأسطوانات", "e": "يكون اختبار النتريت إيجابيا عند وجود جراثيم بأعداد كبيرة، ومن الجراثيم الشائعة E.coli والكليبسيلا والبروتيوس، أما المكورات المعوية فغير قادرة على إرجاع النترات إلى النتريت، وإذا كان الاختبار إيجابيا يفضل إجراء زرع للبول.", "o": ["لأن النتريت لا يوجد إلا صباحا إطلاقا", "لأن المكورات المعوية تحول النترات صباحا فقط", "لأن حمض الأسكوربيك يختفي صباحا", "لأن المثانة تعمل كحاضنة للجراثيم خلال الليل على الأقل 4 ساعات مما يساعدها على تحويل النترات إلى نتريت"], "q": "لماذا يجرى اختبار النتريت على البول الصباحي؟"}, {"a": 2, "c": "الراسب البولي والبلورات والأسطوانات", "e": "تحوي حبيبات المعتدلات حتى 10 بروتينات تبدي فعالية حالة للإستيراز، وتنقص الكثافة النوعية المرتفعة والبروتين والغلوكوز من نتائج الاختبار، وتلوث البول بالسائل المهبلي قد يعطي نتائج إيجابية.", "o": ["من الخلايا الظهارية المسطحة فقط", "من الكريات الحمر فقط", "فعالية إستيراز من حبيبات المعتدلات المحبة للآزور، وترتبط النتائج الإيجابية بعدد المعتدلات، بينما الخلايا الظهارية البولية والكريات الحمر لا تساهم في رفع مستوى الإستيراز", "من البلورات فقط"], "q": "ما مصدر إستيراز الكريات البيض، وما الذي لا يساهم في رفعه؟"}, {"a": 0, "c": "الراسب البولي والبلورات والأسطوانات", "e": "بعد التثفيل يعاد عزق الراسب بلطف ويترك البول 30-60 ثانية حتى يرقد، وتعد الخلايا في ما لا يقل عن 10 ساحات عالية التكبير، والقيم الطبيعية تشمل 1-10 كريات حمراء و1-10 كريات بيضاء في الساحة عالية التكبير و0-2 أسطوانة شفافة في الساحة منخفضة التكبير.", "o": ["10-15 مل تثفل عند 450 غ لمدة 5 دقائق، وتعد الأسطوانات في ما لا يقل عن 10 ساحات منخفضة التكبير ويؤخذ الوسطي", "5 مل تثفل عند 1000 غ لمدة دقيقة، وتعد الأسطوانات في ساحة واحدة", "50 مل تثفل عند 100 غ لمدة 30 دقيقة، وتعد الأسطوانات في 3 ساحات", "10-15 مل دون تثفيل، وتعد الأسطوانات في ساحة واحدة عالية التكبير"], "q": "في الإجراء الروتيني لتحليل البول، كم مل من البول يثفل، وعند أي قوة ولمدة كم، وكم ساحة تحسب للأسطوانات؟"}, {"a": 1, "c": "الراسب البولي والبلورات والأسطوانات", "e": "لذلك يجب فحص عينات بول طازجة للتحري عن ا ر", "نقص صفيحات أقل من 150000/ملم3 مرة واحدة", "فقر دم انحلالي دون فرط شبكيات", "نقص لمفاويات أقل من 2000/ملم3 مرة واحدة"], "a": 0, "e": "الاضطراب الدموي يشمل فقر دم انحلالي مع فرط شبكيات، أو نقص كريات بيض أقل من 4000/ملم3 لمرتين أو أكثر، أو نقص لمفاويات أقل من 1500/ملم3 لمرتين أو أكثر، أو نقص صفيحات أقل من 100000/ملم3 دون دواء يقللها."}, {"c": "الرحلان الكهربائي وسوائل الجسم والأمراض الرثوية", "q": "ما الضد الأكثر نوعية للذئبة الحمامية الجهازية ويوجد في حوالي 65% من مرضى SLE الفعال؟", "o": ["أضداد DNA ثنائي الطاق (anti-dsDNA)", "العامل الرثياني (RF)", "أضداد SS-B/La وحدها", "أضداد Jo-1"], "a": 0, "e": "أضداد DNA ثنائي الطاق نوعية جدا لـ SLE وتلاحظ بنسبة 65% من مرضى SLE الفعال، بينما تكون الأضداد في الأمراض الأخرى غالبا أضداد DNA وحيد الطاق."}, {"c": "الرحلان الكهربائي وسوائل الجسم والأمراض الرثوية", "q": "مريض لديه أضداد هيستون وأضداد DNA وحيد الطاق دون أضداد Sm أو dsDNA. ما الاحتمال الأرجح؟", "o": ["ذئبة جهازية كلاسيكية", "ذئبة محدثة دوائيا", "متلازمة جوغرن البدئية", "تصلب جلد جهازي"], "a": 1, "e": "ميزة الذئبة المحدثة دوائيا تواجد الأضداد الذاتية للهيستون مع أضداد DNA وحيد الطاق، بينما في SLE تتواجد أضداد DNA ثنائي الطاق وSm وU1nRNP إضافة إلى أضداد الهيستونات."}, {"c": "الرحلان الكهربائي وسوائل الجسم والأمراض الرثوية", "q": "ما مكونات متلازمة CREST في تصلب الجلد؟", "o": ["تكلس جلدي، ظاهرة رينو، عسر حركة المري، تصلب الأصابع، توسع الشعيرات", "حمى، طفح وجني، التهاب مفاصل، التهاب جنب، فقر دم", "جفاف عينين وفم، ضخامة عقد لمفاوية، التهاب وعائي جلدي", "ضعف عضلي، طفح جلدي، داء رئة خلالي"], "a": 0, "e": "مجموعة CREST تتكون من تكلس الجلد (calcinosis cutis) وظاهرة رينو وعسر حركة المري وتصلب الأصابع وتوسع الشعيرات، وتوجد أضداد القسيم المركزي لدى 65% من مرضى هذه المجموعة."}, {"c": "الرحلان الكهربائي وسوائل الجسم والأمراض الرثوية", "q": "أضداد Scl-70 (DNA topoisomerase I) توجد لدى حوالي 20% من مرضى تصلب الجلد. بماذا تترافق؟", "o": ["إصابة جلدية محدودة ونسبة وفيات أقل", "إصابة جلدية منتشرة وتزايد التليف الرئوي ونسبة وفيات أعلى", "جفاف العينين والفم فقط", "داء رئة خلالي دون إصابة جلدية"], "a": 1, "e": "أضداد Scl-70 تترافق مع إصابة جلدية منتشرة وتزايد نسبة التليف الرئوي ونسبة وفيات أعلى."}, {"c": "الرحلان الكهربائي وسوائل الجسم والأمراض الرثوية", "q": "مريضة بجفاف العينين والفم مع أضداد SS-A/Ro وSS-B/La. ما التشخيص الأرجح؟", "o": ["التهاب المفاصل الرثياني وحده", "متلازمة جوغرن", "التهاب العضلات", "الذئبة المحدثة دوائيا"], "a": 1, "e": "متلازمة جوغرن مرض مناعي ذاتي التهابي مزمن علاماته الواسمة جفاف العينين والفم والأغشية المخاطية الأخرى، وتترافق بقوة بأضداد SS-A/Ro وSS-B/La."}, {"c": "الرحلان الكهربائي وسوائل الجسم والأمراض الرثوية", "q": "أضداد Jo-1 (histidyl tRNA synthetase) توجد لدى حوالي 30% من مرضى التهاب العضلات. بماذا يتميز أغلب هؤلاء المرضى؟", "o": ["داء رئة خلالي", "التهاب كبد مزمن", "جفاف العينين والفم", "تكلس جلدي"], "a": 0, "e": "أضداد Jo-1 تتواجد لدى 30% من مرضى التهاب العضلات، وأغلبيتهم لديهم داء رئة خلالي."}, {"c": "الرحلان الكهربائي وسوائل الجسم والأمراض الرثوية", "q": "في التهاب المفاصل الرثياني، ما حساسية ونوعية أضداد anti-CCP من الجيل الثاني بـ ELISA؟", "o": ["حساسية 66-85% ونوعية 72%", "حساسية 73% ونوعية 95-98%", "حساسية 60% ونوعية 95%", "حساسية 50% ونوعية 90%"], "a": 1, "e": "حسب الجدول، anti-CCP الجيل الثاني بـ ELISA حساسيته 73% ونوعيته 95-98%، ويمكن كشفه لدى 50% من مرضى RA الباكر عندما يكون RF سلبيا."}, {"c": "الرحلان الكهربائي وسوائل الجسم والأمراض الرثوية", "q": "ما العلامة المصلية المميزة لداء النسيج الضام المختلط (MCTD)؟", "o": ["عيار مرتفع لأضداد U1nRNP لدى جميع المرضى", "أضداد Scl-70 وحدها", "أضداد Jo-1 وحدها", "غياب الأضداد الذاتية تماما"], "a": 0, "e": "مرضى MCTD لديهم خليط من مظاهر SLE وتصلب الجلد الجهازي والتهاب العضلات، ووجد عيار مرتفع للأضداد الذاتية لـ ribonucleoprotein النووي (U1nRNP) لدى جميع المرضى."}, {"c": "غازات الدم وتوازن الحمض-أساس", "q": "ما معادلة فجوة الصواعد (Anion Gap) الأكثر شيوعا، وما مجالها المرجعي وفق المصدر؟", "o": ["(Na+ + K+) - (Cl- + HCO3-)، والمجال المرجعي 10-20 ممول/ل", "(Na+ - K+) + (Cl- - HCO3-)، والمجال المرجعي 10-20 ممول/ل", "(Na+ + Cl-) - (K+ + HCO3-)، والمجال المرجعي 22-26 ممول/ل", "(Na+ + HCO3-) - (Cl- + K+)، والمجال المرجعي 35-45 ممول/ل"], "a": 0, "e": "المعادلة الأشيع هي (Na+ + K+) - (Cl- + HCO3-)، وقيمها المرجعية 10-20 ممول/ل، وهي الفرق التقريبي بين الصواعد غير المقاسة والهوابط غير المقاسة."}, {"c": "غازات الدم وتوازن الحمض-أساس", "q": "أي مما يلي من أسباب ارتفاع فجوة الصواعد؟", "o": ["الحماض اللبني (Lactic acidosis)", "نقص ألبومين الدم (Hypoalbuminemia)", "فرط كالسيوم الدم الشديد وحده", "نقص الصواعد غير المقاسة"], "a": 0, "e": "من أسباب ارتفاع فجوة الصواعد: اليوريميا مع احتباس الفوسفات والكبريتات، والحماض الكيتوني، والحماض اللبني، والتسمم بالميثانول أو الإيثيلين غليكول أو الساليسيلات؛ أما نقص الألبومين فيسبب انخفاضها."}, {"c": "غازات الدم وتوازن الحمض-أساس", "q": "أي مما يلي قد يسبب انخفاض فجوة الصواعد؟", "o": ["الحماض الكيتوني السكري", "احتباس الفوسفات في اليوريميا", "نقص ألبومين الدم (نقص الصواعد غير المقاسة)", "التسمم بالميثانول"], "a": 2, "e": "انخفاض فجوة الصواعد نادر، لكنه قد يشاهد مع نقص ألبومين الدم (نقص في الصواعد غير المقاسة) أو فرط كالسيوم الدم الشديد (زيادة الهوابط غير المقاسة)."}, {"c": "غازات الدم وتوازن الحمض-أساس", "q": "أي حمض يعد حمضا قويا وفق قيمة pK؟", "o": ["حمض قيمة pK له أكبر من 9", "حمض قيمة pK له أقل من 3", "حمض قيمة pK له تساوي 6.1", "حمض لا يمنح شاردة الهيدروجين H+"], "a": 1, "e": "الحمض هو مادة تمنح شاردة الهيدروجين H+ عند انحلالها في الماء، والحمض القوي يمتلك قيمة pK أقل من 3، بينما الأساس القوي قيمة pK أكبر من 9."}, {"c": "غازات الدم وتوازن الحمض-أساس", "q": "ما قيمة pK لجملة البيكربونات في البلازما، وما معادلتها الوقائية؟", "o": ["pK تساوي 6.1، والمعادلة H2CO3 ⇌ HCO3- + H+", "pK تساوي 7.40، والمعادلة H2CO3 ⇌ HCO3- + H+", "pK تساوي 3، والمعادلة HCO3- ⇌ CO2 + H2O", "pK تساوي 9، والمعادلة H2CO3 ⇌ CO2 + OH-"], "a": 0, "e": "في البلازما تملك جملة البيكربونات قيمة pK تبلغ 6.1، وهي من الوقاءات الأساسية في الدم، ومعادلتها H2CO3 ⇌ HCO3- + H+."}, {"c": "غازات الدم وتوازن الحمض-أساس", "q": "ما القيمة المرجعية لباهاء الدم الشرياني، وما تركيز شوارد الهيدروجين المقابل لها؟", "o": ["7.40، ويعادل 40 نانومول/ل", "7.35، ويعادل 44 نانومول/ل", "7.45، ويعادل 36 نانومول/ل", "7.00، ويعادل 100 نانومول/ل"], "a": 0, "e": "القيمة المرجعية لباهاء الدم الشرياني هي 7.40، وهي تعادل تركيز شوارد الهيدروجين 40 نانومول/ل، ضمن المجال 36-44 نانومول/ل."}, {"c": "غازات الدم وتوازن الحمض-أساس", "q": "ما المقصود بانزياح شوارد الكلور (Chloride shift) في الكريات الحمر؟", "o": ["دخول شوارد الكلور إلى داخل الخلية للمحافظة على الاعتدال الكهربائي بعد انتشار البيكربونات إلى البلازما", "خروج شوارد الكلور من الكرية الحمراء عند تكوّن حمض الكربون", "ارتباط الكلور بالخضاب بدلا من الأوكسجين", "طرح الكلور عبر الكلية لمعاوضة الحماض"], "a": 0, "e": "بسبب تشرد حمض الكربون تزداد البيكربونات في الكريات الحمر وتنتشر إلى البلازما، فتدخل شوارد الكلور إلى داخل الخلية للمحافظة على الاعتدال الكهربائي، وهذا هو انزياح الكلور، وتنعكس العملية في الرئتين."}, {"c": "غازات الدم وتوازن الحمض-أساس", "q": "ما تعريف الحماض البدئي غير التنفسي (الاستقلابي)، وكيف يعاوضه الجسم تنفسيا؟", "o": ["نقص البيكربونات إلى أقل من 24 ممول/ل، ويعاوض بفرط التهوية لطرح CO2", "زيادة البيكربونات، ويعاوض بتثبيط مركز التنفس", "نقص التهوية السنخية، ويعاوض باحتباس البيكربونات كلويا فقط", "زيادة pCO2، ويعاوض بطرح البيكربونات في البول"], "a": 0, "e": "ينتج الحماض البدئي غير التنفسي عن نقص البيكربونات (أقل من 24 ممول/ل)، ويعاوض الجسم بفرط التهوية حيث يزداد معدل وعمق التنفس لطرح CO2، ثم تحدث المعاوضة الكلوية باحتباس البيكربونات."}, {"c": "غازات الدم وتوازن الحمض-أساس", "q": "أي مما يلي من أسباب الحماض التنفسي، وكيف تعاوضه الكلية؟", "o": ["الداء الرئوي الانسدادي المزمن (COPD)، وتزيد الكلية إطراح H+ وتراكم HCO3-", "فرط التهوية، وتطرح الكلية البيكربونات في البول", "الإقياء الشديد، وتثبط الكلية إطراح H+", "تناول الساليسيلات، وتزيد الكلية إطراح CO2"], "a": 0, "e": "ينتج الحماض التنفسي عن نقص التهوية السنخية ونقص إطراح CO2، ويحدث عند مرضى COPD وذات الرئة ونقص التهوية بالأدوية مثل الباربيتورات والمورفين، وتعاوض الكلية بزيادة إطراح H+ وتراكم HCO3-."}, {"c": "غازات الدم وتوازن الحمض-أساس", "q": "أي مما يلي من أسباب القلاء البدئي غير التنفسي؟", "o": ["الإسهال وضياع البيكربونا function lt(t){
  const w = t.replace(/[A-Za-z0-9][A-Za-z0-9 .,\-–—+%×\/()°]*/g, m => '' + m + '');
  const e = w.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
  return e.replace(//g,'<span dir="ltr">').replace(//g,'</span>');
}

  $('start').classList.remove('hidden');
  window.scrollTo(0, 0);
};
buildStart();
</script>
