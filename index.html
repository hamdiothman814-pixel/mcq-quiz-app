DIT لتشكيل T3.", "o": ["T4 من اقتران جزيئي DIT، وT3 من اقتران MIT مع DIT", "T4 من اقتران MIT مع DIT، وT3 من اقتران جزيئي DIT", "T4 وT3 كلاهما من اقتران جزيئي MIT", "T4 من MIT واحد فقط وT3 من DIT واحد فقط"], "q": "كيف يتشكل الثيروكسين T4 وثلاثي يود الثيرونين T3 من جزيئات اليودتيروزين؟"}, {"a": 0, "c": "الوظيفة الاقتدية والدرقية والعظام", "e": "فقط 0.04% من T4 و0.4% من T3 لا ترتبط مع البروتينات وتبقى متاحة للانتشار، والبروتينات الرابطة الرئيسية هي TBG ثم TBPA ثم الألبومين.", "o": ["0.04% من T4 و0.4% من T3", "4% من T4 و40% من T3", "0.4% من T4 و0.04% من T3", "99.9% من T4 وT3"], "q": "ما نسبة هرمون الدرق الحر غير المرتبط بالبروتينات في الدوران؟"}, {"a": 0, "c": "الوظيفة الاقتدية والدرقية والعظام", "e": "T3 الفعال استقلابياً أكثر من T4 بـ 3 - 8 مرات، وغالباً ما يعتبر هو الشكل الفعال لهرمون الدرق بينما T4 هو ما قبل الهرمون.", "o": ["3 - 8 مرات", "مرة واحدة فقط بالتساوي", "20 - 30 مرة", "نصف فعالية T4"], "q": "كم مرة يكون T3 الفعال استقلابياً أكثر فعالية من T4؟"}, {"a": 0, "c": "الوظيفة الاقتدية والدرقية والعظام", "e": "في قصور الدرق تحت السريري يرتفع TSH بشكل بسيط بينما يبقى T4 الحر ضمن مجاله الطبيعي، أما ارتفاع TSH مع انخفاض T4 الحر فهو قصور درق أولي صريح.", "o": ["ارتفاع TSH بشكل بسيط مع بقاء T4 الحر ضمن مجاله الطبيعي", "انخفاض TSH مع بقاء T4 الحر طبيعياً", "ارتفاع TSH مع انخفاض T4 الحر", "TSH طبيعي مع ارتفاع T4 الحر"], "q": "ما النمط المخبري لقصور الدرق تحت السريري (Subclinical Hypothyroidism)؟"}, {"a": 0, "c": "الوظيفة الاقتدية والدرقية والعظام", "e": "التهاب الدرق اللمفاوي المزمن (هاشيموتو) هو السبب الأشيع لقصور الدرق في العالم المتطور، واختبار أضداد TPO إيجابي عند 80 - 99% من المرضى.", "o": ["التهاب الدرق اللمفاوي المزمن (داء هاشيموتو)، وأضداد TPO إيجابية عند 80 - 99% من المرضى", "داء غريفز، وأضداد TPO إيجابية عند 10 - 15% فقط", "عوز اليود، وأضداد TPO إيجابية عند 100%", "التهاب الدرق تحت الحاد، وأضداد TPO إيجابية عند 1 - 2%"], "q": "ما أشيع سبب لقصور الدرق في العالم المتطور، وما نسبة إيجابية أضداد بيروكسيداز الدرق (TPO) فيه؟"}, {"a": 0, "c": "الوظيفة الاقتدية والدرقية والعظام", "e": "داء غريفز مرض مناعي ذاتي تُفعّل فيه الأضداد مستقبل TSH، ومخبرياً يرتفع T4 الحر و/أو T3 مع TSH غير مقاس، وتكون TSI وأضداد مستقبل TSH إيجابية عادة، وقيمة RAIU مرتفعة مع قبط منتشر.", "o": ["ارتفاع T4 الحر و/أو T3 مع TSH غير مقاس، وأضداد TSI وأضداد مستقبل TSH إيجابية، وRAIU مرتفع مع قبط منتشر", "انخفاض T4 الحر مع ارتفاع TSH، وRAIU منخفض", "T4 حر طبيعي مع TSH طبيعي وRAIU منخفض وغياب الأضداد", "ارتفاع T4 الحر مع ارتفاع TSH وRAIU منخفض"], "q": "ما النمط المخبري المميز لداء غريفز (Graves' Disease)؟"}, {"a": 0, "c": "الوظيفة الاقتدية والدرقية والعظام", "e": "الأميودارون يشكل اليود 37% من وزنه الجزيئي، واليود بجرعات عالية يثبط إنتاج هرمون الدرق (تأثير وولف-شايكوف)، كما يحصر الأميودارون انقلاب T4 إلى T3، فيقود لقصور الدرق عند حوالي 14% وفرط نشاط الدرق عند 3% من المعالجين بشكل مزمن.", "o": ["يشكل اليود 37% من وزنه الجزيئي، ويسبب تأثير وولف-شايكوف (Wolff-Chaikoff) وحصر انقلاب T4 إلى T3، فيقود لقصور درق عند حوالي 14% وفرط نشاط درق عند 3%", "لا يحوي اليود، ويحرض اصطناع هرمون الدرق، فيقود لقصور درق عند 50%", "يحصر مستقبل TSH مباشرة، فيقود لفرط نشاط درق عند 14% وقصور درق عند 3%", "يزيد قبط اليود المشع فقط دون أي تأثير على الهرمونات"], "q": "ما آلية تأثير الأميودارون على وظيفة الدرق، وما نسبتا قصور الدرق وفرط نشاط الدرق عند المعالجين به بشكل مزمن؟"}, {"a": 0, "c": "الوظيفة الاقتدية والدرقية والعظام", "e": "التهاب الدرق بعد الولادة هو أشيع أشكال التهاب الدرق تحت الحاد، يحدث عند حوالي 10% من النساء بعد الولادة، وقد يعاني المريض من مرحلة انسمام درقي يتلوها قصور درق، وعادة تعود مستويات هرمون الدرق إلى الطبيعي بعد عدة أشهر.", "o": ["عند حوالي 10% من النساء بعد الولادة، وطور انسمام درقي يتلوه قصور درقي ثم عودة للوظيفة الطبيعية", "عند حوالي 50% من النساء، وقصور درقي دائم فقط دون طور انسمام", "عند حوالي 1% من النساء، وفرط نشاط درقي دائم فقط", "عند حوالي 25% من النساء، ولا يترافق بأي تغير في هرمون الدرق"], "q": "ما تواتر التهاب الدرق بعد الولادة (Postpartum Thyroiditis)، وما أطواره النموذجية؟"}, {"a": 0, "c": "الوظيفة الاقتدية والدرقية والعظام", "e": "العمر النصفي لليفوثيروكسين 7 أيام، وعند تغيير جرعات هرمون الدرق يجب انتظار على الأقل خمسة أضعاف العمر النصفي قبل إعادة اختبارات فحص وظيفة الدرقية للوصول إلى حالة ثبات جديدة.", "o": ["7 أيام، ويجب انتظار على الأقل خمسة أضعاف العمر النصفي", "ساعتان، ويجب انتظار يوم واحد", "24 ساعة، ويجب انتظار أسبوع واحد فقط", "30 يوماً، ويجب انتظار ثلاثة أشهر"], "q": "ما العمر النصفي لليفوثيروكسين (T4)، وكم يجب الانتظار بعد تغيير الجرعة قبل إعادة اختبارات وظيفة الدرق؟"}, {"a": 0, "c": "الوظيفة الاقتدية والدرقية والعظام", "e": "في الكلى يزيد PTH إعادة امتصاص الكالسيوم من الأنبوب البعيد، وينقص إعادة امتصاص الفوسفات من الأنبوب القريب، وينشط مضخة Na+-H+، ويفعّل 25-hydroxy vitamin D-1α-hydroxylase فيزيد إنتاج 1,25(OH)2D.", "o": ["يزيد إعادة امتصاص الكالسيوم من الأنبوب البعيد، وينقص إعادة امتصاص الفوسفات من الأنبوب القريب، ويفعّل 25-hydroxy vitamin D-1α-hydroxylase", "ينقص إعادة امتصاص الكالسيوم ويزيد إعادة امتصاص الفوسفات ويثبط 1α-hydroxylase", "يزيد إعادة امتصاص الكالسيوم والفوسفات معاً ولا يؤثر على فيتامين D", "يؤثر على العظم فقط دون أي تأثير كلوي"], "q": "ما تأثيرات هرمون جارات الدرق (PTH) على الكلية؟"}, {"a": 0, "c": "الوظيفة الاقتدية والدرقية والعظام", "e": "25(OH)D هو الشكل الرئيسي الجوال في الدوران ويعكس الوضع الغذائي لفيتامين D، ونصف عمره الحيوي 2 - 3 أسابيع بينما نصف عمر 1,25(OH)2D حوالي 4 - 6 ساعات.", "o": ["25(OH)D، ونصف عمره 2 - 3 أسابيع مقابل 4 - 6 ساعات لـ 1,25(OH)2D", "1,25(OH)2D، ونصف عمره 2 - 3 أسابيع مقابل 4 - 6 ساعات لـ 25(OH)D", "فيتامين D نفسه، ونصف عمره 4 - 6 ساعات", "25(OH)D، ونصف عمره 4 - 6 ساعات فقط"], "q": "أي شكل من فيتامين D يعكس الوضع الغذائي لفيتامين D على أفضل وجه، وما نصف عمره الحيوي مقارنة بالشكل الفعال؟"}, {"a": 0, "c": "الوظيفة الاقتدية والدرقية والعظام", "e": "يفرز الكالسيتونين من الخلايا جانب الجريبية (parafollicular) أو الخلايا C، وهو عديد ببتيد من 32 حمضاً أمينياً، وتشكل MTC حوالي 5% من الخباثات الدرقية.", "o": ["من الخلايا جانب الجريبية (C)، وهو عديد ببتيد من 32 حمضاً أمينياً، وMTC تشكل حوالي 5% من الخباثات الدرقية", "من الخلايا الجريبية الدرقية، وهو من 10 أحماض أمينية، وMTC تشكل 50% من الخباثات الدرقية", "من الغدد جارات الدرق، وهو من 84 حمضاً أمينياً، وMTC تشكل 25%", "من الخلايا الولوعة بالأساس، وهو من 32 حمضاً أمينياً، وMTC تشكل 90%"], "q": "من أي خلايا يفرز الكالسيتونين، وكم عدد أحماضه الأمينية، وما نسبة الكارسينوما اللبية للدرق (MTC) من الخباثات الدرقية؟"}, {"a": 0, "c": "الوظيفة الاقتدية والدرقية والعظام", "e": "تعيين PTH يساعد في تقييم اكتمال جراحة جارات الدرق، إذ إن هبوط مستويات PTH بنسبة 50% أو أكثر عن مستوياته قبل الجراحة يعد مؤشراً لنجاح الاستئصال الجراحي.", "o": ["هبوط مستويات PTH بنسبة 50% أو أكثر عن مستوياته قبل الجراحة", "ارتفاع مستويات PTH بنسبة 50% بعد الجراحة", "بقاء PTH دون تغير مع ارتفاع الكالسيوم", "انخفاض الكالسيوم فقط دون تغير PTH"], "q": "ما المؤشر المخبري لنجاح استئصال الورم الغدي في فرط نشاط جارات الدرق البدئي؟"}, {"a": 0, "c": "الوظيفة الاقتدية والدرقية والعظام", "e": "هشاشة العظام أكثر أمراض العظام الاستقلابية شيوعاً في البلدان المتطورة، تتسبب بحوالي 1.5 مليون كسر سنوياً، ومعدل الكسور عند النساء أكثر بثلاثة أضعاف، وثلث النساء فوق 65 سنة تعاني من كسور فقرية.", "o": ["أكثر أمراض العظام الاستقلابية شيوعاً في البلدان المتطورة، تتسبب بحوالي 1.5 مليون كسر سنوياً، ومعدل الكسور عند النساء أكثر بثلاثة أضعاف منه عند الرجال", "مرض نادر يصيب الرجال فقط ولا يسبب كسوراً", "ينتج عن خلل تمعدن فقط ويصيب الأطفال حصراً", "يتصف بزيادة الكتلة العظمية وانعدام الكسور"], "q": "ما صفات هشاشة العظام (Osteoporosis) حسب الملف المصدر؟"}, {"a": 0, "c": "الوظيفة الاقتدية والدرقية والعظام", "e": "أكثر الموجودات التي تساعد في تشخيص باجيت هي ارتفاع ALP المصلي حتى عشرة أضعاف، ويعد المسح العظمي من أكثر الاختبارات حساسية لتحديد الآفات الصغيرة والباكرة.", "o": ["ارتفاع ALP المصلي حتى عشرة أضعاف، والمسح العظمي هو الأكثر حساسية للآفات الصغيرة والباكرة", "انخفاض ALP المصلي، والتصوير الشعاعي البسيط هو الأكثر حساسية", "ارتفاع الكالسيوم فقط، وقياس PTH هو الأكثر حساسية", "ALP طبيعية دائماً، ولا يوجد اختبار حساس للآفات الباكرة"], "q": "ما الموجود المخبري الأكثر مساعدة في تشخيص داء باجيت (Paget Disease)، وما الاختبار الأكثر حساسية لتحديد الآفات الصغيرة والباكرة؟"}, {"a": 0, "c": "الوظيفة الاقتدية والدرقية والعظام", "e": "DPD أكثر مؤشر للارتشاف العظمي حساسية ونوعية من PYD، إذ يتواجد DPD بكميات هامة فقط في العظم بينما PYD أوسع انتشاراً، ولا يتواجد DPD وPYD بكميات هامة في الجلد.", "o": ["لأن DPD يتواجد بكميات هامة فقط في العظم، بينما PYD أوسع انتشاراً", "لأن DPD يتواجد في الجلد بكميات كبيرة بينما PYD لا يتواجد إلا في العظم", "لأن DPD يمتص من الغذاء بينما PYD لا يمتص", "لأن DPD يستقلب حيوياً قبل إفراغه في البول بينما PYD لا يستقلب"], "q": "لماذا يعد الديوكسي بيريدينولين (DPD) مؤشراً للارتشاف العظمي أكثر حساسية ونوعية من البيريدينولين (PYD)؟"}, {"a": 0, "c": "وظائف الكبد والتهاب الكبد الفيروسي", "e": "حسب المصدر، NTX و CTX هما أشيع واسمات الارتشاف العظمي وتقاس بالتحاليل المناعية في المصل والبول، بينما يقاس DPD بتقنية HPLC أو بالتحليل المناعي.", "o": ["NTX و CTX", "DPD و الهيدروكسي برولين", "TRAP و الأوستيوكالسين", "PINP و PICP"], "q": "أي واسمين هما الأشيع استخداما في تقدير الارتشاف العظمي، ويقاسان بالتحاليل المناعية في المصل والبول؟"}, {"a": 1, "c": "وظائف الكبد والتهاب الكبد الفيروسي", "e": "عند تثبيط ارتشاف العظم بالإستروجين والبيسفوسفونات ينخفض تركيز كل من التيلوببتيدات و DPD.", "o": ["يرتفع تركيزهما", "ينخفض تركيزهما", "يبقى تركيزهما ثابتا", "يختفي DPD فقط"], "q": "ماذا يحدث لتركيز التيلوببتيدات (Telepeptides) والديوكسي بيريدينولين (DPD) عندما يثبط ارتشاف العظم بفعل الإستروجين أو البيسفوسفونات؟"}, {"a": 0, "c": "وظائف الكبد والتهاب الكبد الفيروسي", "e": "يتميز DPD والتيلوببتيدات بثبات نسبي في البول، لكن التعرض للأشعة فوق البنفسجية (UV) يحطم DPD و PYD، لذا يجب تجنب التعرض المطول لأشعة الشمس.", "o": ["لأن الأشعة فوق البنفسجية تحطم DPD و PYD", "لأن الشمس ترفع تركيز NTX", "لأن الشمس تثبط إفراز TRAP", "لأن الشمس تزيد الهيدروكسي برولين"], "q": "لماذا يجب تجنب التعرض المطول لأشعة الشمس عند جمع عينات البول لقياس واسمات الارتشاف العظمي؟"}, {"a": 0, "c": "وظائف الكبد والتهاب الكبد الفيروسي", "e": "التراكيز الطبيعية للـ ALP العظمية هي 5-20 نغ/مل بتقنية IRMA، ويلاحظ أعلى تركيز عند الأطفال خاصة أثناء النمو السريع.", "o": ["5-20 نغ/مل، وأعلى تركيز عند الأطفال خاصة أثناء النمو السريع", "3-27 نغ/مل، وأعلى تركيز عند المسنين", "0.2-1.0 ملغ/دل، وأعلى تركيز عند النساء بعد انقطاع الطمث", "1-6 ملغ/دل، وأعلى تركيز عند الرضع الخدج"], "q": "ما المجال المرجعي للفوسفاتاز القلوية العظمية (Bone ALP) بتقنية IRMA، ومتى يلاحظ أعلى تركيز لها؟"}, {"a": 0, "c": "وظائف الكبد والتهاب الكبد الفيروسي", "e": "الـ OC هو البروتين اللاكولاجيني الرئيسي في العظم البشري، يشكل حوالي 1% من البروتين الكلي العظمي، وهو بروتين صغير يتكون من 49 حمضا أمينيا.", "o": ["البروتين اللاكولاجيني الرئيسي في العظم، يتكون من 49 حمضا أمينيا ويشكل حوالي 1% من البروتين الكلي العظمي", "أنزيم غشائي يوجد بتراكيز عالية في الكبد والكلية والبنكرياس", "بروتين نقل يرتبط بالبيليروبين غير المقترن في الدم", "ببتيد طليعي للكولاجين ينشق أثناء تشكل الكولاجين"], "q": "ما وصف الأوستيوكالسين (Osteocalcin) حسب المصدر؟"}, {"a": 0, "c": "وظائف الكبد والتهاب الكبد الفيروسي", "e": "الكبد يزن تقريبا 1.0-1.5 كغ عند البالغ السليم، والشريان الكبدي مسؤول عن حوالي 25% من إمداد الدم بينما الوريد البابي مسؤول عن حوالي 75%.", "o": ["1.0-1.5 كغ، والوريد البابي يزوده بحوالي 75% من الدم", "0.5-1.0 كغ، والوريد البابي يزوده بحوالي 25% من الدم", "2.0-2.5 كغ، والوريد البابي يزوده بحوالي 50% من الدم", "1.0-1.5 كغ، والشريان الكبدي يزوده بحوالي 75% من الدم"], "q": "ما وزن الكبد عند الشخص البالغ السليم، وما نسبة إمداده الدموي من الوريد البابي؟"}, {"a": 0, "c": "وظائف الكبد والتهاب الكبد الفيروسي", "e": "يقوم الكبد بأربع وظائف أساسية هي: الإفراز والإطراح، والاصطناع، وإزالة السموم، والتخزين.", "o": ["الإفراز والإطراح، والاصطناع، وإزالة السموم، والتخزين", "الهضم، والامتصاص، والإفراز، والتنفس", "الاصطناع، والتخزين، والتكاثر، والمناعة فقط", "إزالة السموم، وتكوين الدم، والترشيح، والإفراز"], "q": "ما الوظائف الحيوية الأربع الأساسية للكبد حسب المصدر؟"}, {"a": 0, "c": "وظائف الكبد والتهاب الكبد الفيروسي", "e": "ينتج الجسم حوالي 3 لترات من الصفراء يوميا، ويفرز لترا واحدا فقط مع البراز.", "o": ["حوالي 3 لترات يوميا، ويفرز لترا واحدا فقط مع البراز", "حوالي لتر واحد يوميا، ويفرز كله مع البراز", "حوالي 500 مل يوميا، ويفرز نصفها مع البول", "حوالي 5 لترات يوميا، ويفرز لتران مع البراز"], "q": "كم ينتج الجسم من الصفراء يوميا، وكم يفرز منها مع البراز؟"}, {"a": 0, "c": "وظائف الكبد والتهاب الكبد الفيروسي", "e": "تحدث عملية الاقتران بوجود أنزيم uridine diphosphate glucuronyl transferase (UDPGT) لتشكيل غلوكورونيد البيليروبين (البيليروبين المقترن).", "o": ["Uridine diphosphate glucuronyl transferase (UDPGT)", "Glutamate dehydrogenase", "Alcohol dehydrogenase", "5'-nucleotidase"], "q": "ما الأنزيم المسؤول عن اقتران البيليروبين في الخلية الكبدية؟"}, {"a": 0, "c": "وظائف الكبد والتهاب الكبد الفيروسي", "e": "يتكاثف حوالي 80% من اليوروبيلينوجين المتشكل إلى منتج ذي لون بني يعطي البراز لونه، أما 20% المتبقية فيعاد امتصاصها ثم يعاد إفرازها عبر الدوران المعوي الكبدي أو تطرح مع البول.", "o": ["حوالي 80% منه يتكاثف إلى منتج بني يعطي البراز لونه، و20% يعاد امتصاصها أو تطرح مع البول", "يطرح كله مع البول دون إعادة امتصاص", "يتحول كله إلى بيليروبين غير مقترن من جديد", "يمتص كله إلى الدوران البابي ولا يصل إلى البراز"], "q": "ما مصير اليوروبيلينوجين (Urobilinogen) المتشكل في الأمعاء حسب المصدر؟"}, {"a": 0, "c": "وظائف الكبد والتهاب الكبد الفيروسي", "e": "رغم أن الحد الأعلى الطبيعي للبيليروبين الكلي هو 1.0-1.5 ملغ/دل، فإن اليرقان لا يلاحظ بالعين المجردة إلا عندما تصل مستويات البيليروبين إلى 3 ملغ/دل.", "o": ["عندما تصل مستويات البيليروبين إلى 3 ملغ/دل", "عندما تصل إلى 1.0 ملغ/دل مباشرة", "عندما تتجاوز 20 ملغ/دل فقط", "عندما ينخفض البيليروبين المقترن إلى الصفر"], "q": "متى يلاحظ اليرقان بالعين المجردة، رغم أن الحد الأعلى الطبيعي للبيليروبين الكلي هو 1.0-1.5 ملغ/دل؟"}, {"a": 0, "c": "وظائف الكبد والتهاب الكبد الفيروسي", "e": "في اليرقان قبل الكبدي يكون البيليروبين من النمط غير المقترن، فلا ينحل بالماء ولا يرتشح عبر الكلية، وبالتالي لن يشاهد في البول.", "o": ["لأنه لا ينحل بالماء ولا يرتشح عبر الكلية", "لأنه يتحول فورا إلى بيليروبين مقترن في الكلية", "لأن الكبد يفرزه كله مع الصفراء", "لأن البول الحمضي يحطمه فورا"], "q": "لماذا لا يشاهد البيليروبين غير المقترن في البول عند مرضى اليرقان قبل الكبدي؟"}, {"a": 0, "c": "وظائف الكبد والتهاب الكبد الفيروسي", "e": "تتميز متلازمة جيلبرت بفرط بيليروبين الدم غير المقترن مع عدم وجود انحلال دموي أو مرض كبدي كامن، وعادة لا يتجاوز البيليروبين الكلي 5.0 ملغ/دل، وتحدث بنسبة 5% من سكان الولايات المتحدة.", "o": ["فرط بيليروبين دم غير مقترن دون انحلال دموي أو مرض كبدي كامن، والبيليروبين الكلي عادة لا يتجاوز 5.0 ملغ/دل", "فرط بيليروبين مقترن مع حبيبات قاتمة في خزعة الكبد", "غياب كامل لأنزيم ربط البيليروبين مع يرقان شديد مهدد للحياة", "انسداد فيزيائي في المرارة مع براز بلون الطين"], "q": "ما الذي يميز متلازمة جيلبرت (Gilbert) حسب المصدر؟"}, {"a": 0, "c": "وظائف الكبد والتهاب الكبد الفيروسي", "e": "في النوع الأول من متلازمة كريغلر-نجار يكون هناك غياب كامل للأنزيم المسؤول عن ربط البيليروبين، أما النوع الثاني فتحدث فيه طفرة تسبب نقصا حادا بالأنزيم.", "o": ["النوع الأول غياب كامل للأنزيم المسؤول عن ربط البيليروبين، والنوع الثاني نقص حاد بالأنزيم", "النوع الأول نقص حاد بالأنزيم، والنوع الثاني غياب كامل للأنزيم", "النوع الأول يصيب البالغين فقط، والنوع الثاني يصيب حديثي الولادة فقط", "النوع الأول يرفع البيليروبين المقترن، والنوع الثاني يرفع غير المقترن فقط"], "q": "ما الفرق بين نوعي متلازمة كريغلر-نجار (Crigler-Najjar)؟"}, {"a": 0, "c": "وظائف الكبد والتهاب الكبد الفيروسي", "e": "السمة المميزة لدوبين-جونسون هي ظهور حبيبات قاتمة تماما في خزعة الكبد، وعادة يبقى البيليروبين الكلي بين 2-5 ملغ/دل حيث يمثل المقترن 50% من هذه القيمة.", "o": ["حبيبات قاتمة تماما، والبيليروبين الكلي عادة بين 2-5 ملغ/دل ويمثل المقترن 50% منه", "عدم وجود أي حبيبات، والبيليروبين الكلي فوق 30 ملغ/دل", "حبيبات فاتحة، والبيليروبين الكلي عادة أقل من 1 ملغ/دل", "تنخر خلوي واسع، والبيليروبين الكلي بين 10-12 ملغ/دل"], "q": "ما السمة المميزة لمتلازمة دوبين-جونسون (Dubin-Johnson) في خزعة الكبد، وما مجال البيليروبين الكلي فيها؟"}, {"a": 0, "c": "وظائف الكبد والتهاب الكبد الفيروسي", "e": "روتر مشابهة سريريا لدوبين-جونسون، لكن خزعة الكبد لا تظهر حبيبات قاتمة، وهي أقل شيوعا وحميدة نسبيا ولا داعي للعلاج.", "o": ["خزعة الكبد لا تظهر حبيبات قاتمة في روتر، وهي أقل شيوعا وحميدة نسبيا ولا داعي للعلاج", "خزعة الكبد تظهر حبيبات قاتمة أكبر في روتر", "روتر ترفع البيليروبين غير المقترن فقط بينما دوبين-جونسون ترفع المقترن فقط", "روتر مرض انسدادي في المرارة بينما دوبين-جونسون خلل في الاقتران"], "q": "بم تختلف متلازمة روتر (Rotor) عن متلازمة دوبين-جونسون؟"}, {"a": 0, "c": "وظائف الكبد والتهاب الكبد الفيروسي", "e": "يعود اليرقان الفيزيولوجي عند حديثي الولادة إلى نقص أنزيم glucuronyl transferase، وعادة يعالج بالمعالجة الضوئية بالأشعة فوق البنفسجية التي تحول البيليروبين إلى الشكل غير السام القابل للذوبان في الماء.", "o": ["نقص أنزيم glucuronyl transferase، ويعالج عادة بالمعالجة الضوئية بالأشعة فوق البنفسجية", "انسداد القنوات الصفراوية بالحصيات، ويعالج بالجراحة فورا", "زيادة إنتاج البيليروبين المقترن، ويعالج بنقل الدم دائما", "عوز بروتين MDR2/cMOAT، ويعالج بالبيسفوسفونات"], "q": "ما سبب اليرقان الفيزيولوجي عند حديثي الولادة، وما علاجه المعتاد؟"}, {"a": 0, "c": "وظائف الكبد والتهاب الكبد الفيروسي", "e": "في اليرقان بعد الكبدي لا تفرز الصفراء إلى الأمعاء، فيفقد البراز مصدره الطبيعي للونه ويصبح بلون الطين.", "o": ["لأن الصفراء لا تفرز إلى الأمعاء فيفقد البراز مصدره الطبيعي للونه", "لأن البيليروبين غير المقترن يتراكم في الأمعاء", "لأن اليوروبيلينوجين يزداد في البراز", "لأن الكبد يتوقف عن تصنيع البيليروبين"], "q": "لماذا يصبح البراز بلون الطين في اليرقان بعد الكبدي؟"}, {"a": 0, "c": "وظائف الكبد والتهاب الكبد الفيروسي", "e": "يوجد ALT بشكل رئيسي في الكبد وبكميات أقل في العضلات القلبية والهيكلية والكلية، وهو أكثر دلالة انتقائية للكبد من AST.", "o": ["ALT، ويوجد بشكل رئيسي في الكبد وبكميات أقل في العضلات القلبية والهيكلية والكلية", "AST، ويوجد بشكل رئيسي في العظم فقط", "LDH، ويوجد بشكل رئيسي في الكبد فقط", "GGT، ويوجد بشكل رئيسي في العضلات الهيكلية"], "q": "أي ناقل أمين أكثر دلالة انتقائية للكبد، وأين يوجد بشكل رئيسي؟"}, {"a": 0, "c": "وظائف الكبد والتهاب الكبد الفيروسي", "e": "بما أنه لا يوجد 5'NT ذو مصدر عظمي، فعندما ترتفع مستويات كلا الأنزيمين يكون المرض كبديا، بينما في المرض العظمي البدئي ترتفع ALP وتكون مستويات 5'NT عادة طبيعية أو مرتفعة بشكل خفيف.", "o": ["لأنه لا يوجد 5'NT ذو مصدر عظمي، فيرتفع مع ALP في المرض الكبدي بينما يبقى طبيعيا عادة في المرض العظمي البدئي", "لأنه يوجد في العظام فقط ولا يرتفع في المرض الكبدي", "لأنه يرتفع بالحمل والطفولة مثل ALP تماما", "لأنه أنزيم ميكروزومي يرتفع بتعاطي الكحول فقط"], "q": "لماذا يفيد قياس 5'-nucleotidase (5'NT) في تفسير ارتفاع ALP؟"}, {"a": 0, "c": "وظائف الكبد والتهاب الكبد الفيروسي", "e": "بما أن GGT أنزيم ميكروزومي، فإن تعاطي الكحول يسبب ارتفاعه، كما ترفعه أدوية محددة: الباربيتورات والفينيتوئين ومضادات الاكتئاب ثلاثية الحلقات وموانع الحمل.", "o": ["تعاطي الكحول وأدوية مثل الباربيتورات والفينيتوئين ومضادات الاكتئاب ثلاثية الحلقات وموانع الحمل", "نقص فيتامين D فقط", "الحمل فقط", "الكساح فقط"], "q": "ما الذي يرفع GGT إضافة إلى الانسداد المراري، رغم عدم وجوده في العظام؟"}, {"a": 0, "c": "وظائف الكبد والتهاب الكبد الفيروسي", "e": "يعد السبب الأكثر شيوعا لتشمع الكبد في الولايات المتحدة هو الإدمان المزمن على الكحول والتهاب الكبد الفيروسي C المزمن.", "o": ["الإدمان المزمن على الكحول والتهاب الكبد الفيروسي C المزمن", "التهاب الكبد A وحده", "داء ويلسون وحده", "التهاب الكبد E وحده"], "q": "ما السبب الأكثر شيوعا لتشمع الكبد في الولايات المتحدة حسب المصدر؟"}, {"a": 0, "c": "وظائف الكبد والتهاب الكبد الفيروسي", "e": "يعزى HCC في 80% من الحالات في جميع أنحاء العالم إلى التهاب الكبد الفيروسي B و C، وهو الورم الكبدي الخبيث الأكثر شيوعا.", "o": ["80% من الحالات", "20% من الحالات", "5% من الحالات", "100% من الحالات"], "q": "ما نسبة حالات سرطان الخلايا الكبدية (HCC) التي تعزى إلى التهاب الكبد الفيروسي B و C في جميع أنحاء العالم؟"}, {"a": 0, "c": "وظائف الكبد والتهاب الكبد الفيروسي", "e": "يسبب التهاب الكبد A فيروسات RNA عديمة الغلاف من عائلة Picornavirus، والأعراض محدودة ذاتيا وتشفى الإصابة خلال 3 أسابيع، والإصابة المزمنة بـ HAV غير موجودة.", "o": ["فيروس RNA عديم الغلاف من عائلة Picornavirus، والإصابة محدودة ذاتيا وتشفى خلال 3 أسابيع ولا توجد إصابة مزمنة", "فيروس DNA من عائلة Hepadnaviridae، ويتطور عادة إلى إصابة مزمنة", "فيروس RNA ناقص يحتاج HBsAg للتضاعف", "فيروس RNA مغلف ينتقل أساسا عبر نقل الدم"], "q": "ما فيروس التهاب الكبد A، وما أهم ما يميز مساره السريري؟"}, {"a": 0, "c": "وظائف الكبد والتهاب الكبد الفيروسي", "e": "تستخدم أضداد IgM كدلالة بدنية للإصابة الحادة وتنخفض خلال 3-6 أشهر، بينما تظهر IgG بعدها مباشرة وتستمر لسنوات وتعطي مناعة طيلة الحياة، ووجود IgG مرتفع مع غياب IgM يشير إلى إصابة قديمة.", "o": ["IgM دلالة بدنية للإصابة الحادة، ووجود IgG مرتفع مع غياب IgM يشير إلى إصابة قديمة ومناعة طيلة الحياة", "IgM يدل على المناعة بعد اللقاح، و IgG يدل على الإصابة الحادة", "كلاهما يدل على إصابة مزمنة بـ HAV", "IgG يختفي خلال 3-6 أشهر بينما IgM يستمر لسنوات"], "q": "ما دلالة أضداد IgM anti-HAV وأضداد IgG anti-HAV؟"}, {"a": 0, "c": "وظائف الكبد والتهاب الكبد الفيروسي", "e": "المستضد السطحي هو الدلالة المصلية الوحيدة التي تكشف خلال أول 3-5 أسابيع بعد الإصابة، والزمن الوسطي بين التعرض وتمييزه 30 يوما، واختبارات الحمض النووي تستطيع كشف HBV DNA قبل HBsAg بـ 10-20 يوما.", "o": ["HBsAg هو الدلالة المصلية الوحيدة التي تكشف خلال أول 3-5 أسابيع بعد الإصابة، واختبارات الحمض النووي تكشف HBV DNA قبله بـ 10-20 يوما", "HBsAg يظهر بعد 6 أشهر فقط، و HBV DNA يكشف بعده بشهر", "HBsAg يظهر فقط بعد الشفاء، ولا يكشف HBV DNA أبدا قبله", "HBsAg يكشف خلال أول 3-5 أيام، و HBV DNA يكشف بعده بـ 10-20 يوما"], "q": "ما المستضد السطحي HBsAg من حيث توقيت ظهوره، ومتى يمكن كشف HBV DNA قبله؟"}, {"a": 0, "c": "وظائف الكبد والتهاب الكبد الفيروسي", "e": "الأشخاص الذين شفوا طبيعيا تعطي مصولهم إيجابية لـ anti-HBs و anti-HBc، بينما من تجاوزوا لقاح التهاب الكبد B يطورون anti-HBs فقط.", "o": ["الشفاء الطبيعي: anti-HBs و anti-HBc إيجابيان، بينما اللقاح يعطي anti-HBs فقط", "الشفاء الطبيعي: anti-HBs فقط، بينما اللقاح يعطي anti-HBs و anti-HBc", "كلاهما يعطي HBsAg إيجابيا مستمرا", "لا فرق مصليا بينهما إطلاقا"], "q": "كيف نفرق مصليا بين الشفاء الطبيعي من HBV والمناعة بعد اللقاح؟"}, {"a": 0, "c": "وظائف الكبد والتهاب الكبد الفيروسي", "e": "حسب الجدول 24-4، الإصابة المزمنة: HBsAg موجب، مجموع anti-HBc موجب، IgM anti-HBc سالب، anti-HBs سالب، لأن المصابين المزمنين لا يطورون أضدادا للمستضد السطحي نتيجة استمرار وجوده.", "o": ["HBsAg إيجابي، مجموع anti-HBc إيجابي، IgM anti-HBc سلبي، anti-HBs سلبي", "HBsAg سلبي، anti-HBc سلبي، anti-HBs إيجابي", "HBsAg إيجابي، IgM anti-HBc إيجابي، anti-HBs إيجابي", "جميع الواسمات سلبية"], "q": "ما النمط المصلي للإصابة المزمنة بـ HBV حسب الجدول 24-4؟"}, {"a": 0, "c": "وظائف الكبد والتهاب الكبد الفيروسي", "e": "حوالي 90% من حالات الإصابة بـ HBV تشفى خلال 6 أشهر، وحوالي 10% تتطور إلى التهاب كبد مزمن، وتكون الاحتمالية أكثر لدى المصابين في فترة ما حول الولادة بنسبة 90% وخلال الطفولة 20-30%، بينما لدى البالغين أقل من 10%.", "o": ["حوالي 10% عموما، وحوالي 90% عند المصابين في فترة ما حول الولادة", "حوالي 90% عموما، وحوالي 10% عند المصابين حول الولادة", "حوالي 50% في كلتا الحالتين", "حوالي 20-30% عموما، وأقل من 10% حول الولادة"], "q": "ما نسبة تطور الإصابة بـ HBV إلى التهاب كبد مزمن عموما، وكم تبلغ عند المصابين في فترة ما حول الولادة؟"}, {"a": 0, "c": "وظائف الكبد والتهاب الكبد الفيروسي", "e": "يقسم المسار الطبيعي لالتهاب الكبد B المزمن إلى أربعة أطوار: التحمل المناعي، التصفية المناعية (التهاب الكبد المزمن الإيجابي HBeAg)، تضاعف فيروسي قليل أو انعدامه (حامل HBsAg غير فعال)، التفعيل (التهاب الكبد المزمن السلبي HBeAg).", "o": ["التحمل المناعي، التصفية المناعية (HBeAg إيجابي)، الحامل غير الفعال، التفعيل (HBeAg سلبي)", "اليرقان، التشمش، السرطان، الشفاء", "الحاد، تحت الحاد، المزمن، الصاعق", "التحمل المناعي، التفعيل، التصفية، الشفاء التام"], "q": "ما الأطوار الأربعة للمسار الطبيعي لالتهاب الكبد B المزمن؟"}, {"a": 0, "c": "وظائف الكبد والتهاب الكبد الفيروسي", "e": "المستضد المستعمل في لقاح التهاب الكبد B هو HBsAg، ويوفر الغلوبولين المناعي HBIG مناعة مكتسبة سلبية وحماية مؤقتة لمدة 3-6 أشهر عندما يعطى بالجرعات النظامية.", "o": ["المستضد HBsAg، و HBIG يوفر حماية مؤقتة لمدة 3-6 أشهر", "المستضد HBcAg، و HBIG يوفر حماية دائمة طيلة الحياة", "المستضد HBeAg، و HBIG يوفر حماية لمدة 18 يوما فقط", "المستضد HDAg، و HBIG لا يوفر أي حماية"], "q": "ما المستضد المستخدم في لقاح التهاب الكبد B، وما مدة الحماية المؤقتة التي يوفرها الغلوبولين المناعي HBIG؟"}, {"a": 0, "c": "وظائف الكبد والتهاب الكبد الفيروسي", "e": "إيجابية اختبار الأضداد تشير إلى أن المريض تعرض لـ HCV لكنها غير قادرة على تحديد الإصابة الحديثة مقابل التعافي، ولا تحمي الأضداد من عودة الإصابة، والخطوة التالية بعد EIA إيجابي هي كشف HCV RNA بالـ PCR.", "o": ["لأن إيجابية الأضداد تشير فقط إلى التعرض للفيروس، ولا تحمي من عودة الإصابة، ويحتاج التأكيد إلى كشف HCV RNA بالـ PCR", "لأن الأضداد لا تظهر أبدا في مصل المرضى", "لأن الأضداد تختفي خلال أيام من الإصابة", "لأن اختبار EIA يكشف RNA الفيروس مباشرة"], "q": "لماذا لا تستطيع أضداد HCV وحدها تحديد ما إذا كان المريض مصابا حديثا أم تعافى من الإنتان؟"}, {"a": 0, "c": "وظائف الكبد والتهاب الكبد الفيروسي", "e": "حوالي 80% من المرضى المصابين يتطور لديهم التهاب الكبد C إلى مزمن، ويعالج عادة بـ pegylated interferon والريبافيرين، وتراقب فعالية المعالجة باستخدام PCR لتحديد عدد النسخ الفيروسية.", "o": ["حوالي 80% يتطور لديهم إلى مزمن، ويعالج عادة بالإنترفيرون المرتبط بالبولي إيثيلين غليكول (pegylated interferon) والريبافيرين مع مراقبة فعالية المعالجة بالـ PCR", "جميع المرضى يشفون عفويا خلال 3 أسابيع، ولا يوجد علاج", "حوالي 10% يتطور إلى مزمن، ويعالج باللقاح فقط", "حوالي 80% يصابون بفشل كبدي صاعق فورا، ويعالج بزرع الكبد دائما"], "q": "ما مصير معظم مرضى التهاب الكبد C، وما علاجه المعتاد حسب المصدر؟"}, {"a": 0, "c": "وظائف الكبد والتهاب الكبد الفيروسي", "e": "HDV فيروس صغير يحتوي RNA ناقصا بحيث لا يستطيع التضاعف بشكل مستقل وإنما يحتاج إلى HBsAg، ولذلك فهو عاجز عن إحداث أي مرض لدى المرضى غير المصابين بـ HBV.", "o": ["لأنه فيروس RNA ناقص يحتاج إلى المستضد السطحي HBsAg للتضاعف، فلا يحدث مرضا لدى غير المصابين بـ HBV", "لأنه فيروس DNA يحتاج إلى نواة الخلية الكبدية فقط", "لأنه يحتاج إلى فيروس HCV ليتضاعف", "لأنه لا يملك غلافا خارجيا إطلاقا"], "q": "لماذا لا يستطيع فيروس التهاب الكبد D التضاعف بشكل مستقل؟"}, {"a": 0, "c": "وظائف الكبد والتهاب الكبد الفيروسي", "e": "الإصابة المرافقة تحدث مع إصابة HBV حادة وتنتهي عادة بالشفاء مع التصفية المصلية، بينما الإصابة المضاعفة تحدث عند مريض لديه إصابة HBV مزمنة مستقرة وغالبا تكون الإصابة مستمرة.", "o": ["المرافقة تحدث مع إصابة HBV حادة وغالبا تنتهي بالشفاء مع التصفية المصلية، والمضاعفة تحدث عند مريض لديه إصابة HBV مزمنة وغالبا تستمر الإصابة", "المرافقة تحدث عند حاملي HBV المزمن فقط، والمضاعفة تحدث مع HBV الحاد فقط", "لا فرق بينهما في النتائج أو الواسمات", "المرافقة دائما مزمنة، والمضاعفة دائما تشفى"], "q": "ما الفرق بين الإصابة المرافقة (coinfection) والإصابة المضاعفة (superinfection) بفيروس HDV؟"}, {"a": 1, "c": "واسمات القلب والوظيفة الكلوية والبنكرياسية", "e": "حسب المصدر، المرضى الذين لديهم تركيز BNP تحت 20 بيكوغرام/مل غير مرجح أن يصابوا بقصور القلب الاحتقاني، بينما من نتائجهم أعلى من هذا التركيز لديهم احتمالية عالية للإصابة به.", "o": ["يؤكد تشخيص قصور القلب الاحتقاني", "يجعل إصابته بقصور القلب الاحتقاني غير مرجحة", "يشير إلى وجود قصور كلوي حاد", "يدل على تشمع الكبد"], "q": "عند مريض يشتبه بقصور القلب الاحتقاني (CHF)، ماذا يعني تركيز BNP أقل من 20 بيكوغرام/مل؟"}, {"a": 1, "c": "واسمات القلب والوظيفة الكلوية والبنكرياسية", "e": "عمر النصف الدوراني لـ BNP نحو 20 دقيقة، فهو مؤشر للتغيرات السريعة في وظيفة القلب، بينما يجول NT-proBNP في الدوران فترة أطول، مما يسمح بإظهار أطول لوظيفة خلايا القلب.", "o": ["BNP، لأن عمر نصفه الدوراني نحو 20 دقيقة", "NT-proBNP، لأنه يجول في الدوران فترة أطول من BNP", "ANP، لأنه يتحرر من الأذين فقط", "CNP، لأنه الأكثر استقرارا في الدوران"], "q": "أي الببتيدين المدرين للصوديوم يجول في الدوران فترة أطول، مما يسمح بإظهار أطول لوظيفة خلايا القلب؟"}, {"a": 0, "c": "واسمات القلب والوظيفة الكلوية والبنكرياسية", "e": "حسب المصدر، تصبح قيمة GGT ضعف الحد الأعلى من المجال الطبيعي عند مرضى قصور القلب الاحتقاني، مما يقترح احتقان الكبد وتلفه.", "o": ["احتقان الكبد وتلفه", "قصورا كلويا حادا", "احتقان الرئة فقط", "التهابا بنكرياسيا حادا"], "q": "عند مريض بقصور القلب الاحتقاني (CHF)، ماذا تقترح قيمة GGT التي تبلغ ضعف الحد الأعلى من المجال الطبيعي؟"}, {"a": 0, "c": "واسمات القلب والوظيفة الكلوية والبنكرياسية", "e": "حسب المصدر، يشار إلى تحديد قيمة الليبوبروتين a المشابه لـ LDL، حيث إنه عامل خطورة مستقل يترافق مع تطور الأمراض الوعائية وأمراض الشريان الإكليلي قبل الاكتمال.", "o": ["أنه عامل خطورة مستقل يترافق مع تطور الأمراض الوعائية وأمراض الشريان الإكليلي قبل الاكتمال", "أنه يقي من تطور الأمراض الوعائية", "أنه مرتبط فقط بأمراض الكبد", "أنه يستخدم لتشخيص القصور الكلوي فقط"], "q": "ما أهمية تحديد الليبوبروتين a المشابه لـ LDL عند مرضى القلب؟"}, {"a": 3, "c": "واسمات القلب والوظيفة الكلوية والبنكرياسية", "e": "يتكون كل نفرون من خمسة أجزاء رئيسية: الكبيبات، النبيب المعوج القريب، عروة هنلي، الأنبوب المعوج البعيد، والقناة الجامعة؛ أما الحويضة الكلوية فليست جزءا من النفرون.", "o": ["الكبيبة", "الأنبوب المعوج القريب", "عروة هنلي (Loop of Henle)", "الحويضة الكلوية"], "q": "أي مما يلي ليس جزءا من النفرون؟"}, {"a": 2, "c": "واسمات القلب والوظيفة الكلوية والبنكرياسية", "e": "الجزيئات التي يقل وزنها الجزيئي عن 66000 دالتون تعبر الغشاء، لكن مكونات الدم كالألبومين كبيرة جدا لكي ترشح، وبسبب شحنة الغشاء القاعدي السلبية فإن الجزيئات ذات الشحنة السلبية كالألبومين يتم استبعادها.", "o": ["لأن حجمه كبير جدا فقط", "لأن شحنة الغشاء القاعدي السلبية تستبعده فقط", "لأن حجمه كبير نسبيا ولأن شحنة الغشاء القاعدي السلبية تستبعد الجزيئات سالبة الشحنة كالألبومين", "لأنه مرتبط بالكالسيوم فقط"], "q": "لماذا لا يرشح الألبومين عبر الغشاء الكبيبي رغم صغر حجمه نسبيا؟"}, {"a": 0, "c": "واسمات القلب والوظيفة الكلوية والبنكرياسية", "e": "من 1200-1500 مل من الدم التي تستقبلها الكليتان كل دقيقة، ترشح الكبيبات 125 مل، وهذا ما يطلق عليه اسم معدل الرشح الكبي (GFR).", "o": ["125 مل/دقيقة، وهو ما يطلق عليه معدل الرشح الكبي (GFR)", "250 مل/دقيقة", "500 مل/دقيقة", "1200 مل/دقيقة"], "q": "من 1200-1500 مل من الدم التي تستقبلها الكليتان كل دقيقة، كم ترشح الكبيبات؟"}, {"a": 2, "c": "واسمات القلب والوظيفة الكلوية والبنكرياسية", "e": "في الأنبوب المعوج القريب يعاد امتصاص 75% من الماء والصوديوم والكلور، و100% من الغلوكوز ما لم يتجاوز العتبة الكلوية.", "o": ["25%", "50%", "75%", "100%"], "q": "ما نسبة الماء والصوديوم والكلور التي يعاد امتصاصها في الأنبوب المعوج القريب؟"}, {"a": 1, "c": "واسمات القلب والوظيفة الكلوية والبنكرياسية", "e": "الجزء الصاعد من عروة هنلي يصبح ناقص التوتر بسبب إعادة امتصاص شوارد الصوديوم والكلور بدون خسارة الماء، لذلك يسمى غالبا بالقطعة الممددة.", "o": ["الجزء النازل من عروة هنلي", "الجزء الصاعد من عروة هنلي", "الأنبوب المعوج القريب", "القناة الجامعة"], "q": "أي جزء من النفرون يسمى غالبا بالقطعة الممددة (the diluting segment)؟"}, {"a": 0, "c": "واسمات القلب والوظيفة الكلوية والبنكرياسية", "e": "يفرز ADH من النخامى الخلفية أساسا كاستجابة لزيادة أسمولية الدم، ويفرز أيضا عندما ينقص حجم الدم أكثر من 5-10%، حتى وإن كانت أسمولية البلازما منخفضة.", "o": ["عندما ينقص حجم الدم أكثر من 5-10%", "عندما يزيد حجم الدم أكثر من 5-10%", "عندما ينخفض صوديوم البلازما فقط", "عندما يرتفع ضغط الدم فقط"], "q": "بالإضافة إلى زيادة أسمولية الدم، متى يفرز الهرمون المضاد للإدرار (ADH) أيضا؟"}, {"a": 0, "c": "واسمات القلب والوظيفة الكلوية والبنكرياسية", "e": "ينبه إفراز الألدوستيرون تناقص ضغط الدم في الشريان الكلوي الوارد ونقص صوديوم البلازما، ويحرض إعادة امتصاص الصوديوم من الأنابيب البعيدة وإفراز البوتاسيوم والهيدروجين.", "o": ["إعادة امتصاص الصوديوم وإفراز البوتاسيوم والهيدروجين", "إفراز الصوديوم وإعادة امتصاص البوتاسيوم", "إعادة امتصاص الكالسيوم فقط", "إفراز الماء فقط"], "q": "ماذا يحرض الألدوستيرون في الأنابيب البعيدة؟"}, {"a": 1, "c": "واسمات القلب والوظيفة الكلوية والبنكرياسية", "e": "تشكل البولة الجزء الأكبر (أكثر من 75%) من فضلات NPN، وتطرح يوميا كنتيجة للهدم التأكسدي للبروتين، ويتم اصطناعها في الكبد.", "o": ["الكرياتينين (Creatinine)", "البولة (Urea)", "حمض البول (Uric Acid)", "الأمونيا"], "q": "ما المركب الذي يشكل الجزء الأكبر (أكثر من 75%) من فضلات النتروجين غير البروتيني (NPN)؟"}, {"a": 1, "c": "واسمات القلب والوظيفة الكلوية والبنكرياسية", "e": "يرشح الكرياتينين من الكبيبات لكن لا يعاد امتصاصه من النبيبات على عكس البولة، وتفرز كمية قليلة منه عند التراكيز العالية، ويبقى مستواه ثابتا تقريبا عند نفس الشخص إلا إذا تغيرت الكتلة العضلية أو وظيفة الكلية.", "o": ["يعاد امتصاصه من النبيبات مثل البولة", "يرشح من الكبيبات ولا يعاد امتصاصه، وتفرز منه كمية قليلة عبر النبيبات عند التراكيز العالية", "يصنع في الكبد من الأمونيا", "يتغير مستواه يوميا بشكل كبير عند الشخص السليم"], "q": "أي عبارة صحيحة عن الكرياتينين؟"}, {"a": 2, "c": "واسمات القلب والوظيفة الكلوية والبنكرياسية", "e": "تصنع الكلية الرينين والإريثروبويتين و1،25-داي هيدروكسي فيتامين د3 والبروستاغلاندينات، أما الألدوستيرون فيحرر من قشر الكظر (القشر الكلوي) بتحريض من الأنجيوتنسين II.", "o": ["الرينين (Renin)", "الإريثروبويتين (Erythropoietin)", "الألدوستيرون (Aldosterone)", "البروستاغلاندينات (Prostaglandins)"], "q": "أي هرمون لا تصنعه الكلية؟"}, {"a": 1, "c": "واسمات القلب والوظيفة الكلوية والبنكرياسية", "e": "يحول الرينين الأنجيوتنسينوجين إلى أنجيوتنسين I، الذي يقلب إلى أنجيوتنسين II عبر الأنزيم القالب للأنجيوتنسين (ACE)، وهو مقبض وعائي قوي يزيد ضغط الدم ويحرض إطلاق الألدوستيرون.", "o": ["الرينين (Renin)", "الأنزيم القالب للأنجيوتنسين (ACE)", "الغلوتاميناز (Glutaminase)", "الأنهيدراز الكربوني (Carbonic anhydrase)"], "q": "أي أنزيم يحول الأنجيوتنسين I إلى الأنجيوتنسين II؟"}, {"a": 1, "c": "واسمات القلب والوظيفة الكلوية والبنكرياسية", "e": "القيم المرجعية لتصفية الكرياتينين: الذكور 97-137 مل/د لكل 1.73 م2 (117 ± 20)، والإناث 88-128 مل/د لكل 1.73 م2 (108 ± 20).", "o": ["97-137 مل/د لكل 1.73 م2", "88-128 مل/د لكل 1.73 م2", "60-89 مل/د لكل 1.73 م2", "30-59 مل/د لكل 1.73 م2"], "q": "ما المجال المرجعي لتصفية الكرياتينين عند الإناث؟"}, {"a": 1, "c": "واسمات القلب والوظيفة الكلوية والبنكرياسية", "e": "السيستاتين C بروتين منخفض الوزن الجزيئي يرشح حرا عبر الكبيبات ويصنع بمعدل ثابت، وتراكيزه البلازمية غير متأثرة بالجنس أو العرق أو العمر أو الكتلة العضلية، وغالبا ما يكشف ارتفاعه نقص وظيفة الكلية قبل زيادة الكرياتينين أو نقص GFR.", "o": ["أنه يتأثر بالكتلة العضلية والجنس والعرق", "أن ارتفاعه غالبا ما يكشف نقص وظيفة الكلية قبل حدوث زيادة في الكرياتينين أو نقص في GFR", "أنه يصنع بمعدل متغير وغير ثابت", "أنه لا يرشح عبر الكبيبات"], "q": "ما ميزة قياس السيستاتين C (Cystatin C) مقارنة بكرياتينين المصل في تقييم وظيفة الكلية؟"}, {"a": 1, "c": "واسمات القلب والوظيفة الكلوية والبنكرياسية", "e": "يعتبر عدد الكريات الحمر الأعلى من 0-2/ساحة عالية التكبير (HPF) مرضيا، وقد يشير إلى مرض كلوي أو انسداد أو حصيات أو التهاب كبيبات أو التهاب مثانة.", "o": ["0/HPF", "2/HPF", "5/HPF", "10/HPF"], "q": "يعد تعداد الكريات الحمر في راسب البول مرضيا عندما يتجاوز كم لكل ساحة عالية التكبير (HPF)؟"}, {"a": 0, "c": "واسمات القلب والوظيفة الكلوية والبنكرياسية", "e": "أسطوانات الكريات الحمر مرضية دائما لأنها مشخصة لالتهاب الكبب الكلوية، وتشاهد في التهاب الكبب الكلوي الحاد واحتشاء الكلية وأمراض الكولاجين والقصور الكلوي الحاد.", "o": ["التهاب الكبب الكلوية (Glomerulonephritis)", "التهاب المثانة البسيط", "البيلة الجرثومية اللاعرضية", "التجفاف المؤقت"], "q": "وجود أسطوانات الكريات الحمر في البول مرضي دائما ويشخص ماذا؟"}, {"a": 0, "c": "واسمات القلب والوظيفة الكلوية والبنكرياسية", "e": "تحدث المتلازمة الكلائية نتيجة أذية وزيادة نفوذية الغشاء القاعدي الكبيبي، وتعطي بيلة بروتينية كتلية وانخفاض ألبومين الدم ووذمة معممة وارتفاع شحوم الدم وبيلة شحمية تظهر على شكل أجسام شحمية بيضوية في البول.", "o": ["أجسام شحمية بيضوية في البول (بيلة شحمية)", "ارتفاع ألبومين الدم", "نقص شحوم الدم", "غياب الوذمة"], "q": "أي من الموجودات التالية يظهر في المتلازمة الكلائية (Nephrotic Syndrome)؟"}, {"a": 1, "c": "واسمات القلب والوظيفة الكلوية والبنكرياسية", "e": "أشيع الحصيات الكلوية هي أوكزالات الكالسيوم، وهي موجودة بشكل خاص في المناطق الاستوائية والمدارية، ويعد نقص حجم البول الناتج عن نقص تناول الماء من أهم أسباب تكونها.", "o": ["فوسفات الأمونيوم مغنزيوم", "أوكزالات الكالسيوم", "حمض البول", "السيستين"], "q": "ما أشيع أنماط الحصيات الكلوية؟"}, {"a": 1, "c": "واسمات القلب والوظيفة الكلوية والبنكرياسية", "e": "الأعراض الأكثر شيوعا للقصور الكلوي الحاد هي قلة البول أو انقطاع البول (أقل من 400 مل/يوم)، كما يؤدي انخفاض قدرة الكلية على إطراح الشوارد والماء إلى وذمة محيطية وارتفاع ضغط وقصور قلب احتقاني.", "o": ["تعدد البيلات", "قلة البول أو انقطاع البول (أقل من 400 مل/يوم)", "البيلة الليلية المعزولة", "زيادة حجم البول الدائم"], "q": "ما أكثر أعراض القصور الكلوي الحاد شيوعا؟"}, {"a": 2, "c": "واسمات القلب والوظيفة الكلوية والبنكرياسية", "e": "حسب التصنيف الجهازي لمراحل CKD: المرحلة 3 هي انخفاض GFR معتدل 30-59، والمرحلة 4 انخفاض شديد 15-29، والمرحلة 5 قصور كلوي أقل من 15.", "o": ["المرحلة 1", "المرحلة 2", "المرحلة 3 (انخفاض معتدل في GFR)", "المرحلة 5 (قصور كلوي)"], "q": "في أي مرحلة من مراحل الداء الكلوي المزمن (CKD) يتراوح GFR بين 30-59 مل/د لكل 1.73 م2؟"}, {"a": 1, "c": "واسمات القلب والوظيفة الكلوية والبنكرياسية", "e": "يفرز السكريتين من العفج كاستجابة لحموضة محتوى المعدة، وهو مسؤول عن إنتاج البيكربونات، حيث يحمي السائل البنكرياسي القلوي بطانة الأمعاء من الأذية؛ أما CCK فيحرر الأنزيمات من الخلايا العنبية البنكرياسية.", "o": ["الكوليسيستوكينين (CCK)", "السكريتين (Secretin)", "الغاسترين (Gastrin)", "عديد الببتيد المثبط المعدي (GIP)"], "q": "أي هرمون يفرز من العفج كاستجابة لحموضة محتوى المعدة، وهو مسؤول عن إنتاج البيكربونات في السائل البنكرياسي؟"}, {"a": 1, "c": "واسمات القلب والوظيفة الكلوية والبنكرياسية", "e": "المرض الوراثي المسؤول عن التليف الكيسي يرمز له CFTR، ويوجد على الصبغي السابع، وعرف أكثر من 900 طفرة مسببة لهذا المرض، وهو مرض وراثي جسدي متنح يحدث بمعدل من كل 1600 ولادة.", "o": ["الصبغي الخامس", "الصبغي السابع", "الصبغي الحادي عشر", "الصبغي الحادي والعشرون"], "q": "على أي صبغي يوجد الجين المسؤول عن التليف الكيسي (CFTR)؟"}, {"a": 2, "c": "واسمات القلب والوظيفة الكلوية والبنكرياسية", "e": "تكون تراكيز الصوديوم والكلور في العرق مرتفعة عند أكثر من 99% من مرضى التليف الكيسي، وإذا كان تركيز الكلور أكثر من 60 ممول/ل فهذا مؤشر تشخيصي للإصابة بالتليف الكيسي عند الأطفال.", "o": ["أكثر من 20 ممول/ل", "أكثر من 40 ممول/ل", "أكثر من 60 ممول/ل", "أكثر من 100 ممول/ل"], "q": "ما تركيز كلور العرق الذي يعد مؤشرا تشخيصيا للإصابة بالتليف الكيسي عند الأطفال؟"}, {"a": 1, "c": "واسمات القلب والوظيفة الكلوية والبنكرياسية", "e": "يرتفع الليباز في المصل بشكل مرافق لارتفاع الأميلاز في التهاب البنكرياس الحاد، لكن يستمر ارتفاعه فترة أطول من الأميلاز، ويعتبر ذا حساسية أعلى من الأميلاز كمشعر لالتهاب البنكرياس الحاد أو التنخر البنكرياسي.", "o": ["الأميلاز (Amylase)", "الليباز (Lipase)", "التربسين", "الكيموتربسين"], "q": "أي الأنزيمين أكثر حساسية كمشعر لالتهاب البنكرياس الحاد، ويستمر ارتفاعه في المصل فترة أطول من الآخر؟"}, {"a": 0, "c": "واسمات القلب والوظيفة الكلوية والبنكرياسية", "e": "هرمون الغاسترين هو المحفز الأقوى للإفراز المعدي، ويفرز من الخلايا G في مخاطية المعدة والعفج كاستجابة لتنبيه العصب المبهم ومنشطات الإفراز.", "o": ["الغاسترين، من الخلايا G في مخاطية المعدة والعفج", "السكريتين، من خلايا الأمعاء المخاطية", "GIP، من الخلايا K في العفج والصائم", "VIP، من خلايا H في مخاطية المعي"], "q": "ما المحفز الأقوى للإفراز المعدي، وأين يفرز؟"}, {"a": 3, "c": "واسمات القلب والوظيفة الكلوية والبنكرياسية", "e": "قياس مستويات غاسترين البلازما فعال في تشخيص متلازمة زولينجر إليسون، فبعد تناول الوجبات مستواه يتجاوز 1000 بكغ/مل ويمكن أن يصل حتى 400000 بكغ/مل، مقارنة مع مجال طبيعي يتراوح ما بين 50-150 بكغ/مل.", "o": ["50 بكغ/مل", "150 بكغ/مل", "500 بكغ/مل", "1000 بكغ/مل، وقد يصل حتى 400000 بكغ/مل"], "q": "في متلازمة زولينجر إليسون، كم يتجاوز مستوى غاسترين البلازما بعد تناول الوجبات؟"}, {"a": 2, "c": "واسمات القلب والوظيفة الكلوية والبنكرياسية", "e": "يستخدم التحليل المعدي لتقييم فقر الدم الوبيل عند البالغين، فدرجة حموضة السائل المعدي في هذه الحالة لا تنخفض إلى أقل من 6 حتى لو كان التحفيز أعظميا.", "o": ["تنخفض إلى أقل من 2", "تنخفض إلى أقل من 4", "لا تنخفض إلى أقل من 6", "ترتفع فوق 8"], "q": "في فقر الدم الوبيل عند البالغين، ماذا يحدث لدرجة حموضة السائل المعدي حتى مع التحفيز الأعظمي؟"}, {"a": 3, "c": "سوائل الجسم ومراقبة الأدوية والسموم", "e": "بيتا-ترانسفيرين هو البروتين الفائق النوعية للسائل النخاعي (CSF)، وهو أفضل طريقة لتمييز تسرّبه، وقد يحدث التمزّق بعد بزل قطني سابق أو رضّ شديد.", "o": ["تحليل الألبومين في المصل", "تحليل الغلوكوز في السائل النخاعي", "تحليل البروتين الكلي في البلازما", "تحليل بيتا-ترانسفيرين (beta-transferrin)"], "q": "ما أفضل تحليل لتمييز تسرّب السائل النخاعي (CSF) من تمزّق في الأم الجافية؟"}, {"a": 0, "c": "سوائل الجسم ومراقبة الأدوية والسموم", "e": "الألبومين يُنتج في الكبد فقط ويصل إلى السائل النخاعي عبر الحواجز الوعائية الدماغية، أما IgG فقد يرتفع بالاصطناع الموضعي من الخلايا البلازمية؛ فارتفاعه دون ارتفاع الألبومين يقترح إنتانا موضعيا مثل MS أو SSPE، وتُحسب قيمة مشعر IgG الطبيعية بأقل من 0.7.", "o": ["اصطناعا موضعيا للـ IgG داخل الجهاز العصبي المركزي، كما في التصلب المتعدد (MS) أو التهاب الدماغ الشامل المصلب تحت الحاد (SSPE)", "زيادة نفوذية الحواجز الوعائية الدماغية فقط", "انسداد تصريف الحاجز الدموي الدماغي فقط", "نقص إنتاج البروتين في الكبد"], "q": "ماذا يقترح ارتفاع الغلوبيولين المناعي G (IgG) في السائل النخاعي (CSF) دون ارتفاع مرافق لألبومين السائل النخاعي؟"}, {"a": 2, "c": "سوائل الجسم ومراقبة الأدوية والسموم", "e": "عند الشك في تركيز الألبومين في السائل النخاعي يُلجأ إلى فصل البروتينات بالرحلان الكهربائي، فيظهر حزم متعددة من IgG تُسمى الحزم قليلة النسيلة (oligoclonal bands)، وتُشاهد عادة في الأمراض الالتهابية و MS و SSPE.", "o": ["حزم الألبومين فقط", "حزم الهيموغلوبين", "الحزم قليلة النسيلة (oligoclonal bands) من IgG", "حزم الفيبرينوجين"], "q": "ما الحزم التي تُظهرها عملية فصل بروتينات السائل النخاعي (CSF) بالرحلان الكهربائي وتُشاهد عادة في الأمراض الالتهابية والتصلب المتعدد (MS) و SSPE؟"}, {"a": 3, "c": "سوائل الجسم ومراقبة الأدوية والسموم", "e": "القيم الأعلى من 60 ممول/ل لکلور العرق تُعتبر إيجابية، أما المجال 40-59 ممول/ل فيُعتبر مناسبا لتحديد الحاجة لإعادة الاختبار، علما أن بعض مرضى طفرات مورثة CFTR قد تكون قيمتهم أقل من 60 ممول/ل.", "o": ["40-59 ممول/ل", "أقل من 40 ممول/ل", "أعلى من 120 ممول/ل", "أعلى من 60 ممول/ل"], "q": "في اختبار كلور العرق لتشخيص التليّف الكيسي، ما القيمة التي تُعتبر إيجابية؟"}, {"a": 3, "c": "سوائل الجسم ومراقبة الأدوية والسموم", "e": "يعتمد اختبار كلور العرق على طريقة الرحلان الشاردي لنتزات البيلوكاربين، وتُسمى طريقة Gibson-Cooke، والبيلوكاربين دواء مقلّد نظير ودي يُستعمل لتحريض الغدد العرقية على إفراز العرق، بينما تُعتبر اختبارات الأسمولية والناقلية وأقطاب الكلور ولصاقات الجلد اختبارات مسحية.", "o": ["لصاقات الجلد فقط", "أقطاب الكلور فقط", "قياس الأسمولية فقط", "طريقة Gibson-Cooke بالرحلان الشاردي (iontophoresis) لنتزات البيلوكاربين (pilocarpine)"], "q": "ما الطريقة المرجعية لاختبار كلور العرق، وما الدواء المستخدم فيها لتحريض الغدد العرقية؟"}, {"a": 0, "c": "سوائل الجسم ومراقبة الأدوية والسموم", "e": "نسبة غلوكوز السائل الزليلي إلى البلازما الطبيعية هي 0.9:1 وهي أهم التحاليل الكيميائية على السائل الزليلي، وتنخفض في الأمراض الالتهابية مثل النقرس والداء الرثياني والذئبة، وفي الأمراض الإنتانية مثل التهاب المفاصل الجرثومي والفيروسي، ويجب أخذ عينتي الدم والسائل معا وبعد 8 ساعات من الصيام.", "o": ["0.9:1، وتنخفض في الأمراض الالتهابية والإنتانية مثل النقرس والداء الرثياني والتهاب المفاصل الجرثومي", "0.5:1، وترتفع في الالتهاب", "2:1، ولا تتغير في المرض", "1.5:1، وتنخفض في قصور القلب فقط"], "q": "ما النسبة الطبيعية لغلوكوز السائل الزليلي إلى غلوكوز البلازما، ومتى تنخفض؟"}, {"a": 2, "c": "سوائل الجسم ومراقبة الأدوية والسموم", "e": "يُحسب SAAG بطرح ألبومين الحبن من ألبومين المصل، وهو الطريقة المفضلة لتمييز الحبن الرشحي من النضحي، فإذا كانت قيمته 1.1 أو أكثر فإن ذلك يشير إلى وجود فرط توتر بابي.", "o": ["أقل من 0.5", "أكثر من 3 فقط", "1.1 أو أكثر", "0.5-1.0"], "q": "ما قيمة مدرّج ألبومين المصل-الحبن (SAAG) التي تشير إلى وجود فرط توتر بابي في الحبن؟"}, {"a": 2, "c": "سوائل الجسم ومراقبة الأدوية والسموم", "e": "تُعرف معايير Light بسلسلة من معدلات السائل/البلازما، فإذا كان معدل البروتين الكلي أكبر من 0.5، ومعدل LDH أكبر من 0.6، أو معدل LDH السائل الجنبي إلى الحد الأعلى للمصل أكبر من 0.67، فإن السائل يُعتبر نضحيا، ويشير الانصباب النضحي إلى أذية بدئية على مستوى الجنبة والرئة مثل الإنتان.", "o": ["عندما يكون الغلوكوز مرتفعا فقط", "عندما يكون حجم السائل أقل من 20 مل", "عندما يكون معدل البروتين الكلي سائل/بلازما أكبر من 0.5، أو معدل LDH أكبر من 0.6، أو معدل LDH السائل الجنبي إلى الحد الأعلى المرجعي للمصل أكبر من 0.67", "عندما يكون معدل البروتين أقل من 0.3 فقط"], "q": "حسب معايير Light، متى يُعتبر السائل الجنبي نضحيا؟"}, {"a": 0, "c": "سوائل الجسم ومراقبة الأدوية والسموم", "e": "يفيد قياس pH السائل الجنبي، ويفضل بجهاز غازات الدم، فالـ pH الأقل من 7.2 يقترح وجود إنتان، والـ pH القريب من 7 يشير إلى تمزّق مريئي، كما أن نقص الغلوكوز أو زيادة اللاكتات يقترح إنتانا أو التهابا.", "o": ["الأقل من 7.2 يقترح إنتانا، والقريب من 7 يشير إلى تمزّق مريئي", "الأقل من 7.2 يقترح قصور قلب، والقريب من 7 يشير إلى تشمع كبد", "الأقل من 7.2 طبيعي، والقريب من 7 يشير إلى التهاب بنكرياس", "كلاهما يشيران إلى تمزّق القناة الصدرية"], "q": "ماذا يقترح pH السائل الجنبي الأقل من 7.2، وماذا يشير pH القريب من 7؟"}, {"a": 0, "c": "سوائل الجسم ومراقبة الأدوية والسموم", "e": "من الاستطبابات الشائعة لـ TDM: النتائج الخطرة لرفع أو خفض الجرعة، والفارق الصغير بين الجرعة العلاجية والسامة، والعلاقة الضعيفة بين الجرعة وتراكيز الدوران مع ارتباط جيد بين التراكيز والتأثيرات العلاجية أو السامة، وتغير الحالة الفيزيولوجية، والتداخل الدوائي المحتمل، ومراقبة مطاوعة المريض.", "o": ["وجود فارق صغير بين الجرعة العلاجية والجرعة السامة، مع علاقة ضعيفة بين الجرعة وتركيز الدواء في الدوران وارتباط جيد بين التركيز والتأثير", "أن تكون الجرعة العلاجية واسعة جدا ولا تتأثر بالحالة الفيزيولوجية", "أن يكون الدواء آمنا تماما عند كل الجرعات", "أن يكون تأثير الدواء غير قابل للقياس أبدا"], "q": "ما الاستطباب الشائع لمراقبة الفعالية العلاجية (TDM)؟"}, {"a": 1, "c": "سوائل الجسم ومراقبة الأدوية والسموم", "e": "معظم الأدوية في الدوران عرضة للارتباط بمكونات المصل، وفقط الجزء الحر يمكنه التفاعل مع موقع التأثير ويعطي الاستجابة البيولوجية، وهو المسؤول عن التأثيرات العلاجية والسامة، لذلك قد تظهر سمّية عند ارتفاع الجزء الحر أو يفشل العلاج عند انخفاضه.", "o": ["الجزء المطروح في البول", "الجزء الحر فقط", "الجزء المرتبط ببروتينات المصل", "الجزء المخزون في الكريات الحمر فقط"], "q": "في الدوران، أي جزء من الدواء هو وحده القادر على التفاعل مع موقع التأثير وإعطاء الاستجابة البيولوجية؟"}, {"a": 2, "c": "سوائل الجسم ومراقبة الأدوية والسموم", "e": "تمتص الأدوية غالبا بالانتشار المنفعل الذي يتطلب أن يكون الدواء كارهاً للماء وغير متأين، فالحموض الضعيفة تمتص بفعالية من المعدة، بينما الأسس الضعيفة يُفضل امتصاصها من الأمعاء حيث pH أكثر اعتدالا، وتتأثر خصائص الامتصاص بالحركة المعوية و pH والالتهاب والطعام والأدوية الأخرى.", "o": ["الحموض تمتص من الأمعاء والأسس من المعدة", "كلاهما يمتص من الأمعاء فقط", "الحموض الضعيفة تمتص بفعالية من المعدة، والأسس الضعيفة يُفضل امتصاصها من الأمعاء حيث pH أكثر اعتدالا", "كلاهما يمتص من المعدة فقط"], "q": "كيف يختلف امتصاص الحموض الضعيفة والأسس الضعيفة من القناة المعدية المعوية؟"}, {"a": 1, "c": "سوائل الجسم ومراقبة الأدوية والسموم", "e": "زمن أخذ العينة هو العامل الأكثر أهمية في TDM، فعينات التركيز المنخفض لمعظم الأدوية تُسحب مباشرة قبل الجرعة التالية، بينما عينات التركيز الذروية تُسحب بعد ساعة من الجرعة الفموية، والديجوكسين هو الدواء المستثنى المعروف من هذه القاعدة.", "o": ["أثناء ذروة الامتصاص فقط", "مباشرة قبل الجرعة التالية", "بعد 10 ساعات من الجرعة دائما", "بعد ساعة من الجرعة الفموية"], "q": "متى تُسحب عادة عينات التركيز المنخفض (trough) لمعظم الأدوية في TDM؟"}, {"a": 1, "c": "سوائل الجسم ومراقبة الأدوية والسموم", "e": "يُلاحظ تأثير الديجوكسين عندما يكون مجال التركيز المصلي 0.8-2.0 نغ/مل، وتظهر التأثيرات الجانبية بالتراكيز الأعلى من 2 نغ/مل، ويعزز البوتاسيوم والمغنيزيوم المصليان المنخفضان أفعال الديجوكسين، كما أن مرضى فرط نشاط الدرق يقاومون الديجوكسين بينما مرضى قصور الدرق أكثر حساسية له، ويُطرح أساسا بالترشيح الكلوي.", "o": ["5-10 مكغ/مل، ويعززها ارتفاع البوتاسيوم فقط", "0.8-2.0 نغ/مل، ويعززها انخفاض البوتاسيوم والمغنيزيوم المصليين", "40-100 مكغ/مل، ولا تتأثر بالشوارد", "0.1-0.3 نغ/مل، ويعززها فرط نشاط الدرق"], "q": "ما المجال المصلي العلاجي للديجوكسين (Digoxin)، وما الذي يعزز أفعاله السامة؟"}, {"a": 0, "c": "سوائل الجسم ومراقبة الأدوية والسموم", "e": "الأمينوغلوكوزيدات مثل جنتاميسين وتوبراميسين وأميكاسين تُستخدم لعلاج الإنتانات بالبكتيريا سلبية الغرام، ولا تمتص جيدا من القناة المعدية المعوية لذلك يقتصر إعطاؤها على IM أو IV، وتشترك بالسمّية الكلوية والسمّية السمعية التي تصيب الأغشية القوقعية والدهليزية وقد تكون لا عكوسة.", "o": ["لأنها لا تمتص جيدا من القناة المعدية المعوية، وتسبب سمّية كلوية وسمّية سمعية", "لأنها لا تصل إلى الدم إلا بالحقن تحت الجلد", "لأنها تمتص جيدا فمويا لكنها تسبب سمّية كبدية فقط", "لأنها تُستقلب في المعدة إلى مركب غير فعال تماما"], "q": "لماذا يقتصر إعطاء الأمينوغلوكوزيدات (Aminoglycosides) على الطريق العضلي أو الوريدي، وما سميتاها الرئيسيتان؟"}, {"a": 2, "c": "سوائل الجسم ومراقبة الأدوية والسموم", "e": "العديد من التأثيرات السامة للفانكوميسين تحدث في المجال العلاجي 5-10 مكغ/مل، ومن أبرزها متلازمة الرجل الأحمر والسمّية الكلوية والسمّية السمعية، وتظهر السمّية الكلوية بالتراكيز الأعلى من 10 مكغ/مل، بينما تظهر السمّية السمعية بالتراكيز الأعلى من 40 مكغ/مل، ويُطرح بالإرشاح والإفراز الكلوي.", "o": ["السمّية الكلوية أعلى من 40 مكغ/مل، والسمّية السمعية أعلى من 10 مكغ/مل", "كلاهما أعلى من 5 مكغ/مل", "السمّية الكلوية أعلى من 10 مكغ/مل، والسمّية السمعية أعلى من 40 مكغ/مل", "لا تظهر سمّية للفانكوميسين أبدا"], "q": "عند أي تراكيز للفانكوميسين (Vancomycin) تظهر السمّية الكلوية والسمّية السمعية؟"}, {"a": 2, "c": "سوائل الجسم ومراقبة الأدوية والسموم", "e": "للفينيتوئين درجة ارتباط عالية بالبروتين وقد تُزاح بالأدوية الأخرى شديدة الارتباط بالبروتين، فيكون تركيز الدواء الكلي ضمن المدى العلاجي بينما تظهر السمّية عندما يكون تركيز الدواء الحر 1-2 مكغ/مل، وهو المدى العلاجي للفينيتوئين الحر، ومن آثاره الجانبية ضخامة اللثة وعوز فيتامين د وحمض الفوليك.", "o": ["40-100 مكغ/مل", "4-12 مكغ/مل", "1-2 مكغ/مل", "50-120 مكغ/مل"], "q": "ما المدى العلاجي للفينيتوئين (Phenytoin) الحر في المصل؟"}, {"a": 0, "c": "سوائل الجسم ومراقبة الأدوية والسموم", "e": "المدى العلاجي لحمض فالبرويك واسع نسبيا وهو 50-120 مكغ/مل، ويرتبط بشدة بالبروتين بنسبة 93%، والأعراض الأكثر شيوعا المرتبطة بالمستويات المصلية المرتفعة الأعلى من 200 مكغ/مل هي الغثيان والخمول وزيادة الوزن والتهاب البنكرياس وفرط أمونيا الدم والهلوسات، ويجب فحص المشعرات الكبدية بشكل متكرر خلال الأشهر الستة الأولى.", "o": ["50-120 مكغ/مل، وترتبط المستويات الأعلى من 200 مكغ/مل بالغثيان والخمول وزيادة الوزن والتهاب البنكرياس وفرط أمونيا الدم والهلوسات", "30-60 مكغ/مل، وتسبب تضخم اللثة", "4-12 مكغ/مل، وتسبب فقر دم لا تنسجي فقط", "1-2 مكغ/مل، ولا توجد أعراض عند المستويات المرتفعة"], "q": "ما المدى العلاجي لحمض فالبرويك (Valproic acid)، وما العرض المرتبط بالمستويات الأعلى من 200 مكغ/مل؟"}, {"a": 1, "c": "سوائل الجسم ومراقبة الأدوية والسموم", "e": "المدى العلاجي للكاربامازيبين هو 4-12 مكغ/مل، والتراكيز البلازمية الأعلى من 15 مكغ/مل تكون مرتبطة بالاعتلالات الدموية واحتمال حدوث فقر دم لا تنسجي، ومن آثاره الأخرى الطفح الجلدي وقلة الكريات البيض، لذلك يُجرى تعداد الكريات البيض عادة خلال الأسبوعين الأولين من العلاج.", "o": ["50-120 مكغ/مل، وترتبط بالتهاب البنكرياس", "4-12 مكغ/مل، وترتبط التراكيز الأعلى من 15 مكغ/مل بالاعتلالات الدموية واحتمال حدوث فقر دم لا تنسجي", "1-2 مكغ/مل، وترتبط بضخامة اللثة", "40-100 مكغ/مل، ولا ترتبط بأي سمّية"], "q": "ما المدى العلاجي للكاربامازيبين (Carbamazepine)، وما المرتبط بالتراكيز البلازمية الأعلى من 15 مكغ/مل؟"}, {"a": 3, "c": "سوائل الجسم ومراقبة الأدوية والسموم", "e": "الليثيوم معدن موجب الشحنة لا يرتبط بالبروتينات ويُطرح أساسا بالإرشاح الكلوي، والتراكيز المصلية في المجال 1.5-2 يمكن أن تسبب خمولا ونعاسا وصعوبات بالتحدث وضعفا عضليا، والتراكيز الأعلى من 2 تكون مرتبطة مع تثبيط عضلي ونوبات صرعية وغيبوبة محتملة، لذلك هدف TDM لليثيوم هو تجنب التراكيز المرتبطة بالتأثيرات السامة.", "o": ["تحسن المزاج فقط دون أي خطر", "ضخامة اللثة فقط", "فقر دم لا تنسجي فقط", "تثبيط عضلي ونوبات صرعية وغيبوبة محتملة"], "q": "ما التأثيرات المرتبطة بتراكيز الليثيوم (Lithium) المصلية الأعلى من 2؟"}, {"a": 1, "c": "سوائل الجسم ومراقبة الأدوية والسموم", "e": "العلاقة بين الجرعة الفموية والتركيز الدموي للسيكلوسبورين ضعيفة لذلك فإن TDM جزء هام لإنشاء نظام جرعي، ويُحتجز الدواء الجوال في الخلايا ومنها الكريات الحمر، ومحتوى الكرية الحمراء معتمد بشدة على درجة الحرارة، ولتجنب هذا التغير قبل التحليل يكون الدم الكامل هو العينة المختارة، ويُطرح بالاستقلاب الكبدي إلى نواتج غير فعالة.", "o": ["لأن السيكلوسبورين يُقاس في البول فقط", "لأن الدواء يُحتجز في الخلايا ومنها الكريات الحمر، ومحتوى الكرية الحمراء معتمد بشدة على درجة الحرارة، فيتطلب تقييم التركيز البلازمي تحكما صارما بالحرارة", "لأن الدواء لا يوجد في البلازما أبدا", "لأن الدم الكامل أرخص فقط دون سبب تحليلي"], "q": "لماذا يُختار الدم الكامل عينةً لقياس السيكلوسبورين (Cyclosporine)؟"}, {"a": 3, "c": "سوائل الجسم ومراقبة الأدوية والسموم", "e": "الميثوتريكسات من الأدوية المثبطة للأورام القليلة التي يُعطى فيها TDM فوائد، وهو يثبط تركيب DNA في كل الخلايا، وتعتمد كفاءة العلاج على فترة تثبيط مضبوطة تكون مضرة نوعيا بالخلايا الورمية، ويُحقق ذلك بإعطاء لوكوفورين الذي يعكس أفعال الميثوتريكسات في وقت معين بعد التسريب الوريدي.", "o": ["يحول الميثوتريكسات إلى دواء مضاد للصرع", "يُستخدم لقياس تركيز الميثوتريكسات في الدم", "يزيد فعالية الميثوتريكسات على الخلايا الورمية فقط دون إيقافه", "يعكس أفعال الميثوتريكسات في وقت معين بعد التسريب الوريدي، وفشل إيقاف أفعاله ينتج تأثيرات سامة للخلايا"], "q": "ما دور اللوكوفورين (leucovorin) في علاج الميثوتريكسات (Methotrexate)؟"}, {"a": 3, "c": "سوائل الجسم ومراقبة الأدوية والسموم", "e": "حسب جدول تصنيف السمّية: فائق السمّية أقل من 5 ملغ/كغ، وشديد السمّية 5-50 ملغ/كغ، وعالي السمّية 50-500 ملغ/كغ، ومعتدل السمّية 0.5-5 غ/كغ، وقليل السمّية 5-15 غ/كغ، وعمليا غير سام أكثر من 15 غ/كغ، وذلك للجرعة الفموية القاتلة لدى البالغ المتوسط.", "o": ["5-50 ملغ/كغ", "50-500 ملغ/كغ", "أكثر من 15 غ/كغ", "أقل من 5 ملغ/كغ"], "q": "حسب نظام تصنيف السمّية، ما الجرعة الفموية القاتلة لدى البالغ المتوسط للمادة فائقة السمّية (super toxic)؟"}, {"a": 0, "c": "سوائل الجسم ومراقبة الأدوية والسموم", "e": "ألفة أحادي أكسيد الكربون للخضاب أكبر بحوالي 200-250 مرة من ألفته للأكسجين، ويسبب انحراف منحني تفكك الأكسجين نحو اليسار فينخفض وصول الأكسجين إلى الأنسجة، والعلاج الوحيد لسمّيته هو العلاج بالأكسجين بنسبة 100%، وفي حالات الخطر يمكن استخدام كميات زائدة من الأكسجين، والطريقة المرجعية لتحديد COHb هي GC.", "o": ["العلاج بالأكسجين بنسبة 100%", "العلاج بالغسيل الكلوي فقط", "العلاج بالخالبات مثل EDTA", "العلاج بالنالوكسون"], "q": "ما العلاج الوحيد لسمّية أحادي أكسيد الكربون (Carbon monoxide)؟"}, {"a": 1, "c": "سوائل الجسم ومراقبة الأدوية والسموم", "e": "إحداث سمّية الرصاص يعتمد أساسا على العمر، فالبالغون يمتصون حوالي 5-15% من الرصاص المتناوَل بينما الأطفال أكثر عرضة للامتصاص، والرضّع يمتصون 30-40%، ويتوزع الرصاص عظميا بعمر نصفي 20 عاما وفي الأنسجة الرخوة بعمر نصفي 120 يوما، والقياس الأفضل هو التحديد الكمي لتركيز الرصاص في الدم الكامل.", "o": ["البالغون يمتصون 30-40% والرضّع 5-15%", "البالغون يمتصون حوالي 5-15% من الرصاص المتناوَل، بينما الرضّع يمتصون 30-40%", "لا يمتص الرصاص من القناة الهضمية أبدا", "البالغون والرضّع يمتصون النسبة نفسها تماما"], "q": "كيف يختلف امتصاص الرصاص بين البالغين والرضّع؟"}, {"a": 2, "c": "سوائل الجسم ومراقبة الأدوية والسموم", "e": "للزئبق ثلاث صيغ: عنصري سائل في درجة حرارة الغرفة، وأملاح لا عضوية، ومركبات عضوية، ولكل صيغة خصائص سمّية مختلفة، فالزئبق العنصري Hg0 يمكن ابتلاعه دون تأثيرات مهمة، والزئبق الموجب Hg2+ معتدل السمّية، أما ميثيل الزئبق فهو شديد السمّية، والزئبق العضوي النظامي يؤدي إلى تراكيز عالية في الدماغ والأعصاب المحيطية.", "o": ["كل الصيغ متساوية السمّية تماما", "الزئبق العنصري هو الأشد سمّية عند ابتلاعه", "ميثيل الزئبق هو الأشد سمّية، بينما الزئبق العنصري يمكن ابتلاعه دون تأثيرات مهمة", "الزئبق اللاعضوي هو الأشد سمّية، وميثيل الزئبق غير سام"], "q": "أي صيغة من الزئبق هي الأشد سمّية، وأيها يمكن ابتلاعه دون تأثيرات مهمة؟"}, {"a": 0, "c": "سوائل الجسم ومراقبة الأدوية والسموم", "e": "الفوسفات العضوية هي أكثر المبيدات الحشرية توفرا ومسؤولة عن حوالي ثلث إجمالي التسمم بالمبيدات، وتعمل الفوسفات العضوية والكاربامات بتثبيط الأستيل كولين إستراز، والذي ينتج عنه تأثير من الأعصاب المحيطية والمركزية، وتشمل أعراض التعرض المنخفض السيلان اللعابي ودمعان العين والتبول والتغوط اللاإرادي.", "o": ["بتثبيط الأستيل كولين إستراز، مما ينتج تأثيرا من الأعصاب المحيطية والمركزية", "بتثبيط السيتوكروم أوكسيداز فقط", "بتثبيط اصطناع الهيم فقط", "بتنشيط الأستيل كولين إستراز"], "q": "كيف تعمل الفوسفات العضوية والكاربامات كمبيدات حشرية سامة؟"}, {"a": 3, "c": "سوائل الجسم ومراقبة الأدوية والسموم", "e": "هناك علاقة وثيقة بين الأسبرين والعدوى الفيروسية في الطفولة مثل الحماق والإنفلونزا في إحداث متلازمة راي، كما أن تناول جرعات عالية من الساليسيلات يسبب حماضا استقلابيا، وتحفز الساليسيلات بشكل مباشر مركز الجهاز التنفسي وقد تسبب الجرعات العالية قلاء تنفسيا.", "o": ["الأسبرين يمنع متلازمة راي عند الأطفال", "الساليسيلات تعالج العدوى الفيروسية عند الأطفال", "لا توجد أي علاقة بينهما", "العلاقة الوثيقة بين الأسبرين والعدوى الفيروسية في الطفولة مثل الحماق والإنفلونزا في إحداث متلازمة راي (Reye syndrome)"], "q": "ما العلاقة بين الساليسيلات (Salicylates) والعدوى الفيروسية في الطفولة؟"}, {"a": 2, "c": "سوائل الجسم ومراقبة الأدوية والسموم", "e": "يقوم الكبد بالتخلص من سمّية الأسيتامينوفين باقترانه مع الغلوتاثيون، وفي حالات الجرعات الزائدة يُستنزف الغلوتاثيون وبالنتيجة تتراكم الجذور الحرة مما يسبب تأثيرا ساما للخلية الكبدية يؤدي إلى تنخّر الكبد، والاستهلاك المزمن للإيثانول يزيد سرعة تشكيل الوسائط التفاعلية فيزيد احتمالية إزالة الغلوتاثيون بجرعة أقل من الطبيعي.", "o": ["تثبيط إفراز الصفراء فقط دون أذية خلوية", "زيادة اصطناع الغلوتاثيون في الكبد", "استنزاف الغلوتاثيون (glutathione) فيتراكم الوسطاء التفاعلية وتتأثر الخلية الكبدية مما يؤدي إلى تنخّر الكبد", "تراكم الكالسيوم في العظم فقط"], "q": "ما آلية سمّية الجرعة الزائدة من الأسيتامينوفين (Acetaminophen) على الكبد؟"}, {"a": 3, "c": "سوائل الجسم ومراقبة الأدوية والسموم", "e": "المنتج الأولي للاستقلاب الكبدي للكوكايين هو بنزويل إكغونين الذي يُطرح في البول، وعمره النصفي 4-7 ساعات، وظهوره في البول مؤشر حساس ومحدد لاستعمال الكوكايين، إذ يمكن كشفه حتى 3 أيام بعد الاستعمال الواحد، وعند سوء الاستخدام الكثيف والمزمن حتى 20 يوما بعد آخر استعمال، والاختبار التأكيدي هو GC/MS.", "o": ["المورفين، ويمكن كشفه حتى 30 يوما", "الأسيتامينوفين، ويمكن كشفه حتى 20 يوما", "THC-COOH، ويمكن كشفه حتى 3 أيام", "بنزويل إكغونين (benzoylecgonine)، ويمكن كشفه حتى 3 أيام بعد الاستعمال الواحد"], "q": "ما المستقلب البولي الأولي للكوكايين، وكم يمكن كشفه في البول بعد استعمال واحد؟"}, {"a": 1, "c": "سوائل الجسم ومراقبة الأدوية والسموم", "e": "الـ THC هي الأكثر قوة ووفرة في الماريغوانا، وينتج العديد من المنتجات التي تُطرح أساسا في البول، والمستقلب البولي الرئيسي هو THC-COOH، والمقايسة المناعية لـ THC-COOH هي الاختبار الأساسي لاستهلاك الماريغوانا، وتُستخدم طريقة GC/MS للتأكيد.", "o": ["بنزويل إكغونين، والمقايسة المناعية له هي الاختبار الأساسي", "11-nor-tetrahydrocannabinol-9-carboxylic acid (THC-COOH)، والمقايسة المناعية له هي الاختبار الأساسي", "الأسيتامينوفين، والاختبار الأساسي هو قياس pH البول", "المورفين، والاختبار الأساسي هو GC/MS مباشرة"], "q": "ما المستقلب البولي الرئيسي للقنّب (Cannabinoids)، وما الاختبار الأساسي لاستهلاك الماريغوانا؟"}, {"a": 1, "c": "سوائل الجسم ومراقبة الأدوية والسموم", "e": "تسبب الجرعات الشديدة من الأفيونات حماضا تنفسيا بسبب ضعف مركز التنفس، وميوزا وإمساكا وضعفا، ويمكن أن تؤدي الجرعات العالية إلى الوفاة، وعلاج الجرعة الزائدة يتضمن مضاد الأفيون النالوكسون، وتُستخدم الاختبارات المناعية لكشف المورفين والكودائين ويتم التأكيد بتقنية GC/MS.", "o": ["الخالبات مثل EDTA، وتسبب ارتفاع ضغط الدم فقط", "مضاد الأفيون النالوكسون (naloxone)، وتسبب الجرعات الشديدة ضعف مركز التنفس وميوزا (miosis) وإمساكا", "اللوكوفورين، وتسبب فرط نشاط فقط", "الأكسجين 100% فقط، وتسبب توسع الحدقة دائما"], "q": "ما علاج الجرعة الزائدة من الأفيونات (Opiates)، وما أبرز مظاهرها؟"}, {"a": 2, "c": "الواسمات الورمية والتقييم الغذائي والمسنّون والأطفال", "e": "باستثناء PSA، لا يوجد واسم ورمي معين يمكن استخدامه بشكل ملائم لمسح السكان غير العرضيين.", "o": ["CA-125", "CEA", "PSA", "AFP"], "q": "أي واسم ورمي هو الاستثناء الوحيد الذي يمكن استخدامه بشكل ملائم لمسح السكان غير العرضيين، حسب المصدر؟"}, {"a": 0, "c": "الواسمات الورمية والتقييم الغذائي والمسنّون والأطفال", "e": "الحد الأعظمي الطبيعي لـ AFP المصلي هو 15 نغ/مل عند البالغين الأصحاء، والمستويات الأعلى من 500 نغ/مل عند الأفراد عاليي الخطورة تعتبر مشخصة لـ HCC. وتصل تراكيز AFP عند الرضع إلى مستويات البالغين عند العمر 7-10 أشهر.", "o": ["15 نغ/مل، وأكثر من 500 نغ/مل", "35 وحدة/مل، وأكثر من 95 وحدة/مل", "4 نغ/مل، وأكثر من 10 نغ/مل", "2.5 نغ/مل، وأكثر من 100000"], "q": "ما الحد الأعظمي الطبيعي لـ AFP المصلي عند البالغين الأصحاء، وما المستوى الذي يعتبر مشخصا لسرطان الخلية الكبدية (HCC) عند الأفراد عاليي الخطورة؟"}, {"a": 1, "c": "الواسمات الورمية والتقييم الغذائي والمسنّون والأطفال", "e": "القيمة الحدية العليا في المصل لـ CA-125 هي 35 وحدة/مل، وهو الواسم الوحيد المقبول سيرولوجيا لسرطان المبيض، ويفيد في مراقبة العلاج، ولا يستخدم كاختبار مسحي عند النساء غير العرضيات.", "o": ["4 نغ/مل، لتشخيص سرطان البروستات", "35 وحدة/مل، وهو الواسم الوحيد المقبول سيرولوجيا لسرطان المبيض ويفيد في مراقبة العلاج", "15 نغ/مل، لتصنيف سرطان الخصية", "500 نغ/مل، لمراقبة سرطان البنكرياس"], "q": "ما القيمة الحدية العليا في المصل لـ CA-125، وما استخدامه الرئيسي؟"}, {"a": 2, "c": "الواسمات الورمية والتقييم الغذائي والمسنّون والأطفال", "e": "يعد CEA الواسم الورمي الأكثر استخداما للسرطان القولوني المستقيمي، ومجاله المرجعي الطبيعي في المصل هو 2.5-5 نغ/مل حسب طريقة المعايرة، ولا يستخدم كاختبار مسحي للسرطان القولوني المستقيمي.", "o": ["CA-125، و35 وحدة/مل", "PSA، و4 نغ/مل", "CEA، و2.5-5 نغ/مل", "AFP، و15 نغ/مل"], "q": "ما الواسم الورمي الأكثر استخداما للسرطان القولوني المستقيمي، وما مجاله المرجعي الطبيعي في المصل؟"}, {"a": 0, "c": "الواسمات الورمية والتقييم الغذائي والمسنّون والأطفال", "e": "ترتفع hCG بشكل ثابت لدى المرأة المصابة بـ GTDs، وغالبا ما تتواجد بمستويات أعلى من الطبيعي (أكثر من 100000)، ويستخدم هذا الواسم لمراقبة علاج GTD وتحديد الإنذار.", "o": ["أكثر من 100000، ويستخدم لمراقبة علاج GTD وتحديد الإنذار", "أقل من 15 نغ/مل، ويستخدم لمسح سرطان المبيض", "أكثر من 500 نغ/مل، ويستخدم لتشخيص سرطان البنكرياس", "35 وحدة/مل، ويستخدم لمراقبة سرطان الثدي"], "q": "في أمراض الأرومة الغاذية الحملية (GTDs)، ما مستوى hCG الذي غالبا ما تتجاوزه المريضة، وما فائدة قياسه؟"}, {"a": 1, "c": "الواسمات الورمية والتقييم الغذائي والمسنّون والأطفال", "e": "في ورم الكيس المحي يكون AFP مرتفعا وHCG غائبا، بينما في السرطانة المشيمائية يكون AFP غائبا وHCG مرتفعا، وفي الورم المسخي يكون كلاهما غائبا.", "o": ["السرطانة المشيمائية", "ورم الكيس المحي (الورم الجيني)", "الورم المسخي", "الورم المنوي النقي"], "q": "حسب جدول تصنيف أورام الخلايا الجذعية بـ AFP وHCG، أي ورم يكون فيه AFP مرتفعا وHCG غائبا؟"}, {"a": 0, "c": "الواسمات الورمية والتقييم الغذائي والمسنّون والأطفال", "e": "يستخدم CA 19-9 في مراقبة سرطان البنكرياس، بينما يستخدم CA 15-5 (وكذلك CA 27-29) في الاستجابة للعلاج وتحديد نكس الورم في نقائل سرطان الثدي.", "o": ["CA 19-9 لمراقبة سرطان البنكرياس، وCA 15-5 للاستجابة للعلاج وتحديد نكس نقائل سرطان الثدي", "CA 19-9 لسرطان المبيض، وCA 15-5 لسرطان البروستات", "CA 19-9 لسرطان الكبد، وCA 15-5 لسرطان القولون", "كلاهما لتشخيص ورم الأرومة العصبية"], "q": "ما الاستخدام السريري لـ CA 19-9 مقابل CA 15-5؟"}, {"a": 1, "c": "الواسمات الورمية والتقييم الغذائي والمسنّون والأطفال", "e": "عندما تكون خلايا ورم الثدي إيجابية لمستقبلات الاستروجين، فإن المعالجة الكيميائية بالتيموكسيفين تكون أكثر فعالية، وتستخدم هذه المستقبلات كمؤشر للعلاج الهرموني.", "o": ["العلاج بالأنسولين", "العلاج بالتيموكسيفين", "العلاج بالوارفارين", "العلاج بالميثوتريكسات"], "q": "عندما تكون خلايا ورم الثدي إيجابية لمستقبلات الاستروجين، ما العلاج الكيميائي الذي يكون أكثر فعالية؟"}, {"a": 2, "c": "الواسمات الورمية والتقييم الغذائي والمسنّون والأطفال", "e": "يستخدم الكالسيتونين في المسح والتشخيص والاستجابة للعلاج ومراقبة تكرار حدوث السرطانة الدرقية النخاعية (MTC)، وهو الاختبار الأفضل لتشخيصها.", "o": ["البرولاكتين (PRL)", "هرمون النمو (GH)", "الكالسيتونين", "الكورتيزول"], "q": "ما الواسم الهرموني المستخدم في المسح والتشخيص ومراقبة تكرار حدوث السرطانة الدرقية النخاعية (MTC)؟"}, {"a": 0, "c": "الواسمات الورمية والتقييم الغذائي والمسنّون والأطفال", "e": "الأورام السرطاوية أورام مفرزة للسيروتونين، وتشخيصها يتم عبر الكشف عن 5-HIAA، ناتج استقلاب السيروتونين، والطريقة المفضلة هي عيار 5-HIAA في البول.", "o": ["عيار 5-HIAA في البول", "عيار PSA في المصل", "عيار CA-125 في المصل", "عيار AFP في المصل"], "q": "ما الاختبار المفضل لتشخيص الورم السرطاوي (الكارسينوئيد)؟"}, {"a": 0, "c": "الواسمات الورمية والتقييم الغذائي والمسنّون والأطفال", "e": "تستعمل مشاركة كل من HVA وVMA لتشخيص ورم الأرومة العصبية، وتقاس في بول 24 ساعة بتقنية HPLC. وورم الأرومة العصبية هو الورم الخبيث الأشيع عند الأطفال حسب المصدر.", "o": ["HVA وVMA في بول 24 ساعة", "5-HIAA والسيروتونين في المصل", "الميتانفرينات والكالسيتونين في المصل", "AFP وCA-125 في المصل"], "q": "أي مشاركة من المستقلبات البولية تستخدم لتشخيص ورم الأرومة العصبية (neuroblastoma)؟"}, {"a": 1, "c": "الواسمات الورمية والتقييم الغذائي والمسنّون والأطفال", "e": "إذا كانت المعالجة فعالة تنخفض مستويات الواسم الورمي بشكل واضح، أما إذا بقيت مرتفعة فإن ذلك يشير إلى فشل المعالجة. وقد ترتفع الواسمات قبل عدة أشهر من تشخيص النكس بوسائل أخرى.", "o": ["نجاح العلاج", "فشل المعالجة", "شفاء تام من الورم", "عدم وجود ورم أصلا"], "q": "في مراقبة فعالية العلاج بالواسمات الورمية، ماذا يعني بقاء مستويات الواسم مرتفعة بعد العلاج؟"}, {"a": 0, "c": "الواسمات الورمية والتقييم الغذائي والمسنّون والأطفال", "e": "التأثير المعلق يحدث عندما تزداد تراكيز المادة المحللة بشكل كبير فتشبع الأضداد في القياس، وبالتالي نحصل على نتيجة سلبية، وعندها يجرى التمديد.", "o": ["عندما تزداد تراكيز المادة المحللة بشكل كبير تشبع الأضداد في القياس، فيعطي نتيجة سلبية، ويجرى عندها التمديد", "عندما ينخفض الواسم يعطي نتيجة إيجابية كاذبة دائما", "عندما تتلف العينة بالحرارة يعطي نتيجة طبيعية", "عندما يستخدم كيت مختلف يعطي نتيجة صحيحة دائما"], "q": "ما التأثير المعلق (Hook Effect) في المقايسة المناعية للواسمات الورمية؟"}, {"a": 1, "c": "الواسمات الورمية والتقييم الغذائي والمسنّون والأطفال", "e": "يستخدم الألبومين لتحديد كواشيوركور، وهو نقص البروتين الذي يؤدي إلى نقص واضح في الألبومين، والسغل، وهو نقص الطاقة دون نقص البروتين حيث يبقى مستوى الألبومين طبيعيا رغم خسارة كبيرة في وزن الجسم.", "o": ["في كواشيوركور يبقى الألبومين طبيعيا، وفي السغل ينخفض بشدة", "في كواشيوركور ينخفض الألبومين بوضوح لأنه نقص بروتين، وفي السغل يبقى الألبومين طبيعيا رغم خسارة كبيرة في الوزن لأنه نقص طاقة دون نقص بروتين", "في كليهما يرتفع الألبومين", "لا علاقة للألبومين بأي منهما"], "q": "الألبومين عمره النصفي حوالي 20 يوما. كيف يفرق بين كواشيوركور (Kwashiorkor) والسغل (Marasmus)؟"}, {"a": 3, "c": "الواسمات الورمية والتقييم الغذائي والمسنّون والأطفال", "e": "يصنف سوء التغذية بحسب الألبومين إلى: طبيعي (35 غ/ل أو أكثر)، وخفيف (29-35 غ/ل)، ومتوسط (24-29 غ/ل)، واستنزاف الألبومين (أقل من 24 غ/ل).", "o": ["35 غ/ل أو أكثر", "29-35 غ/ل", "24-29 غ/ل", "أقل من 24 غ/ل"], "q": "حسب تصنيف سوء التغذية بمستوى الألبومين، أي مستوى يدل على استنزاف الألبومين؟"}, {"a": 0, "c": "الواسمات الورمية والتقييم الغذائي والمسنّون والأطفال", "e": "بسبب قصر العمر النصفي للترانستيريتين (يومان) وانخفاض تركيزه، فهو مؤشر أفضل من الألبومين والترانسفيرين في البروتين الحشوي والتوازن النيتروجيني الإيجابي، ومؤشر ممتاز في مراقبة تأثيرات المعالجة الغذائية قصيرة الأمد.", "o": ["لأن عمره النصفي يومان فقط، وتكون استجابته لانخفاض المدخول الغذائي سريعة حتى إذا كان المدخول البروتيني غير كاف لمدة 4 أيام", "لأن عمره النصفي 20 يوما", "لأنه لا يتأثر بأمراض الكبد", "لأنه يرتفع في سوء التغذية"], "q": "لماذا يعد الترانستيريتين (Transthyretin) مؤشرا أفضل من الألبومين لمراقبة المعالجة الغذائية قصيرة الأمد؟"}, {"a": 3, "c": "الواسمات الورمية والتقييم الغذائي والمسنّون والأطفال", "e": "يستخدم RBP لمراقبة التغيرات قصيرة الأمد للحالة الغذائية، إذ يعتمد فائدته على عمره الحيوي القصير (12 ساعة) وعلى تركيزه المنخفض.", "o": ["الألبومين (20 يوما)", "الترانسفيرين (9 أيام)", "الترانستيريتين (48 ساعة)", "البروتين الرابط للريتينول RBP (12 ساعة)"], "q": "أي بروتين مصلي له أقصر عمر نصفي بين الآتية، ويستخدم لمراقبة التغيرات قصيرة الأمد للحالة الغذائية؟"}, {"a": 0, "c": "الواسمات الورمية والتقييم الغذائي والمسنّون والأطفال", "e": "عند الأصحاء هناك توازن بين معدل البناء والهدم، ويكون التوازن النيتروجيني حوالي صفر. وينخفض المدخول الغذائي أثناء الشدة أو الرضوض أو الحروق، مما يقود إلى توازن نيتروجيني سلبي، وخلال الشفاء يصبح إيجابيا بسبب الدعم الغذائي.", "o": ["حوالي صفر عند الأصحاء، ويصبح سلبيا أثناء الشدة أو الرضوض أو الحروق بسبب انخفاض المدخول الغذائي", "موجبا دائما عند الأصحاء، وسلبيا أثناء الشفاء", "صفر دائما حتى في الشدة", "سلبيا عند الأصحاء، وموجبا في الشدة"], "q": "ما التوازن النيتروجيني عند الأصحاء، ومتى يصبح سلبيا؟"}, {"a": 1, "c": "الواسمات الورمية والتقييم الغذائي والمسنّون والأطفال", "e": "يعاني نحو 2 من 3 أشخاص من زيادة وزن (BMI 25-29.9) أو سمنة (BMI 30 أو أكثر)، وبالمقابل هناك من يعانون سوء تغذية ونقص وزن (BMI أقل من 18.5).", "o": ["السمنة BMI 25-29.9، ونقص الوزن BMI أقل من 30", "السمنة BMI 30 أو أكثر، ونقص الوزن BMI أقل من 18.5", "السمنة BMI أقل من 18.5، ونقص الوزن BMI 30 أو أكثر", "السمنة BMI 20-25، ونقص الوزن BMI أقل من 25"], "q": "حسب المصدر، ما تصنيف مؤشر كتلة الجسم (BMI) للسمنة ونقص الوزن؟"}, {"a": 2, "c": "الواسمات الورمية والتقييم الغذائي والمسنّون والأطفال", "e": "تحدد المتلازمة الاستقلابية بوجود 3 معايير أو أكثر من: زيادة محيط الخصر (نساء 88 سم، رجال 102 سم)، وشحوم ثلاثية 150 ملغ/دل أو أكثر، وغلوكوز صيامي 100 ملغ/دل أو أكثر، وانخفاض HDL (نساء أقل من 50، رجال أقل من 40 ملغ/دل)، وارتفاع ضغط الدم 130/85 مم زئبقي أو أكثر.", "o": ["معيار واحد", "معياران", "3 معايير أو أكثر", "5 معايير كلها"], "q": "كم معيارا مطلوبا لتشخيص المتلازمة الاستقلابية حسب المصدر؟"}, {"a": 0, "c": "الواسمات الورمية والتقييم الغذائي والمسنّون والأطفال", "e": "نقص فيتامين A يؤدي إلى عمى ليلي، وعندما تطول الفترة يمكن أن يصبح عمى كليا، وتصبح الخلايا الظهارية جافة ومتقرنة. والحصة المنصوح بها 900 مكغ/يوم للرجال و700 مكغ/يوم للنساء.", "o": ["عمى ليلي، وعندما تطول الفترة يمكن أن يصبح عمى كليا", "كساح عند الصغار فقط", "نزف من كدمات خفيفة", "فقر دم انحلالي"], "q": "ما العرض الناتج عن نقص فيتامين A، وما مصيره إذا طالت مدة النقص؟"}, {"a": 0, "c": "الواسمات الورمية والتقييم الغذائي والمسنّون والأطفال", "e": "النقص الشديد لفيتامين D عند الأطفال يقود إلى الكساح، وعند البالغين إلى تلين العظام، والمستقلب الأكثر فعالية هو 1,25 ثنائي هيدروكسي D3 الذي يحرض الامتصاص المعوي للكالسيوم والفوسفات.", "o": ["الكساح عند الأطفال وتلين العظام (osteomalacia) عند البالغين، والمستقلب الأكثر فعالية هو 1,25 ثنائي هيدروكسي D3", "الإسقربوط عند الجميع، والمستقلب هو الريتينول", "البري بري عند الجميع، والمستقلب هو الثيامين", "البلاغرا عند الجميع، والمستقلب هو النياسين"], "q": "ما مرض نقص فيتامين D عند الأطفال وعند البالغين، وما المستقلب الأكثر فعالية منه؟"}, {"a": 0, "c": "الواسمات الورمية والتقييم الغذائي والمسنّون والأطفال", "e": "فيتامين K أساسي في تشكيل البروثرومبين وبروتينات تخثرية أخرى (البروتين C، البروتين S، العوامل 7 و9 و10) في الكبد، وعند استخدام مضادات فيتامين K مثل الوارفارين فإن هذه العوامل تصطنع لكن بشكل غير فعال.", "o": ["يفيد في تشكيل البروثرومبين والبروتين C والبروتين S والعوامل 7 و9 و10، ومضادات فيتامين K مثل الوارفارين تجعلها تصطنع لكن بشكل غير فعال", "يفيد فقط في الهيموغلوبين، والوارفارين يرفعها", "يفيد فقط في الألبومين، والوارفارين لا يؤثر عليها", "يفيد في الكولاجين فقط، والوارفارين يثبطه"], "q": "في أي بروتينات تخثرية يفيد فيتامين K، وماذا يفعل الوارفارين بها؟"}, {"a": 0, "c": "الواسمات الورمية والتقييم الغذائي والمسنّون والأطفال", "e": "الفولات بالكرية الحمراء هو المؤشر المخبري الأفضل لاستقصاء عوز الفولات، وعند حدوث العوز فإن مستوياته المصلية تنخفض أولا، ثم تنخفض مستوياته في الكريات الحمر. والعرض السريري الأكثر وضوحا لعوز الفولات هو فقر الدم كبير الكريات.", "o": ["الفولات في الكريات الحمر هو المؤشر الأفضل، ومستوياته المصلية تنخفض أولا ثم تنخفض مستوياته في الكريات الحمر", "الفولات في البول هو المؤشر الأفضل، ومستويات الكريات تنخفض أولا", "الهيموغلوبين هو المؤشر الأفضل، ولا ينخفض الفولات أبدا", "فيتامين B12 هو المؤشر الأفضل، والفولات لا يتغير"], "q": "ما المؤشر المخبري الأفضل لاستقصاء عوز الفولات، وأي مستوى ينخفض أولا عند حدوث العوز؟"}, {"a": 0, "c": "الواسمات الورمية والتقييم الغذائي والمسنّون والأطفال", "e": "قياس حمض الميتيل مالونيك هو أكثر دقة واختبار أكثر تحديدا لعوز فيتامين B12، ويسبب عوز B12 اعتلالين كبيرين هما فقر الدم الضخم والاعتلال العصبي. والمجال المرجعي لـ B12 هو 110-800 بكغ/مل.", "o": ["قياس حمض الميتيل مالونيك، ويسبب فقر الدم الضخم والاعتلال العصبي", "قياس الفولات في المصل، ويسبب الكساح وتلين العظام", "قياس الألبومين، ويسبب كواشيوركور فقط", "قياس الحديد، ويسبب النزف فقط"], "q": "ما الاختبار الأكثر دقة وتحديدا لعوز فيتامين B12، وما الاعتلالان الكبيران اللذان يسببهما عوزه؟"}, {"a": 1, "c": "الواسمات الورمية والتقييم الغذائي والمسنّون والأطفال", "e": "مرض عوز الزنك هو التهاب الجلد المعوي (acrodermatitis enteropathica)، والزنك معدن أساسي لأكثر من 200 أنزيم، وقيم الزنك في المصل هي 60-120 مكغ/دل. وعوز الزنك الحاد عند مرضى TPN يتظاهر بإسهال والتهاب بالجلد المحيط بالفم وسقوط شعر وفقدان شهية.", "o": ["داء ويلسون، و70-155 مكغ/دل", "التهاب الجلد المعوي (acrodermatitis enteropathica)، وقيم الزنك في المصل 60-120 مكغ/دل", "داء كيشان، و23-190 مكغ/ل", "داء مينكس، و123-320 ملغ/دل"], "q": "ما مرض عوز الزنك، وما قيم الزنك في المصل؟"}, {"a": 0, "c": "الواسمات الورمية والتقييم الغذائي والمسنّون والأطفال", "e": "في داء ويلسون يوجد نقص سيرولو لكوليسترول الكلي وحمض البول، وينخفض الألبومين وتصفية الكرياتينين وT3 والبروتين الكلي والترانسفيرين، بينما يبقى الصوديوم والكلور والكورتيزول والأنسولين الصيامي دون تبدل.", "o": ["يبقى الصوديوم دون تبدل، وينخفض الألبومين وتصفية الكرياتينين", "يبقى الألبومين دون تبدل، وينخفض الصوديوم", "يبقى الكوليسترول الكلي دون تبدل، وينخفض السكر الصيامي", "يبقى حمض البول دون تبدل، وينخفض GGT"], "q": "حسب جدول التغيرات مع العمر، أي تحليل يبقى دون تبدل عند المسنين، وأي تحليل ينخفض؟"}, {"a": 0, "c": "الواسمات الورمية والتقييم الغذائي والمسنّون والأطفال", "e": "تشير التقديرات إلى أن نحو 30 بالمئة من النساء المسنات و20 بالمئة من الرجال المسنين لديهم ترقق بالعظم، والقيم التحليلية الكيميائية عادة طبيعية، وأهم اختلاط لترقق العظام هو كسر عظم الورك.", "o": ["نحو 30 بالمئة من النساء المسنات و20 بالمئة من الرجال المسنين، وأهم اختلاط هو كسر عظم الورك، والقيم الكيميائية عادة طبيعية بما فيها الكالسيوم والفوسفور والمغنيزيوم والفوسفاتاز القلوية وهرمونات الدرق والباراثورمون", "نحو 5 بالمئة عند الجميع، وأهم اختلاط هو العمى، والقيم مرتفعة دائما", "نحو 90 بالمئة عند الجميع، وأهم اختلاط هو النزف، والقيم منخفضة دائما", "لا يحدث ترقق عظم عند المسنين"], "q": "ما نسبة ترقق العظم عند المسنات والمسنين، وما أهم اختلاط له، وكيف تكون القيم الكيميائية عادة؟"}, {"a": 0, "c": "الواسمات الورمية والتقييم الغذائي والمسنّون والأطفال", "e": "إن وجود غلوكوز بالبول خلال المرحلة الأولية من التغذية بالحقن عند الرضع هو إشارة على أن تسريب المحلول السكري سريع جدا. وهذا هو محتوى البول الوحيد المستخدم هنا، مقتصرا على مقدمة فحص البول في هذا الملف.", "o": ["أن تسريب المحلول السكري سريع جدا", "أن التغذية بالحقن متوقفة تماما", "أن الرضيع مصاب حتما بالسكري", "أن الكلية سليمة تماما ولا حاجة للمراقبة"], "q": "وجود غلوكوز بالبول خلال المرحلة الأولية من التغذية بالحقن (TPN) عند الرضع يدل على ماذا؟"}, {"c": "فحص البول: الأساسيات والمسح الكيميائي", "q": "لماذا تُعد عينة البول الصباحي هي العينة المفضلة عادة لفحص البول؟", "o": ["لأنها الأقل تلوثا بالجراثيم", "لأنها الأكثر تركيزا", "لأنها الأعلى حجما", "لأنها الأقل حموضة"], "a": 1, "e": "عينة
